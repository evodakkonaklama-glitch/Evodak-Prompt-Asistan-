<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tedavi Ön Başvurusu · Ankara Sağlık Turizmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: üstte marka + dil seçici; altında adım adım form kartı (sol) ve "sonra ne olur" bilgi sütunu (sağ); telefonda tek sütun */
:root{
  --bg:#f2efe9; --surface:#fdfcfa; --stone:#e9e4da; --line:#d9d2c4; --fg:#1c2321; --muted:#5d6661;
  --accent:#1f6b5c; --accent-ink:#ffffff; --accent-soft:#e0ece8; --err:#a3321f; --err-soft:#f7e3de; --warn:#8a5a14; --warn-soft:#f5ead6;
  --display:"Literata",Georgia,serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --arabic:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1a201e; --stone:#202826; --line:#2e3835; --fg:#e6ebe8; --muted:#9ca6a1;
  --accent:#6cc2ad; --accent-ink:#0f1a17; --accent-soft:#1c3530; --err:#f08b78; --err-soft:#3a201b; --warn:#e3ad62; --warn-soft:#34291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1a201e; --stone:#202826; --line:#2e3835; --fg:#e6ebe8; --muted:#9ca6a1;
  --accent:#6cc2ad; --accent-ink:#0f1a17; --accent-soft:#1c3530; --err:#f08b78; --err-soft:#3a201b; --warn:#e3ad62; --warn-soft:#34291a; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
[dir="rtl"] body{font-family:var(--arabic)}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.01em}
[dir="rtl"] .brand{font-family:var(--arabic)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:600 14px var(--body);background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.langs button[lang="ar"]{font-family:var(--arabic)}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hero{display:grid;gap:8px;margin-bottom:20px;max-width:62ch}
h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.5vw,36px);line-height:1.15;margin:0;text-wrap:balance}
[dir="rtl"] h1{font-family:var(--arabic);font-weight:700}
.hero p{margin:0;color:var(--muted)}
.demo{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.demo b{color:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.steps{list-style:none;margin:0;padding:14px 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-bottom:1px solid var(--line)}
.steps li{display:grid;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.steps li::before{content:"";height:4px;border-radius:2px;background:var(--stone)}
.steps li.done::before,.steps li.on::before{background:var(--accent)}
.steps li.on{color:var(--fg)}
@media (max-width:520px){.steps li span{display:none}.steps li.on span{display:inline}}
form{padding:20px 16px 18px}
@media (min-width:600px){form{padding:24px 26px 22px}}
.step{display:grid;gap:18px}
.step h2{font-family:var(--display);font-size:21px;font-weight:600;margin:0}
[dir="rtl"] .step h2{font-family:var(--arabic);font-weight:700}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.f{display:grid;gap:6px;min-width:0}
.f > label,.f > .lbl{font-weight:600;font-size:14.5px}
.opt{font-weight:500;color:var(--muted);font-size:13px}
.req::after{content:" *";color:var(--err)}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
  font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
[aria-invalid="true"]{border-color:var(--err)!important}
.err{margin:0;color:var(--err);font-size:13.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:600;background:var(--bg)}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.hint{margin:0;color:var(--muted);font-size:14px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.check a{color:var(--accent)}
.sum{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:12px;padding:8px 12px;font-size:14.5px;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0}
.sum dt{color:var(--muted);margin:0}
.sum dd{margin:0;overflow-wrap:anywhere}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.btn{font:700 15.5px var(--body);border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
[dir="rtl"] .btn{font-family:var(--arabic)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:progress}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ok{padding:28px 20px;display:grid;gap:12px;text-align:center;justify-items:center}
.ok .mark{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:28px;font-weight:700}
.ok h2{font-family:var(--display);margin:0;font-size:24px}
[dir="rtl"] .ok h2{font-family:var(--arabic)}
.ref{font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.06em;background:var(--stone);border-radius:8px;padding:8px 14px;direction:ltr}
aside{display:grid;gap:16px}
@media (min-width:881px){aside{position:sticky;top:16px}}
.info{padding:16px 18px}
.info h3{margin:0 0 10px;font-size:15px;font-weight:700}
.info ol{margin:0;padding-inline-start:20px;display:grid;gap:8px;font-size:14.5px;color:var(--muted)}
.info p{margin:0;font-size:14.5px;color:var(--muted)}
.urgent{border-color:var(--err-soft);background:var(--err-soft)}
.urgent p{color:var(--fg)}
.quick{display:grid;gap:8px}
.quick a{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:10px 12px;border:1px solid var(--line);color:var(--fg)}
.quick a.wa{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;text-align:center;font-weight:600;user-select:all}
.doclist{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:15px}
.note2{margin:0;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.sendbox{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.sendh{margin:0;font-size:17px}
.send{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ch{display:grid;gap:2px;text-align:center;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 10px;background:var(--bg);font-size:15.5px}
.ch small{font-size:12px;font-weight:600}
.ch.wa{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#preview{font-size:14px;background:var(--stone);white-space:pre-wrap}
.ok2{margin:0;color:var(--accent);font-weight:700;font-size:14px}
.ok .send{width:100%;max-width:520px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Ankara Sağlık Turizmi</div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-l="en" lang="en">English</button>
      <button type="button" data-l="ar" lang="ar">العربية</button>
      <button type="button" data-l="ru" lang="ru">Русский</button>
      <button type="button" data-l="tr" lang="tr">Türkçe</button>
    </div>
  </div>

  <div class="hero">
    <h1 data-t="title"></h1>
    <p id="intro"></p>
  </div>

  <p class="demo" id="demo" hidden><b data-t="demo_b"></b> <span data-t="demo"></span></p>

  <div class="grid">
    <div class="card">
      <ol class="steps" id="steps">
        <li><span data-t="s1"></span></li>
        <li><span data-t="s2"></span></li>
        <li><span data-t="s3"></span></li>
        <li><span data-t="s4"></span></li>
      </ol>

      <form id="form" novalidate>

        <!-- 1 -->
        <section class="step" data-step="1">
          <h2 data-t="s1"></h2>
          <div class="f">
            <span class="lbl req" data-t="who"></span>
            <div class="chips">
              <label class="chip"><input type="radio" name="who" value="patient" id="who_p" checked><span data-t="who_patient"></span></label>
              <label class="chip"><input type="radio" name="who" value="relative" id="who_r"><span data-t="who_relative"></span></label>
            </div>
          </div>
          <div class="row" id="relRow" hidden>
            <div class="f"><label for="applicant_name" class="req" data-t="applicant_name"></label><input id="applicant_name" name="applicant_name" type="text" autocomplete="name"><p class="err" hidden></p></div>
            <div class="f"><label for="relation" class="req" data-t="relation"></label><input id="relation" name="relation" type="text"><p class="err" hidden></p></div>
          </div>
          <div class="row">
            <div class="f"><label for="patient_name" class="req" data-t="patient_name"></label><input id="patient_name" name="patient_name" type="text" autocomplete="name" required><p class="err" hidden></p></div>
            <div class="f"><label for="birth_year" class="req" data-t="birth_year"></label><input id="birth_year" name="birth_year" type="number" inputmode="numeric" min="1910" max="2026" required><p class="err" hidden></p></div>
          </div>
          <div class="row">
            <div class="f"><label for="sex"><span data-t="sex"></span> <span class="opt" data-t="optional"></span></label>
              <select id="sex" name="sex"><option value=""></option><option value="female" data-t="sex_f"></option><option value="male" data-t="sex_m"></option><option value="na" data-t="sex_na"></option></select></div>
            <div class="f"><label for="language" data-t="language"></label>
              <select id="language" name="language"><option value="en" lang="en">English</option><option value="ar" lang="ar">العربية</option><option value="ru" lang="ru">Русский</option><option value="tr" lang="tr">Türkçe</option></select></div>
          </div>
          <div class="row">
            <div class="f"><label for="country" class="req" data-t="country"></label><input id="country" name="country" type="text" autocomplete="country-name" required><p class="err" hidden></p></div>
            <div class="f"><label for="city"><span data-t="city"></span> <span class="opt" data-t="optional"></span></label><input id="city" name="city" type="text" autocomplete="address-level2"></div>
          </div>
          <div class="row">
            <div class="f"><label for="phone" class="req" data-t="phone"></label><input id="phone" name="phone" type="tel" dir="ltr" autocomplete="tel" placeholder="+90 5xx xxx xx xx" required><p class="err" hidden></p></div>
            <div class="f"><label for="email"><span data-t="email"></span> <span class="opt" data-t="optional"></span></label><input id="email" name="email" type="email" dir="ltr" autocomplete="email"><p class="err" hidden></p></div>
          </div>
          <div class="f">
            <span class="lbl" data-t="contact_pref"></span>
            <div class="chips">
              <label class="chip"><input type="radio" name="contact_pref" value="whatsapp" checked><span>WhatsApp</span></label>
              <label class="chip"><input type="radio" name="contact_pref" value="phone"><span data-t="c_phone"></span></label>
              <label class="chip"><input type="radio" name="contact_pref" value="telegram"><span>Telegram</span></label>
              <label class="chip"><input type="radio" name="contact_pref" value="email"><span data-t="c_email"></span></label>
            </div>
          </div>
          <div class="f"><label for="contact_time"><span data-t="contact_time"></span> <span class="opt" data-t="optional"></span></label><input id="contact_time" name="contact_time" type="text"></div>
        </section>

        <!-- 2 -->
        <section class="step" data-step="2" hidden>
          <h2 data-t="s2"></h2>
          <div class="row">
            <div class="f"><label for="area" class="req" data-t="area"></label>
              <select id="area" name="area" required><option value=""></option><option value="oncology" data-t="area_onc"></option><option value="other" data-t="area_other"></option><option value="unsure" data-t="area_unsure"></option></select><p class="err" hidden></p></div>
            <div class="f"><label for="arrival" data-t="arrival"></label>
              <select id="arrival" name="arrival"><option value=""></option><option value="asap" data-t="arr_asap"></option><option value="1m" data-t="arr_1m"></option><option value="1-3m" data-t="arr_3m"></option><option value="unknown" data-t="arr_unknown"></option></select></div>
          </div>
          <div class="f">
            <span class="lbl req" data-t="diagnosed"></span>
            <div class="chips" id="diagnosedChips">
              <label class="chip"><input type="radio" name="diagnosed" value="yes"><span data-t="yes"></span></label>
              <label class="chip"><input type="radio" name="diagnosed" value="no"><span data-t="no"></span></label>
              <label class="chip"><input type="radio" name="diagnosed" value="evaluating"><span data-t="evaluating"></span></label>
            </div>
            <p class="err" hidden></p>
          </div>
          <div class="f"><label for="diagnosis"><span data-t="diagnosis"></span> <span class="opt" data-t="optional"></span></label><input id="diagnosis" name="diagnosis" type="text"></div>
          <div class="f"><label for="previous_treatment"><span data-t="prev"></span> <span class="opt" data-t="optional"></span></label><textarea id="previous_treatment" name="previous_treatment" data-tph="prev_ph"></textarea></div>
          <div class="f"><label for="request" class="req" data-t="request"></label><textarea id="request" name="request" data-tph="request_ph" required></textarea><p class="err" hidden></p></div>
          <div class="row">
            <div class="f"><label for="companions" data-t="companions"></label><input id="companions" name="companions" type="number" inputmode="numeric" min="0" max="6" value="1"></div>
          </div>
        </section>

        <!-- 3 -->
        <section class="step" data-step="3" hidden>
          <h2 data-t="docs_title"></h2>
          <ul class="doclist">
            <li data-t="doc1"></li><li data-t="doc2"></li><li data-t="doc3"></li><li data-t="doc4"></li><li data-t="doc5"></li>
          </ul>
          <p class="note2" data-t="docs_how"></p>
          <p class="hint" data-t="docs_tip"></p>
          <div class="f">
            <span class="lbl req" data-t="docs_ready"></span>
            <div class="chips">
              <label class="chip"><input type="radio" name="docs_ready" value="ready"><span data-t="dr_yes"></span></label>
              <label class="chip"><input type="radio" name="docs_ready" value="some"><span data-t="dr_some"></span></label>
              <label class="chip"><input type="radio" name="docs_ready" value="not_yet"><span data-t="dr_no"></span></label>
            </div>
            <p class="err" hidden></p>
          </div>
        </section>

        <!-- 4 -->
        <section class="step" data-step="4" hidden>
          <h2 data-t="s4"></h2>
          <div>
            <p class="lbl" style="margin:0 0 8px;font-weight:600" data-t="summary"></p>
            <dl class="sum" id="sum"></dl>
          </div>
          <div class="f">
            <label class="check"><input type="checkbox" id="privacy_read" name="privacy_read"><span id="privacyText"></span></label>
            <p class="err" hidden></p>
          </div>
          <div class="f">
            <label class="check"><input type="checkbox" id="consent_health" name="consent_health"><span data-t="consent_health"></span></label>
            <p class="err" hidden></p>
          </div>
          <div class="f">
            <label class="check"><input type="checkbox" id="consent_marketing" name="consent_marketing"><span data-t="consent_marketing"></span></label>
          </div>
          <div class="sendbox">
            <h3 class="sendh" data-t="send_title"></h3>
            <p class="hint" data-t="send_hint"></p>
            <div class="send" id="send">
              <a class="ch wa" data-ch="whatsapp" href="#" target="_blank" rel="noopener"><b>WhatsApp</b><small data-t="rec"></small></a>
              <a class="ch" data-ch="telegram" href="#" target="_blank" rel="noopener"><b>Telegram</b></a>
              <a class="ch" data-ch="instagram" href="#" target="_blank" rel="noopener"><b>Instagram</b></a>
              <a class="ch" data-ch="messenger" href="#" target="_blank" rel="noopener"><b>Messenger</b></a>
            </div>
            <p class="hint" data-t="copy_note"></p>
            <label class="lbl" for="preview" data-t="msg_preview" style="font-weight:600;font-size:14px"></label>
            <textarea id="preview" readonly rows="8"></textarea>
            <p class="ok2" id="copyMsg" hidden></p>
          </div>
        </section>

        <div class="nav">
          <button type="button" class="btn sec" id="back" data-t="back"></button>
          <button type="submit" class="btn" id="next" data-t="next"></button>
        </div>
      </form>


      <div class="ok" id="ok" hidden>
        <div class="mark" aria-hidden="true">✓</div>
        <h2 data-t="ok_title"></h2>
        <div class="ref" id="refOut"></div>
        <p class="hint" id="okBody" style="max-width:48ch"></p>
        <p class="hint" id="okDemo" data-t="ok_demo" hidden></p>
        <p class="hint" data-t="ok_again"></p>
        <div class="send" id="sendAgain"></div>
        <button type="button" class="btn sec" id="edit" data-t="edit"></button>
      </div>
    </div>

    <aside>
      <div class="card info">
        <h3 data-t="next_title"></h3>
        <ol><li data-t="next1"></li><li data-t="next2"></li><li data-t="next3"></li></ol>
      </div>
      <div class="card info">
        <h3 data-t="safe_title"></h3>
        <p data-t="safe"></p>
      </div>
      <div class="card info quick" id="quick" hidden>
        <h3 data-t="quick_title" style="margin:0"></h3>
        <a class="wa" id="waLink" href="#" target="_blank" rel="noopener" data-t="quick_wa"></a>
        <a id="tgLink" href="#" target="_blank" rel="noopener" hidden>Telegram</a>
        <a id="telLink" href="#" data-t="quick_call"></a>
        <div class="num" id="numText"></div>
      </div>
      <div class="card info urgent">
        <h3 data-t="urgent_title"></h3>
        <p data-t="urgent"></p>
      </div>
    </aside>
  </div>
</div>

<script>
/* ============ AYARLAR · yayına almadan önce doldurun ============
   Bu sayfa hiçbir veriyi kendisi göndermez veya saklamaz. Hasta bilgilerini girer,
   son adımda seçtiği uygulamada (WhatsApp, Telegram, Instagram, Messenger) bu bilgilerle
   hazırlanmış bir mesaj açılır; belgelerini o sohbete kendisi ekler.
   Boş bırakılan kanal sayfada gösterilmez. Hiçbiri dolu değilse sayfa önizleme modunda çalışır. */
const CONFIG = {
  WHATSAPP: "905492856005",          // ülke koduyla, başında + veya 0 olmadan: 90532xxxxxxx
  PHONE_DISPLAY: "+90 549 285 60 05",     // görünen numara: +90 532 xxx xx xx
  TELEGRAM: "",          // Telegram kullanıcı adı, @ olmadan
  INSTAGRAM: "",         // Instagram kullanıcı adı, @ olmadan
  MESSENGER: "",         // Facebook sayfa kullanıcı adı (facebook.com/BURASI)
  PRIVACY_URL: "",       // KVKK/GDPR aydınlatma metni sayfası
  RESPONSE_TIME: { tr:"", en:"", ar:"", ru:"" } // ör. tr:"24 saat", en:"24 hours", ar:"24 ساعة", ru:"24 часов"
};
/* ================================================================ */

const LANGS = ["en","ar","ru","tr"];
let lang = "tr";
(function pick(){
  const q = (new URLSearchParams(location.search).get("lang")||location.hash.slice(1)||"").toLowerCase();
  if (LANGS.includes(q)) { lang = q; return; }
  const n = (navigator.language||"tr").slice(0,2).toLowerCase();
  if (LANGS.includes(n)) lang = n;
})();
const CH = {
  whatsapp: CONFIG.WHATSAPP, telegram: CONFIG.TELEGRAM, instagram: CONFIG.INSTAGRAM, messenger: CONFIG.MESSENGER
};
const demo = !Object.values(CH).some(Boolean);
const $ = s => document.querySelector(s);
const form = $("#form");
let step = 1, refCode = "";

function t(k, v){ let s = (T[lang] && T[lang][k]) ?? T.tr[k] ?? k; if (v) for (const x in v) s = s.split("{"+x+"}").join(v[x]); return s; }
function when(){ const r = (CONFIG.RESPONSE_TIME||{})[lang]; return r ? t("rt_in",{rt:r}) : t("rt_soon"); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("title") + " · Ankara Sağlık Turizmi";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-tph]").forEach(el => el.placeholder = t(el.dataset.tph));
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("#intro").textContent = t("intro",{when:when()});
  $("#okBody").textContent = t("ok_body",{when:when()});
  const pt = t("privacy").split("{link}");
  const a = document.createElement("a");
  a.textContent = t("privacy_link"); a.href = CONFIG.PRIVACY_URL || "#"; a.target = "_blank"; a.rel = "noopener";
  $("#privacyText").replaceChildren(document.createTextNode(pt[0]), a, document.createTextNode(pt[1]||""));
  if (!$("#language").dataset.touched) $("#language").value = lang;
  setupQuick(); updateNav(); if (step === 4) renderSummary();
  document.querySelectorAll(".err:not([hidden])").forEach(e => { if (e.dataset.k) e.textContent = t(e.dataset.k); });
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; try { history.replaceState(null,"","#"+lang); } catch(e){} applyLang();
}));
$("#language").addEventListener("change", e => e.target.dataset.touched = "1");

function setupQuick(){
  const has = CONFIG.WHATSAPP || CONFIG.PHONE_DISPLAY || CONFIG.TELEGRAM;
  $("#quick").hidden = !has;
  if (!has) return;
  const wa = $("#waLink"), tg = $("#tgLink"), tel = $("#telLink");
  wa.hidden = !CONFIG.WHATSAPP;
  if (CONFIG.WHATSAPP) wa.href = "https://wa.me/" + CONFIG.WHATSAPP + "?text=" + encodeURIComponent(t("wa_msg"));
  tg.hidden = !CONFIG.TELEGRAM;
  if (CONFIG.TELEGRAM) tg.href = "https://t.me/" + CONFIG.TELEGRAM;
  const digits = (CONFIG.PHONE_DISPLAY || CONFIG.WHATSAPP).replace(/[^\d+]/g,"");
  tel.hidden = !digits;
  tel.href = "tel:" + (digits.startsWith("+") ? digits : "+" + digits);
  $("#numText").textContent = CONFIG.PHONE_DISPLAY || (CONFIG.WHATSAPP ? "+" + CONFIG.WHATSAPP : "");
}

/* --- adım ve doğrulama --- */
function showStep(n){
  step = n;
  document.querySelectorAll(".step").forEach(s => s.hidden = +s.dataset.step !== n);
  document.querySelectorAll("#steps li").forEach((li,i) => { li.className = i+1 < n ? "done" : (i+1 === n ? "on" : ""); });
  if (n === 4){ if (!refCode) refCode = ref(); renderSummary(); }
  updateNav();
  const h = document.querySelector('.step[data-step="'+n+'"] h2');
  if (h) { h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
  document.querySelector(".card").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function updateNav(){
  $("#back").style.visibility = step === 1 ? "hidden" : "visible";
  $("#next").hidden = step === 4;
  $("#next").textContent = t("next");
}
$("#back").addEventListener("click", () => showStep(Math.max(1, step-1)));
document.querySelectorAll('input[name="who"]').forEach(r => r.addEventListener("change", () => { $("#relRow").hidden = !$("#who_r").checked; }));

function fieldErr(el, key){
  const wrap = el.closest(".f"); const p = wrap && wrap.querySelector(".err");
  if (!p) return;
  if (key){ p.dataset.k = key; p.textContent = t(key); p.hidden = false; el.setAttribute("aria-invalid","true"); }
  else { p.hidden = true; el.removeAttribute("aria-invalid"); }
}
function val(id){ return ($("#"+id).value || "").trim(); }
function radioCheck(name){
  const r = form.querySelector('input[name="'+name+'"]:checked'), first = form.querySelector('input[name="'+name+'"]');
  fieldErr(first, r ? null : "required"); return r ? null : first;
}
function validate(n){
  let bad = null;
  const need = id => { const el = $("#"+id); const ok = !!val(id); fieldErr(el, ok ? null : "required"); if (!ok && !bad) bad = el; };
  if (n === 1){
    if ($("#who_r").checked){ need("applicant_name"); need("relation"); }
    else { fieldErr($("#applicant_name")); fieldErr($("#relation")); }
    need("patient_name");
    const y = +val("birth_year"), yEl = $("#birth_year");
    if (!val("birth_year")){ fieldErr(yEl,"required"); bad = bad || yEl; }
    else if (y < 1910 || y > new Date().getFullYear()){ fieldErr(yEl,"bad_year"); bad = bad || yEl; } else fieldErr(yEl);
    need("country");
    const ph = val("phone"), phEl = $("#phone"), digits = ph.replace(/\D/g,"");
    if (!ph){ fieldErr(phEl,"required"); bad = bad || phEl; }
    else if (!(/^(\+|00)/.test(ph)) || digits.length < 8 || digits.length > 16 || /[^\d\s+()\-.]/.test(ph)){ fieldErr(phEl,"bad_phone"); bad = bad || phEl; }
    else fieldErr(phEl);
    const em = val("email"), emEl = $("#email");
    const pref = form.querySelector('input[name="contact_pref"]:checked').value;
    if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ fieldErr(emEl,"bad_email"); bad = bad || emEl; }
    else if (!em && pref === "email"){ fieldErr(emEl,"need_email"); bad = bad || emEl; }
    else fieldErr(emEl);
  }
  if (n === 2){ need("area"); need("request"); bad = bad || radioCheck("diagnosed"); }
  if (n === 3){ bad = bad || radioCheck("docs_ready"); }
  if (n === 4){
    ["privacy_read","consent_health"].forEach(id => { const el = $("#"+id); fieldErr(el, el.checked ? null : "required"); if (!el.checked && !bad) bad = el; });
  }
  if (bad){ bad.focus(); return false; }
  return true;
}
form.addEventListener("input", e => { const el = e.target; if (el.matches('[aria-invalid="true"]') || el.type === "radio" || el.type === "checkbox"){ if ((el.type === "checkbox" && el.checked) || (el.type === "radio") || (el.value||"").trim()) fieldErr(el.type === "radio" ? form.querySelector('input[name="'+el.name+'"]') : el, null); } });
form.addEventListener("submit", e => {
  e.preventDefault();
  if (step < 4 && validate(step)) showStep(step+1);
});

/* --- özet ve mesaj --- */
function optText(id){ const s = $("#"+id); return s.value ? s.options[s.selectedIndex].textContent : ""; }
function radioText(name){ const r = form.querySelector('input[name="'+name+'"]:checked'); return r ? r.nextElementSibling.textContent : ""; }
function rows(){
  return [
    ["who", radioText("who")],
    ...($("#who_r").checked ? [["applicant_name", val("applicant_name")],["relation", val("relation")]] : []),
    ["patient_name", val("patient_name")],["birth_year", val("birth_year")],["sex", optText("sex")],
    ["country", [val("country"), val("city")].filter(Boolean).join(", ")],
    ["phone", val("phone")],["email", val("email")],["contact_pref", radioText("contact_pref")],["contact_time", val("contact_time")],
    ["language", optText("language")],
    ["area", optText("area")],["diagnosed", radioText("diagnosed")],["diagnosis", val("diagnosis")],["prev", val("previous_treatment")],
    ["request", val("request")],["arrival", optText("arrival")],["companions", val("companions")],
    ["docs_ready", radioText("docs_ready")]
  ];
}
function message(){
  const L = [t("msg_head"), t("msg_ref") + ": " + refCode, ""];
  rows().forEach(([k,v]) => { if (v) L.push("• " + t(k) + ": " + v); });
  L.push("", form.querySelector('input[name="docs_ready"]:checked')?.value === "not_yet" ? t("msg_docs_later") : t("msg_docs_now"));
  L.push(t("msg_consent"));
  return L.join("\n");
}
function link(ch){
  const id = CH[ch]; if (!id) return "";
  if (ch === "whatsapp") return "https://wa.me/" + id + "?text=" + encodeURIComponent(message());
  if (ch === "telegram") return "https://t.me/" + id;
  if (ch === "instagram") return "https://ig.me/m/" + id;
  if (ch === "messenger") return "https://m.me/" + id;
}
function renderSummary(){
  $("#sum").innerHTML = rows().filter(([,v]) => v).map(([k,v]) => '<div><dt>'+esc(t(k))+'</dt><dd'+(k==="phone"||k==="email"?' dir="ltr"':'')+'>'+esc(v)+'</dd></div>').join("");
  $("#preview").value = message();
  document.querySelectorAll(".ch").forEach(a => {
    const ch = a.dataset.ch;
    a.hidden = !demo && !CH[ch];
    a.href = link(ch) || "#";
  });
  $("#sendAgain").replaceChildren(...[...document.querySelectorAll("#send .ch")].filter(a => !a.hidden).map(a => { const c = a.cloneNode(true); c.addEventListener("click", onSend); return c; }));
}
function copyMsg(){
  const out = $("#copyMsg"), txt = message();
  const fallback = () => { const p = $("#preview"); p.focus(); p.select(); out.textContent = t("copy_fail"); out.hidden = false; };
  try { navigator.clipboard.writeText(txt).then(() => { out.textContent = t("copied"); out.hidden = false; }, fallback); } catch(e){ fallback(); }
}
function finish(){
  form.hidden = true; $("#steps").hidden = true;
  $("#refOut").textContent = refCode; $("#ok").hidden = false; $("#okDemo").hidden = !demo;
}
function onSend(e){
  const a = e.currentTarget, ch = a.dataset.ch;
  if (!form.hidden && !validate(4)){ e.preventDefault(); return; }
  if (ch !== "whatsapp") copyMsg();
  if (demo || !CH[ch]) e.preventDefault();
  setTimeout(finish, 300);
}
document.querySelectorAll("#send .ch").forEach(a => a.addEventListener("click", onSend));
$("#edit").addEventListener("click", () => { $("#ok").hidden = true; form.hidden = false; $("#steps").hidden = false; showStep(4); });

function ref(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const r = Array.from(crypto.getRandomValues(new Uint8Array(3))).map(b => b.toString(36).padStart(2,"0")).join("").slice(0,4).toUpperCase();
  return "AST-" + String(d.getFullYear()).slice(2) + p(d.getMonth()+1) + p(d.getDate()) + "-" + r;
}

$("#demo").hidden = !demo;
applyLang();
showStep(1);
window.scrollTo(0,0);
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ankara Sağlık Turizmi Paneli</title>
<style>
/* Layout: üstte ince marka + sekme çubuğu, altında seçili görünüm tam yükseklikte */
:root{--bg:#f2efe9;--surface:#fdfcfa;--line:#d9d2c4;--fg:#1c2321;--muted:#5d6661;--accent:#1f6b5c;--accent-ink:#fff;--accent-soft:#e0ece8;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131816;--surface:#1a201e;--line:#2e3835;--fg:#e6ebe8;--muted:#9ca6a1;--accent:#6cc2ad;--accent-ink:#0f1a17;--accent-soft:#1c3530;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131816;--surface:#1a201e;--line:#2e3835;--fg:#e6ebe8;--muted:#9ca6a1;--accent:#6cc2ad;--accent-ink:#0f1a17;--accent-soft:#1c3530;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:700;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button,.share{font:600 14px var(--body);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.share{color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{flex:1 1 auto;position:relative;min-height:0}
.views .tp,.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.brand{display:none}.bar{padding:8px 12px}.tabs button,.share{padding:6px 10px;font-size:13.5px}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:9}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="brand">Ankara Sağlık Turizmi</div>
  <div class="tabs" role="tablist" aria-label="Paneller">
    <button type="button" role="tab" id="tab-panel" aria-controls="w-panel" aria-selected="true">Prompt paneli</button>
    <button type="button" role="tab" id="tab-basvuru" aria-controls="w-basvuru" aria-selected="false">Tedavi ön başvurusu</button>
    <button type="button" role="tab" id="tab-site" aria-controls="w-site" aria-selected="false">Web sitesi yönetimi</button>
  </div>
  <button type="button" class="share" id="share" title="Hastalara gönderilecek başvuru linkini kopyalar">Hasta linki</button>
</header>
<main class="views">
  <h1 class="vh">Ankara Sağlık Turizmi paneli</h1>
  <div class="tp" id="w-panel" role="tabpanel" aria-labelledby="tab-panel"><iframe id="v-panel" title="Prompt paneli" allow="clipboard-write"></iframe></div>
  <div class="tp" id="w-basvuru" role="tabpanel" aria-labelledby="tab-basvuru" hidden><iframe id="v-basvuru" title="Tedavi ön başvurusu" allow="clipboard-write"></iframe></div>
  <div class="tp" id="w-site" role="tabpanel" aria-labelledby="tab-site" hidden><iframe id="v-site" title="Web sitesi yönetimi"></iframe></div>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const SRC_PANEL = "<!doctype html>\n<html lang=\"tr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}<\/style>\n<title>Ankara Sağlık Turizmi Prompt Paneli<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap\">\n<style>\n/* Layout: üst bilgi şeridi + platform seçici, altında bölüm kartları (sol) ve yapışkan özet/kontrol paneli (sağ); telefonda tek sütun */\n:root{\n  --bg:#f3f1ec; --surface:#fbfaf7; --line:#ddd8cd; --fg:#1d2422; --muted:#5f6763;\n  --accent:#1f6b5c; --accent-soft:#e1ede9; --warn:#9a5b12; --warn-soft:#f6ead7; --code:#f0eee8;\n  --display:\"Literata\",Georgia,serif; --body:\"Manrope\",system-ui,sans-serif; --mono:\"JetBrains Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#141917; --surface:#1b2220; --line:#2d3633; --fg:#e7ebe8; --muted:#9aa49f;\n  --accent:#6cc2ad; --accent-soft:#1d3530; --warn:#e2ac63; --warn-soft:#352a1b; --code:#111614; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#141917; --surface:#1b2220; --line:#2d3633; --fg:#e7ebe8; --muted:#9aa49f;\n  --accent:#6cc2ad; --accent-soft:#1d3530; --warn:#e2ac63; --warn-soft:#352a1b; --code:#111614; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}\n.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}\nheader{display:grid;gap:10px;margin-bottom:22px}\n.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\nh1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;text-wrap:balance}\n.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}\n.meta b{color:var(--fg);font-weight:600}\n.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;\n  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:20px;\n  position:sticky;top:env(safe-area-inset-top,0px);z-index:5}\n.seg{display:flex;flex-wrap:wrap;gap:4px}\n.seg button{font:600 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--fg);\n  padding:7px 12px;border-radius:7px;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}\n.btn{font:600 14px var(--body);border:0;background:var(--accent);color:var(--surface);padding:9px 16px;border-radius:7px;cursor:pointer}\n.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);padding:5px 10px;font-size:12px}\nbutton:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}\n@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}\n.sections{display:grid;gap:12px;min-width:0}\ndetails{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}\nsummary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}\nsummary::-webkit-details-marker{display:none}\n.tag{font:500 12px var(--mono);color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}\n.stitle{font-weight:600;flex:1;min-width:0}\n.chev{color:var(--muted);transition:transform .15s}\ndetails[open] .chev{transform:rotate(90deg)}\npre{margin:0;padding:14px;border-top:1px solid var(--line);background:var(--code);font:400 13px/1.6 var(--mono);\n  white-space:pre-wrap;word-break:break-word;overflow-x:auto;border-radius:0 0 10px 10px}\n.ph{color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:0 2px}\naside{display:grid;gap:14px;position:sticky;top:80px}\n@media (max-width:860px){aside{position:static}}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}\n.card h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 8px}\n.card ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px}\n.card p{margin:0;font-size:13.5px;color:var(--muted)}\n.chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{font:500 12px var(--mono);background:var(--warn-soft);color:var(--warn);padding:3px 7px;border-radius:5px}\n.stats{display:flex;gap:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}\n.stats b{display:block;color:var(--fg);font-size:18px}\n.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);\n  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px}\n.fields{display:grid;gap:9px}\n.fields label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}\n.fields input{font:14px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}\n.fields input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}\n.fill{color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 2px}\n.maincol{display:grid;gap:12px;min-width:0}\n.pbody{border-top:1px solid var(--line);padding:14px;display:grid;gap:12px}\n.hint{margin:0;font-size:13.5px;color:var(--muted)}\n.ph3{margin:6px 0 0;font-family:var(--display);font-size:16px;font-weight:600}\n.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}\n.pform label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}\n.pform .wide{grid-column:1/-1}\n.pform input:not([type=checkbox]),.pform select{font:14px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}\n.pform input:focus-visible,.pform select:focus-visible{outline:2px solid var(--accent);outline-offset:0}\n.pform .pcheck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg);grid-column:1/-1}\n.pform .pcheck input{accent-color:var(--accent);width:16px;height:16px}\n.pact{grid-column:1/-1}\n.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.plist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-size:13.5px}\n.plist .pt{flex:1 1 200px;min-width:0}\n.plist .pt b{display:block;font-size:14px}\n.plist .pt span{color:var(--muted)}\n.perm{font:600 11.5px var(--body);padding:2px 7px;border-radius:999px;white-space:nowrap}\n.perm.yes{background:var(--accent-soft);color:var(--accent)}\n.perm.no{background:var(--warn-soft);color:var(--warn)}\n.guide{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:20px}\n.guide > summary{padding:14px 16px}\n.guide > summary h2{font-family:var(--display);font-size:20px;font-weight:600;margin:0;flex:1}\n.guide-body{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}\n.guide-body > *{min-width:0}\n.phase-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}\n.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:st}\n.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}\n.steps li::before{counter-increment:st;content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);\n  font:700 14px var(--body);display:grid;place-items:center;font-variant-numeric:tabular-nums}\n.steps b{display:block;margin-bottom:2px}\n.steps p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}\n.steps .tip{display:block;margin-top:4px;font-size:13px;color:var(--warn)}\n.ol-cont{counter-reset:none}\n.tbl-wrap{overflow-x:auto}\n.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}\n.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}\n.tbl th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}\n.note{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13.5px}\n.note b{color:var(--warn)}\ntextarea.fallback{width:100%;height:160px;font:13px var(--mono);margin-top:8px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div class=\"eyebrow\">Evodak Prompt Asistanı · Rev.10 · Nihai Prompt · Sürüm 4 (uzman revizyonu)<\/div>\n    <h1>Ankara Sağlık Turizmi · Sosyal Medya, Reklam ve Web Paketi<\/h1>\n    <div class=\"meta\">\n      <span>Proje <b>Evodak – arap web tanıtım<\/b><\/span>\n      <span>Tarih <b>12.10.2026<\/b><\/span>\n      <span>Hazırlayan <b>Hakan<\/b><\/span>\n      <span>Diller <b>EN · AR · RU · TR<\/b><\/span>\n    <\/div>\n  <\/header>\n\n  <details class=\"guide\" id=\"rehber\" open>\n    <summary><span class=\"chev\">▸<\/span><h2>Kullanım rehberi ve yol haritası<\/h2><span class=\"tag\">10 adım<\/span><\/summary>\n    <div class=\"guide-body\">\n      <div>\n        <p class=\"phase-h\">Hazırlık · bir kez, yaklaşık 15 dakika<\/p>\n        <ol class=\"steps\">\n          <li><div><b>Marka bilgilerini toplayın<\/b><p>Telefon/WhatsApp (ülke koduyla), Telegram, web adresi, Balgat ofis adresi, Sağlık Bakanlığı yetki belgesi no, anlaşmalı hastaneler ve akreditasyonları, inceleyen hekim, tedavi alanları, ekip dilleri, çalışma saatleri, yanıt süresi, ek hizmetler, aylık reklam bütçesi.<\/p><span class=\"tip\">Emin olmadığınız bilgiyi girmeyin; boş kalırsa yapay zekâ uydurmaz, yer tutucu bırakır.<\/span><\/div><\/li>\n          <li><div><b>Sağdaki \"Marka bilgilerini doldurun\" formunu doldurun<\/b><p>Her alan prompttaki ilgili yer tutucunun yerine yazılır ve yeşil görünür. \"Kalan yer tutucular\" kartı neyin eksik kaldığını gösterir.<\/p><span class=\"tip\">Bilgiler yalnızca bu cihazın tarayıcısında saklanır. Telefonda ve bilgisayarda ayrı ayrı doldurmanız gerekir.<\/span><\/div><\/li>\n          <li><div><b>Yapay zekâ platformunu seçin<\/b><p>Üst çubuktan Claude, ChatGPT, Gemini veya Perplexity'yi seçin; prompt o platformun biçimine göre düzenlenir. Uzun ve 4 dilli üretim için Claude veya ChatGPT önerilir. Perplexity güncel kaynak ve mevzuat doğrulaması için daha uygundur, uzun metin üretimi için değil.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n\n      <div>\n        <p class=\"phase-h\">Üretim · 7 faz, her biri ayrı yanıt<\/p>\n        <ol class=\"steps\" start=\"4\" style=\"counter-reset:st 3\">\n          <li><div><b>\"Promptu kopyala\" ile tamamını alın ve yapay zekâya yapıştırın<\/b><p>Yeni bir sohbet açın; promptu olduğu gibi gönderin, üzerinde değişiklik yapmayın.<\/p><\/div><\/li>\n          <li><div><b>Faz 1'deki eksik veri listesini okuyun<\/b><p>Yapay zekâ ilk yanıtta eksik bilgileri listeler, ardından strateji, takvim, anahtar kelime ve huni haritasını verir. Eksik bir bilgiyi biliyorsanız sohbete yazın, sonra \"devam\" deyin.<\/p><\/div><\/li>\n          <li><div><b>Her fazdan sonra \"devam\" yazın<\/b><p>Faz 2 gönderi metinleri, Faz 3 reklam setleri, Faz 4 web ve SEO/GEO, Faz 5 kampanya ve ölçüm, Faz 6 anında iletişim ve hasta ön başvuru paketi, Faz 7 kalite kontroldür. Bir faz yarıda kalırsa yine \"devam\" yazın.<\/p><span class=\"tip\">Her fazın çıktısını hemen bir dokümana kaydedin; uzun sohbetlerde geri bulmak zorlaşır.<\/span><\/div><\/li>\n        <\/ol>\n      <\/div>\n\n      <div>\n        <p class=\"phase-h\">Kontrol · yayından önce zorunlu<\/p>\n        <ol class=\"steps\" start=\"7\" style=\"counter-reset:st 6\">\n          <li><div><b>Çıktıyı denetleyin<\/b><p>Köşeli parantezde kalan yer tutucuları doldurun. Hastane adı, hekim adı, rakam ve iddiaları gerçek bilgiyle karşılaştırın. Arapça ve Rusça metinleri o dili ana dili olarak konuşan birine okutun. \"Doğrulanmalı\" işaretli her maddeyi kontrol edin.<\/p><\/div><\/li>\n          <li><div><b>Hukuki onay alın<\/b><p>KVKK/GDPR açık rıza metni, sağlık tanıtım mevzuatına uyum ve hasta yorumu kullanımı için bir hukukçunun onayı gereklidir. Onaysız hasta yorumu, fotoğraf veya başarı oranı yayınlamayın.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n\n      <div>\n        <p class=\"phase-h\">Yayına alma ve bakım<\/p>\n        <ol class=\"steps\" start=\"9\" style=\"counter-reset:st 8\">\n          <li><div><b>Çıktıları sahiplerine dağıtın<\/b><p>Aşağıdaki tabloya göre her parçayı ilgili kişiye iletin.<\/p><\/div><\/li>\n          <li><div><b>Düzenli bakım yapın<\/b><p>Her hafta kaçan mesaj ve ilk yanıt süresini kontrol edin. Her ay 4 dilde yapay zekâ görünürlük testini yapıp tabloya işleyin. Her 3 ayda bir web sayfalarını güncelleyin ve prompta yeni bilgileri girip yeni dönem için yeniden çalıştırın.<\/p><\/div><\/li>\n        <\/ol>\n      <\/div>\n\n      <div>\n        <p class=\"phase-h\">Çıktılar nereye gider<\/p>\n        <div class=\"tbl-wrap\">\n          <table class=\"tbl\">\n            <thead><tr><th>Faz<\/th><th>Çıktı<\/th><th>Kim uygular<\/th><th>Nerede<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td>1<\/td><td>Strateji, takvim, anahtar kelime ve huni haritası<\/td><td>Pazarlama yöneticisi<\/td><td>Planlama dokümanı<\/td><\/tr>\n              <tr><td>2<\/td><td>12 gönderi, video akışları, görsel promptlar<\/td><td>Sosyal medya sorumlusu, tasarımcı<\/td><td>Instagram, Facebook, YouTube; görseller için görsel üretim aracı<\/td><\/tr>\n              <tr><td>3<\/td><td>Reklam varlık setleri, hashtagler<\/td><td>Reklam uzmanı<\/td><td>Meta Ads Manager, Google Ads<\/td><\/tr>\n              <tr><td>4<\/td><td>Landing, SEO metinleri, schema, robots.txt, llms.txt<\/td><td>Web geliştirici<\/td><td>Web sitesi, Search Console, Bing Webmaster Tools<\/td><\/tr>\n              <tr><td>5<\/td><td>Form, LinkedIn paketi, UTM, A/B, bütçe, KPI<\/td><td>Reklam uzmanı, pazarlama yöneticisi<\/td><td>Meta form reklamları, LinkedIn, analiz aracı<\/td><\/tr>\n              <tr><td>6<\/td><td>Otomatik yanıtlar, profil bağlantıları, iletişim sayfası, nöbet tablosu<\/td><td>Hasta koordinatörleri, sosyal medya sorumlusu<\/td><td>WhatsApp Business, Meta Business Suite, Telegram, Google Business Profile<\/td><\/tr>\n              <tr><td>6<\/td><td>Başvuru sayfası metinleri, mesaj şablonları, ilk karşılama yanıtları, belge işleme kuralları<\/td><td>Koordinatör ekibi, web geliştirici, hukukçu<\/td><td>hasta-on-basvuru.html, WhatsApp Business, Instagram, Messenger, Telegram<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n      <p class=\"note\"><b>Dikkat:<\/b> Yapay zekâya gerçek hasta adı, tıbbi rapor veya kişisel sağlık verisi yapıştırmayın. Prompt yalnızca kurumsal bilgilerle çalışacak şekilde tasarlandı.<\/p>\n    <\/div>\n  <\/details>\n\n  <div class=\"bar\">\n    <div class=\"seg\" role=\"group\" aria-label=\"Hedef platform\">\n      <button type=\"button\" data-p=\"claude\" aria-pressed=\"true\">Claude<\/button>\n      <button type=\"button\" data-p=\"chatgpt\" aria-pressed=\"false\">ChatGPT<\/button>\n      <button type=\"button\" data-p=\"gemini\" aria-pressed=\"false\">Gemini<\/button>\n      <button type=\"button\" data-p=\"perplexity\" aria-pressed=\"false\">Perplexity<\/button>\n    <\/div>\n    <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n      <button type=\"button\" class=\"btn ghost\" id=\"toggleAll\">Tümünü aç<\/button>\n      <button type=\"button\" class=\"btn\" id=\"copyAll\">Promptu kopyala<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"grid\">\n    <div class=\"maincol\">\n      <details class=\"pcard\" id=\"partners\" open>\n        <summary><span class=\"chev\">▸<\/span><span class=\"stitle\">Anlaşmalı hastaneler ve doktorlar<\/span><span class=\"tag\" id=\"pCount\">0 kurum · 0 hekim<\/span><\/summary>\n        <div class=\"pbody\">\n          <p class=\"hint\">Burada girdiğiniz liste prompttaki \"Anlaşmalı kurum ve hekim listesi\" bölümüne otomatik yazılır. Yalnızca kurumun ve hekimin onayladığı bilgileri girin; kişisel telefon, e-posta veya hasta bilgisi girmeyin. \"Tanıtımda kullanılabilir\" işaretli olmayanlar yalnızca iç belgelerde kullanılır. Liste yalnızca bu tarayıcıda saklanır.<\/p>\n\n          <h3 class=\"ph3\">Hastaneler ve sağlık kurumları<\/h3>\n          <form id=\"hForm\" class=\"pform\" autocomplete=\"off\">\n            <label for=\"h_name\">Kurum adı *<input id=\"h_name\" required><\/label>\n            <label for=\"h_type\">Tür<select id=\"h_type\"><option>Özel hastane<\/option><option>Üniversite hastanesi<\/option><option>Tıp merkezi<\/option><option>Onkoloji merkezi<\/option><option>Diğer<\/option><\/select><\/label>\n            <label for=\"h_district\">İlçe<input id=\"h_district\" placeholder=\"ör. Çankaya\"><\/label>\n            <label for=\"h_branches\" class=\"wide\">Branşlar / bölümler<input id=\"h_branches\" placeholder=\"ör. medikal onkoloji, radyasyon onkolojisi\"><\/label>\n            <label for=\"h_accr\">Akreditasyon<input id=\"h_accr\" placeholder=\"ör. JCI\"><\/label>\n            <label for=\"h_license\">Sağlık turizmi yetki belgesi<select id=\"h_license\"><option>Bilinmiyor<\/option><option>Var<\/option><option>Yok<\/option><\/select><\/label>\n            <label for=\"h_intl\">Yabancı hasta birimi<select id=\"h_intl\"><option>Bilinmiyor<\/option><option>Var<\/option><option>Yok<\/option><\/select><\/label>\n            <label class=\"pcheck\" for=\"h_perm\"><input type=\"checkbox\" id=\"h_perm\"> Tanıtımda adı kullanılabilir (yazılı izin var)<\/label>\n            <div class=\"pact\"><button type=\"submit\" class=\"btn\">Kurumu ekle<\/button><\/div>\n          <\/form>\n          <ul class=\"plist\" id=\"hList\"><\/ul>\n\n          <h3 class=\"ph3\">Doktorlar<\/h3>\n          <form id=\"dForm\" class=\"pform\" autocomplete=\"off\">\n            <label for=\"d_name\">Unvan, ad soyad *<input id=\"d_name\" required placeholder=\"ör. Prof. Dr. …\"><\/label>\n            <label for=\"d_spec\">Uzmanlık *<input id=\"d_spec\" required placeholder=\"ör. Tıbbi onkoloji\"><\/label>\n            <label for=\"d_inst\">Kurum<input id=\"d_inst\" list=\"instList\"><datalist id=\"instList\"><\/datalist><\/label>\n            <label for=\"d_langs\">Konuştuğu diller<input id=\"d_langs\" placeholder=\"ör. Türkçe, İngilizce\"><\/label>\n            <label for=\"d_role\">Rolü<select id=\"d_role\"><option>Tedavi eden hekim<\/option><option>İnceleyen / danışman hekim<\/option><option>Yönlendiren hekim<\/option><\/select><\/label>\n            <label class=\"pcheck\" for=\"d_perm\"><input type=\"checkbox\" id=\"d_perm\"> Tanıtımda adı kullanılabilir (yazılı izin var)<\/label>\n            <div class=\"pact\"><button type=\"submit\" class=\"btn\">Hekimi ekle<\/button><\/div>\n          <\/form>\n          <ul class=\"plist\" id=\"dList\"><\/ul>\n        <\/div>\n      <\/details>\n      <div class=\"sections\" id=\"sections\"><\/div>\n    <\/div>\n    <aside>\n      <div class=\"card\">\n        <h2>Platform biçimi<\/h2>\n        <p id=\"pnote\"><\/p>\n        <div class=\"stats\" style=\"margin-top:10px\">\n          <div><b id=\"sWords\">0<\/b>kelime<\/div>\n          <div><b id=\"sChars\">0<\/b>karakter<\/div>\n          <div><b id=\"sPh\">0<\/b>yer tutucu<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"card\">\n        <h2>Marka bilgilerini doldurun<\/h2>\n        <p style=\"margin-bottom:10px\">Girdiğiniz değer prompttaki tüm yer tutucuların yerine yazılır. Boş bıraktıklarınız köşeli parantezle kalır. Bilgiler yalnızca bu tarayıcıda saklanır.<\/p>\n        <form id=\"fields\" class=\"fields\" autocomplete=\"off\"><\/form>\n      <\/div>\n      <div class=\"card\">\n        <h2>Kalan yer tutucular<\/h2>\n        <p style=\"margin-bottom:8px\">Bunlar uydurulmayacak; yapay zekâ çıktıda aynen bırakacak.<\/p>\n        <div class=\"chips\" id=\"phList\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <h2>Teslim fazları<\/h2>\n        <ul>\n          <li><b>Faz 1<\/b> · Eksik veriler, strateji, takvim, anahtar kelime ve huni haritası, zamanlama<\/li>\n          <li><b>Faz 2<\/b> · 12 gönderi metni (6 + 6)<\/li>\n          <li><b>Faz 3<\/b> · Reklam varlık setleri ve hashtagler<\/li>\n          <li><b>Faz 4<\/b> · Landing hero, SEO / GEO web paketi ve yapay zekâ görünürlüğü<\/li>\n          <li><b>Faz 5<\/b> · Form, LinkedIn, UTM, A/B, bütçe, anlaşmalı kurumlar<\/li>\n          <li><b>Faz 6<\/b> · Anında iletişim ve hasta ön başvuru paketi<\/li>\n          <li><b>Faz 7<\/b> · Kalite kontrol, varsayımlar<\/li>\n        <\/ul>\n        <p style=\"margin-top:8px\">Her fazdan sonra yapay zekâya \"devam\" yazın.<\/p>\n      <\/div>\n      <div class=\"card\">\n        <h2>Varsayımlar<\/h2>\n        <ul>\n          <li>Marka adındaki \"truzimi\" yazım hatası kabul edildi, \"Ankara Sağlık Turizmi\" kullanıldı.<\/li>\n          <li>Ankara denize kıyısı olmadığından deniz manzarası yalnızca doğrulanmış ayrı bir lokasyona bağlandı; beyaz taş doku tüm görsellerde korunuyor.<\/li>\n          <li>Hedef bölge verildiği gibi Türkiye ve Avrupa; Arapça bu bölgelerdeki Arapça konuşan kitle için.<\/li>\n        <\/ul>\n      <\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n\n<script>\nconst S = [\n[\"role\",\"Rol\",`Sen; uluslararası sağlık turizmi pazarlamasında 15+ yıl deneyimli, Türkiye'deki sağlık tanıtım mevzuatına ve Meta/Google reklam politikalarına hâkim, onkoloji hastalarıyla empatik iletişim konusunda uzman, İngilizce, Arapça, Rusça ve Türkçe'de yerel yazar düzeyinde içerik üretebilen kıdemli bir sağlık pazarlama stratejisti ve metin yazarısın. Aynı zamanda performans pazarlaması (Meta, Google Ads), çok dilli SEO/GEO ve dönüşüm odaklı landing page uzmanısın. Görsel yönetmen bakış açısıyla, içerik başına uygulanabilir fotogerçekçi görsel brifler de yazarsın.`],\n[\"user_inputs\",\"Kullanıcı verileri\",`Aşağıdaki alanları kullanıcı doldurur. Dolu olan alanları birebir kullan ve değiştirme. Boş kalan veya köşeli parantezde duran alanlar için bilgi uydurma; çıktıda aynı yer tutucuyu bırak ve Faz 1'in başında eksik alanları tek bir kısa liste halinde göster.\n- Telefon / WhatsApp: [TELEFON/WHATSAPP]\n- Telegram kullanıcı adı: [TELEGRAM]\n- Sosyal medya hesapları (Instagram, Facebook, YouTube, LinkedIn): [SOSYAL MEDYA HESAPLARI]\n- Çalışma saatleri (Türkiye saati): [ÇALIŞMA SAATLERİ]\n- Web adresi: [WEB ADRESİ]\n- Ofis adresi (Çankaya, Balgat): [AÇIK ADRES]\n- Sağlık Bakanlığı Uluslararası Sağlık Turizmi Yetki Belgesi no: [SAĞLIK BAKANLIĞI ULUSLARARASI SAĞLIK TURİZMİ YETKİ BELGESİ NO]\n- Anlaşmalı hastaneler ve akreditasyonları: [ANLAŞMALI HASTANE ADI], [AKREDİTASYON]\n- Danışman / inceleyen hekim: [HEKİM ADI VE UZMANLIĞI]\n- Koordinasyonu yapılan tedavi alanları: [TEDAVİ ALANLARI] (ör. medikal onkoloji, radyasyon onkolojisi, cerrahi onkoloji; yalnızca kullanıcı onaylarsa)\n- Ekipte konuşulan diller ve tercüman hizmeti: [EKİP DİLLERİ]\n- İlk yanıt süresi taahhüdü: [YANIT SÜRESİ]\n- Sunulan ek hizmetler (yalnızca gerçekten sunuluyorsa kullan): [EK HİZMETLER] (ör. tıbbi rapor çevirisi, ikinci görüş koordinasyonu, tıbbi vize davet mektubu desteği, refakatçi konaklaması, helal yemek, kadın hekim tercihi, sigorta yazışmaları)\n- Aylık reklam bütçesi: [AYLIK REKLAM BÜTÇESİ]\n- Kampanya başlangıç tarihi: [BAŞLANGIÇ TARİHİ]`],\n[\"partner_directory\",\"Anlaşmalı kurum ve hekim listesi\",`Kullanıcı henüz anlaşmalı hastane ve hekim listesi girmedi. Kurum veya hekim adı uydurma; [ANLAŞMALI HASTANE ADI] ve [HEKİM ADI VE UZMANLIĞI] yer tutucularını kullan ve Faz 1'deki eksik veri listesine \"anlaşmalı kurum ve hekim listesi\" maddesini ekle.`],\n[\"context\",\"Bağlam\",`Marka: \"Ankara Sağlık Turizmi\" (adı bu yazımla, tutarlı biçimde kullan). Marka kişiliği: güvenilir, premium, profesyonel.\nHizmet: Ankara, Çankaya, Balgat merkezli, tedavi için Ankara'ya gelen yabancı hastalar ve yakınları için uçtan uca sağlık turizmi koordinasyonu: havalimanında karşılama, transfer, konaklama, Ankara'daki özel hastanelerle ve uzman hekimlerle randevu ve tedavi süreci koordinasyonu, tercüman/rehberlik, tedavi sonrası takip. Odak alanı: kanser hastalarının tedavi, bakım ve tedavi süreci desteği.\nHedef kitle: Türkiye ve Avrupa'da yaşayan, İngilizce, Arapça, Rusça veya Türkçe konuşan, 18–60+ yaş, ağırlıkla üst gelir grubu potansiyel hastalar ve hasta yakınları; ikincil kitle olarak hasta yönlendiren doktorlar ve sağlık çalışanları. Karar vericinin çoğu zaman hasta yakını olduğunu varsay; korku, belirsizlik, yabancı ülkede yalnız kalma kaygısı ve güven ihtiyacı temel duygusal noktalardır.\nKitle segmentleri (içerik ve reklam her zaman birine yazılır): (1) Hasta yakını karar verici, 35–60, araştırmacı, güven ve süreç netliği arar. (2) Hasta, 41–60+, dil bariyeri, konfor ve mahremiyet kaygısı taşır. (3) Genç yetişkin aile üyesi, 18–40, dijitalde araştırmayı yapar, hızlı ve net bilgi ister. (4) Yönlendiren hekim, tıbbi iletişim ve takip sürekliliği arar.\nKitleye özel hassasiyetler: Arapça kitle için aile odaklı karar süreci, refakatçi konaklaması, mahremiyet, helal yemek ve ibadet imkânı (yalnızca [EK HİZMETLER] içinde varsa söz et); Rusça kitle için net süreç, dil desteği ve belgelendirme; Avrupa kitlesi için şeffaflık, veri gizliliği (GDPR) ve sigorta yazışmaları.\nKanallar: Instagram, Facebook, YouTube, web sitesi/landing page; ücretli tarafta Meta Ads (Advantage+), Google Ads (Arama ve Performance Max), WhatsApp'a tıkla reklamları; doktor yönlendirme kanalı olarak LinkedIn.\nPsikolojik tetikleyiciler: otorite, sosyal kanıt, hikâye. Anlatıcı: marka adına konuşan uzman koordinasyon ekibi (hekim değil; tıbbi yargılar her zaman tedavi eden hekime atfedilir).\nCTA: \"Hemen arayın, bilgi alın\" (her dilde doğal yerelleştirmesiyle). İkincil CTA: \"WhatsApp'tan yazın\" (özellikle Arapça ve Rusça kitle için); Rusça içeriklerde ayrıca \"Telegram'dan yazın\".\nTemel ilke: müşteri hangi platformda, hangi cihazda (cep telefonu veya bilgisayar) ve hangi saatte olursa olsun en fazla bir dokunuşla bize ulaşabilmeli ve ilk yanıtı kendi dilinde anında almalı.`],\n[\"task\",\"Görev\",`Bu marka için 4 haftalık, tam kapsamlı ve yayına hazır bir sosyal medya ve reklam içerik paketi üret. Paket şunları içermeli:\n1. Kısa strateji özeti: ana vaat (tek cümle), 3 destekleyici mesaj, 4 içerik sütunu (ör. süreç/yol haritası, otorite/uzmanlık, hikâye/insan yüzü, pratik rehber-SSS) ve kanal başına rol.\n2. 4 haftalık içerik takvimi: haftada 3 gönderi, toplam 12 gönderi; YouTube için en az 2 video içeriği dahil.\n3. 12 gönderinin her biri için 4 dilde tam metin.\n4. Ücretli reklam varlık setleri: yapay zekâ destekli reklam sistemlerinin (Meta Advantage+, Google Performance Max, Responsive Search Ads) kendi kombinasyonlarını test edebileceği, otorite, sosyal kanıt ve hikâye tetikleyicilerine dağıtılmış çoklu metin parçaları, 4 dilde. Kurallar <ai_ad_techniques> bölümündedir.\n5. Web sitesi/landing page için 1 hero bloğu (başlık, alt başlık, 3 güven maddesi, CTA), 4 dilde.\n6. Dil başına hashtag setleri.\n7. Web sitesi için SEO / GEO paketi (arama motorları ve Google AI Overviews, ChatGPT, Perplexity, Gemini gibi yapay zekâ arama motorlarında görünürlük için), 4 dilde. Kurallar <seo_geo> bölümündedir.\n8. Kampanya kurulumu ve ölçüm planı: huni aşamaları, yeniden hedefleme, potansiyel müşteri formu, kampanya zamanlaması, doktor yönlendirme içeriği, UTM ve A/B test planı.\n9. Anında iletişim paketi: tüm sosyal medya hesapları, web sitesi ve mesajlaşma uygulamalarının birbirine bağlı, cep telefonu ve bilgisayarda çalışan, 7/24 ilk yanıt veren iletişim kurgusu, 4 dilde. Kurallar <contact_channels> bölümündedir.\n10. Hasta ön başvuru ve belge gönderim paketi: hastanın web sitesinde temel bilgilerini girip başvurusunu ve tıbbi belgelerini WhatsApp veya sosyal medya üzerinden gönderdiği 4 dilli akışın metinleri, mesaj şablonları ve iç süreçleri. Kurallar <patient_intake> bölümündedir.\n11. Anlaşmalı hastane ve hekim paketi: kurum ve hekim profilleri, tanıtım onay süreci, hasta yönlendirme süreci, veri paylaşımı, kurumlara yönelik iletişim seti ve takip tablosu. Kurallar <partner_institutions> bölümündedir; liste <partner_directory> bölümündedir.`],\n[\"partner_institutions\",\"Anlaşmalı kurum ve hekim kuralları\",`Amaç: iş birliği yapılan hastane, tıp merkezi ve hekimleri doğru, izinli ve mevzuata uygun biçimde tanıtmak; hasta yönlendirme sürecini ölçülebilir ve güvenli kılmak. Yalnızca <partner_directory> listesindeki bilgileri kullan; listede olmayan kurum, bölüm, cihaz, akreditasyon veya hekim bilgisi ekleme.\n- Tanıtım izni: listede \"Tanıtım izni: Hayır\" olan kurumun veya hekimin adını, logosunu ya da fotoğrafını gönderi, reklam, web sayfası veya schema'da kullanma; bunlar yalnızca iç süreç belgelerinde ve takip tablosunda yer alır. İzinli olanlar için de içerik yayından önce kurumun onayına sunulur; 4 dilde kısa bir onay talep e-postası yaz.\n- Mevzuat: Türkiye'de sağlık kuruluşlarının tanıtımı ve hekimlerin kendi tanıtımları sınırlıdır (Sağlık Hizmetlerinde Tanıtım ve Bilgilendirme Faaliyetleri Hakkında Yönetmelik ile hekimlik meslek etiği kuralları). Hekim profillerinde yalnızca unvan, uzmanlık, çalıştığı kurum ve konuştuğu diller olsun; başarı, hasta sayısı, \"uzman eller\" gibi övücü ifadeler olmasın. Güncel kuralları doğrula ve doğrulayamadığını işaretle.\n- Kurum profilleri (izinli kurumlar için, 4 dilde): 80–120 kelimelik tanıtım, bölümler/branşlar, akreditasyonlar, yabancı hasta birimi var mı, Çankaya/Balgat'a ulaşım notu (yalnızca doğrulanabilir bilgi), \"Bu kurumla ilgili bilgiler kurumun onayıyla yayımlanmıştır\" satırı. Hekim kartları (izinli hekimler için, 4 dilde): unvan ad soyad, uzmanlık, kurum, diller, tek cümlelik tarafsız tanım.\n- Yetki ve akreditasyon takibi: her kurum için Uluslararası Sağlık Turizmi Yetki Belgesi ve akreditasyonların geçerlilik bitiş tarihi sütunlu takip tablosu; bitişten 60 gün önce hatırlatma kuralı. Listede \"Yetki belgesi: Bilinmiyor\" olanlar için doğrulama görevi oluştur.\n- Hasta yönlendirme süreci (adım adım, iç kullanım): başvurunun hangi kuruma ve neden yönlendirileceği, dosyanın güvenli kanaldan (e-posta eki değil) iletilmesi, kurumdan ön değerlendirme ve tedavi planı için beklenen süre [KURUM YANIT SÜRESİ], hastaya bilgi verme, tedavi sonrası rapor ve epikrizin hastaya ve koordinasyon ekibine dönüşü, takip randevuları.\n- Veri paylaşımı: her kurumla KVKK açısından rol dağılımı (veri sorumlusu / veri işleyen) ve paylaşım-gizlilik sözleşmesi için yer tutucu [KURUM VERİ PAYLAŞIM SÖZLEŞMESİ – hukukçu onayı gerekir]; paylaşılan verinin asgari düzeyde tutulması; paylaşım kaydı.\n- Kurumlara yönelik iletişim seti (TR ve EN): uluslararası hasta birimleri için iş birliği teklif e-postası, bir sayfalık tanıtım dosyası metni ve 6–8 slaytlık görüşme sunumu taslağı; komisyon veya yönlendirme ücreti iması yok. Hekimler için kısa tanışma mesajı.\n- İş birliği takip tablosu şablonu: Kurum | Tür | Branşlar | Akreditasyon (bitiş) | Yetki belgesi (bitiş) | Yabancı hasta birimi | Tanıtım izni | Yönlendirilen başvuru sayısı | Ortalama yanıt süresi | Son görüşme | Not. Hekim tablosu: Hekim | Uzmanlık | Kurum | Diller | Rol | Tanıtım izni | Not.\n- Web ve yapay zekâ görünürlüğü: izinli kurumlar için \"Anlaşmalı Kurumlarımız\" sayfa metni (4 dilde), schema'da Hospital / MedicalClinic ve izinli hekimler için Physician işaretlemesi, kurum siteleriyle karşılıklı bağlantı önerisi.`],\n[\"patient_intake\",\"Hasta ön başvuru ve belge gönderimi\",`Mevcut altyapı: web sitesinde 4 dilli (EN / AR / RU / TR), 4 adımlı \"Tedavi Ön Başvurusu\" sayfası hazır (kişisel bilgiler, sağlık bilgileri, hazırlanacak belgeler, onay ve gönderim). Sayfa hiçbir veriyi kaydetmez veya bir sunucuya göndermez; hasta onay verdikten sonra seçtiği uygulamada (WhatsApp, Telegram, Instagram, Messenger) girdiği bilgilerle ve başvuru numarasıyla hazırlanmış bir mesaj açılır. Tıbbi belgeler yalnızca bu sohbetler üzerinden, hastanın kendisi tarafından fotoğraf veya PDF olarak gönderilir; web sitesine dosya yüklenmez, üçüncü taraf form aracı kullanılmaz. Belgeler için WhatsApp önerilen kanaldır (uçtan uca şifreli). Hesap adları <user_inputs> bölümündeki iletişim bilgilerinden gelir.\n- Sayfa metinleri (4 dilde, sayfadakiyle uyumlu): adım başlıkları, alan etiketleri ve yardım metinleri; \"Hazırlamanız gereken belgeler\" listesi (epikriz veya son doktor raporu, patoloji/biyopsi raporu, son kan tahlilleri, görüntüleme raporları, kullanılan ilaçlar); belge fotoğrafı çekme ipuçları; gönderim butonları ve \"Belgeler için WhatsApp önerilir\" notu; son adım ekranı.\n- Hazır başvuru mesajı şablonu (4 dilde): selamlama, başvuru numarası, girilen bilgiler madde madde, \"belgelerimi bu mesajın ardından gönderiyorum\" veya \"hazır olunca göndereceğim\" satırı, rıza beyanı satırı. Mesaj kısa, düzenli ve koordinatörün tek bakışta okuyabileceği biçimde olsun.\n- İlk karşılama yanıtları (4 dilde; WhatsApp Business, Telegram, Instagram DM, Messenger için): başvuru mesajı geldiğinde teşekkür ve \"belgelerinizi bu sohbete ekleyebilirsiniz\" mesajı; belgeler gelince \"aldık, [YANIT SÜRESİ] içinde dönüş yapacağız\" mesajı; eksik belge isteme mesajı (belge türleri listeli). Tıbbi değerlendirme, tanı, fiyat veya süre verme.\n- Kanal kuralları: Instagram DM veya Messenger'dan belge gönderen hastayı nazikçe WhatsApp'a yönlendiren 4 dilli kısa mesaj (zorlamadan; hasta isterse belgeyi orada da kabul et). WhatsApp ve Telegram'da yalnızca şirket hattı ve hesabı kullanılır, kişisel hesap kullanılmaz.\n- Belge işleme iç kuralı (personel kontrol listesi): sohbetten gelen belgeyi aynı gün kurumun belirlediği güvenli ortama [BELGE SAKLAMA ORTAMI – kurum belirleyecek] başvuru numarasıyla aktar; telefon galerisinden ve gerekiyorsa sohbetten sil; belgeleri kişisel cihaza, e-postaya veya genel bulut klasörlerine kopyalama; hastaneyle paylaşımı kayda geçir; saklama süresi [SAKLAMA SÜRESİ – hukukçu belirleyecek] dolunca sil.\n- Erişim: yetkili koordinatör ve inceleyen hekim listesi; WhatsApp Business ve Meta hesaplarında iki adımlı doğrulama; telefonda ekran kilidi; personel ayrıldığında erişimin kapatılması.\n- Hukuk: aydınlatma ve açık rıza metinleri için [AYDINLATMA METNİ – hukukçu onayı gerekir] ve [AÇIK RIZA METNİ – hukukçu onayı gerekir]; mesajlaşma uygulamalarının sunucuları yurt dışında olabileceğinden KVKK yurt dışı aktarım değerlendirmesi için hukukçu onayı. Kesin hukuki hüküm kurma.\n- Personel kontrol listesi: yeni başvuru mesajına ilk yanıt süresi içinde dönüş; başvuru durum etiketleri (Yeni / İletişime geçildi / Belge bekleniyor / Hekime iletildi / Plan gönderildi / Kapandı) ve WhatsApp Business etiketleriyle eşleştirme.\n- Kanallara bağlama: başvuru sayfası bağlantısı Instagram bio, WhatsApp otomatik karşılama, Google Business Profile ve reklamlarda \"Başvurunuzu 2 dakikada hazırlayın\" CTA'sı olarak kullanılsın; UTM ile whatsapp_click ve form_complete olayları tanımlansın.`],\n[\"contact_channels\",\"Anında iletişim kanalları\",`Amaç: hiçbir mesajın ve aramanın kaçmaması, her temas noktasından tek dokunuşla ulaşım ve ilk yanıtın müşterinin dilinde anında verilmesi. Hesap bağlama işlemlerini kullanıcı yapar; sen metinleri, akışları ve adım adım kurulum listesini üret. Platform menü adlarını ve özellikleri güncel resmi yardım sayfalarından doğrula; doğrulayamadığın adımı \"doğrulanmalı\" diye işaretle.\n- Kanal haritası (tablo): Kanal | Ulaşım yolu (cep telefonu) | Ulaşım yolu (bilgisayar) | Otomatik ilk yanıt | Mesai dışı davranış | Mesajın düştüğü yer. Kanallar: telefon, WhatsApp Business, Instagram DM, Facebook Messenger, Telegram, web sitesi canlı sohbet, web formu, Google Business Profile (arama ve mesaj), YouTube, LinkedIn, e-posta.\n- Cihaz kuralları: cep telefonunda \"Ara\" butonu doğrudan aramayı açar, WhatsApp butonu hazır mesajla wa.me bağlantısını açar. Bilgisayarda telefon numarası her zaman açıkça yazılı ve kopyalanabilir olur; WhatsApp ve Telegram için QR kod alanı ve WhatsApp Web bağlantısı bulunur; site içinde canlı sohbet penceresi açılır. Bağlantı örneklerini yer tutucuyla ver: https://wa.me/[TELEFON/WHATSAPP]?text=..., https://t.me/[TELEGRAM].\n- Hazır ilk mesajlar: her dil için WhatsApp ve Telegram'da açılacak 3 hazır mesaj (genel bilgi, tıbbi dosya gönderme, hasta yakını olarak bilgi alma); URL içinde kullanılacak şekilde kodlanmış hâli de verilsin.\n- Otomatik karşılama: WhatsApp Business, Instagram DM, Messenger ve Telegram için her dilde mesai içi ve mesai dışı ([ÇALIŞMA SAATLERİ]) karşılama mesajı; dil seçimi butonları (EN / العربية / RU / TR) ve 4–5 hızlı yanıt butonu (Tedavi süreci, Konaklama ve transfer, Tıbbi rapor gönderme, Koordinatörle görüş, Acil değilse geri arama talebi). Her otomatik yanıtta \"[YANIT SÜRESİ] içinde bir koordinatör size dönecek\" taahhüdü olsun.\n- Sınırlar: otomatik yanıtlar ve sohbet akışları tıbbi değerlendirme, tanı, fiyat veya süre vermez. Mesajda acil belirti tarif edilirse kişiyi bulunduğu ülkenin acil numarasını aramaya yönlendiren kısa, sakin bir yanıt yaz. Sağlık verisi istenmeden önce KVKK/GDPR aydınlatma metni bağlantısı gösterilsin.\n- Profil bağlantıları: Instagram bio metni ve tek bağlantı stratejisi (dil seçimli iletişim sayfası), Instagram profil iletişim butonları; Facebook sayfa CTA butonu; YouTube kanal açıklaması, her video açıklamasının ilk 2 satırı ve sabitlenmiş yorum; LinkedIn sayfa butonu; Google Business Profile açıklaması, arama ve mesaj ayarı. Hepsi 4 dilde, aynı ad, adres ve telefonla tutarlı.\n- Tek iletişim sayfası (web, mobil öncelikli): dil seçimi, büyük arama, WhatsApp ve Telegram butonları, kısa form, çalışma saatleri, yanıt süresi, adres ve harita bağlantısı, QR kodlar. Sayfa metnini 4 dilde ve bölüm sırasıyla ver.\n- Tek gelen kutusu: Instagram, Facebook ve WhatsApp mesajlarının Meta Business Suite içinde tek ekranda toplanması için adım adım kurulum listesi; Telegram ve web sohbetinin aynı ekibe nasıl yönlendirileceğine dair öneri (ör. çok kanallı bir canlı sohbet aracı; marka adı verirsen \"alternatifler arasında\" diye sun, tek ürün dayatma). Mesajlara kimin, hangi dilde, hangi sürede bakacağını gösteren basit bir nöbet ve yanıt kuralı tablosu.\n- Ülke ofisleri ve şubeler: Ankara merkez ofisin yanında kullanıcının verdiği yurt dışı şube, temsilcilik veya irtibat noktaları (ör. 3–4 ülke) iletişim bölümünde ayrı kartlar olarak gösterilir: ülke, şehir, ofis türü (Merkez ofis / Şube / Temsilcilik / İrtibat noktası), açık adres, ülke kodlu telefon, WhatsApp, e-posta, yerel çalışma saatleri, görüşme dilleri, harita bağlantısı. Ülke ve şehir adlarını 4 dilde yaz. Her karta WhatsApp ve harita butonu koy; tüm dosyaların Ankara'daki koordinasyon ekibine iletildiğini belirt. Schema'da her ofisi ana kuruluşun \"department\" alanında LocalBusiness olarak ver. Ofis adresi, telefon veya ülke uydurma; kullanıcı vermediyse [OFİS BİLGİSİ] yer tutucusu bırak. Yurt dışı ofisin yerel şirket kaydı ve sağlık tanıtımı kurallarına uyumunun kullanıcı tarafından doğrulanması gerektiğini not et.\n- Ölçüm: her butona ve bağlantıya ayrı UTM veya olay adı (call_click, whatsapp_click, telegram_click, dm_start, chat_start, form_submit, whatsapp_branch, call_branch), haftalık \"kaçan mesaj ve ilk yanıt süresi\" kontrolü.`],\n[\"language_rules\",\"Dil kuralları\",`- Her metni İngilizce, Arapça, Rusça ve Türkçe olarak ayrı ayrı yaz. Kelime kelime çeviri yapma; her dili o kültürün okuruna yazılmış gibi yerelleştir.\n- Arapça: Modern Standart Arapça, saygılı ve sıcak; Körfez ve Avrupa'daki Arap diasporası için anlaşılır.\n- Rusça: resmi \"Вы\" hitabı, sakin ve güven veren ton.\n- İngilizce: sade, premium, Avrupa okuruna uygun.\n- Türkçe: kurumsal ama samimi; doğru yazım (\"sağlık turizmi\").\n- Ton dengesi: kurumsal ve uzman, ama asla soğuk değil; ikna edici, ama asla baskıcı değil. Kısa cümleler, açık bilgi, abartısız dil.`],\n[\"compliance_and_accuracy\",\"Uyum ve doğruluk\",`Bu bölüm en yüksek önceliğe sahiptir; diğer tüm talimatlarla çelişirse bu bölüm geçerlidir.\n- Tedavi sonucu, iyileşme, \"kanseri yenmek\", başarı oranı veya süre garantisi verme, ima etme. \"En iyi\", \"1 numara\", \"kesin çözüm\" gibi doğrulanamaz üstünlük iddiaları kullanma.\n- İlaç adı, reçeteli ilaç tanıtımı, fiyat, indirim veya \"uygun maliyet\" rakamı yazma.\n- Hastane, hekim, akreditasyon (ör. JCI), ödül, hasta sayısı, yıl, telefon, adres veya lisans bilgisi uydurma. Bunların yerine köşeli parantezli yer tutucu kullan: [ANLAŞMALI HASTANE ADI], [HEKİM ADI VE UZMANLIĞI], [AKREDİTASYON], [SAĞLIK BAKANLIĞI ULUSLARARASI SAĞLIK TURİZMİ YETKİ BELGESİ NO], [TELEFON/WHATSAPP], [WEB ADRESİ].\n- \"Ankara'daki tüm özel hastaneler\" ile çalışıldığını iddia etme; \"Ankara'daki özel hastanelerle koordinasyon\" gibi doğrulanabilir ifadeler kullan.\n- Sosyal kanıt tetikleyicisini öncelikle doğrulanabilir olgularla kur: akreditasyonlar, anlaşmalı hastane sayısı, ekip dilleri, hizmet verilen ülkeler, yanıt süresi (hepsi <user_inputs> bölümündeki verilerden). Gerçek hasta yorumu, isim veya fotoğraf uydurma. Yalnızca [ONAYLI HASTA YORUMU – yazılı açık rıza ve hukuki uygunluk kontrolü gerekir] yer tutucusu kullan; öncesi/sonrası anlatımı kullanma.\n- Meta reklam politikasına uy: okurun sağlık durumunu doğrudan ima eden hitaplar kullanma (\"Kanser misiniz?\" yerine \"Sevdiğiniz biri için tedavi seçeneklerini araştırıyorsanız…\").\n- Korku, aciliyet sömürüsü veya duygusal istismar içeren dil kullanma; kanser hastalarına ve yakınlarına saygılı, umut verici ama gerçekçi ol.\n- Her gönderi ve reklamın sonuna, ilgili dilde kısa bir bilgilendirme notu ekle: içeriğin tıbbi tavsiye olmadığı, tanı ve tedavi kararını hekimin verdiği.\n- Sağlık verisi toplayan her form ve WhatsApp akışında KVKK (Türkiye) ve GDPR (Avrupa) uyumu gözet; açık rıza ve aydınlatma metni için yer tutucu bırak.\n- Türkiye'de doğrulanması gereken başlıca düzenlemeler: Uluslararası Sağlık Turizmi ve Turistin Sağlığı Hakkında Yönetmelik (aracı kuruluş yetkilendirmesi) ve Sağlık Hizmetlerinde Tanıtım ve Bilgilendirme Faaliyetleri Hakkında Yönetmelik. Bunların güncel hâlini kontrol etmeden kesin hüküm kurma.\n- İnternet erişimin varsa Türkiye'nin sağlık hizmetlerinde tanıtım mevzuatını, uluslararası sağlık turizmi yetkilendirme kurallarını ve Meta/YouTube'un güncel sağlık reklamı ve hashtag kurallarını doğrula; kullandığın her mevzuat veya platform kuralı iddiasını kaynağıyla eşleştir. Doğrulayamadığın kuralı \"doğrulanmalı\" olarak işaretle.`],\n[\"visual_brief_rules\",\"Görsel brif kuralları\",`Her gönderi ve reklam varyantı için İngilizce, doğrudan bir görsel üretim aracına yapıştırılabilir bir görsel prompt yaz:\n- Stil: photorealistic, luxury, natural, premium, documentary, warm and inviting.\n- Belirt: sahne, özne, kompozisyon, kamera açısı, lens (ör. 35mm/85mm), ışık (yumuşak doğal ışık, sıcak tonlar), malzeme ve doku, renk paleti, atmosfer.\n- Beyaz taş doku marka görsel dilinin sabit unsurudur; mimari, iç mekân veya arka planlarda korunmalıdır.\n- Ankara deniz kıyısında değildir. Ankara/Balgat'ı gösteren hiçbir sahnede deniz manzarası kullanma. Deniz manzaralı görseller yalnızca kullanıcı gerçek bir deniz kıyısı konaklama/iyileşme lokasyonunu doğrularsa [DOĞRULANMIŞ DENİZ MANZARALI LOKASYON] yer tutucusuyla kullanılabilir.\n- Gerçek hastane, logo, tanınabilir gerçek kişi veya hasta yüzü kullanma; hasta görsellerinde mahremiyete saygılı kadrajlar (arkadan, el detayı, bulanık yüz) seç.\n- Her görsel promptun başında yerleşimi ve en-boy oranını belirt: Instagram/Facebook akış 4:5, kare 1:1, Reels/Shorts/Story 9:16, YouTube kapak ve web hero 16:9, Google PMax yatay 1.91:1 ve kare 1:1. Metin eklenecek görsellerde üst veya alt üçte birde boş alan bırak.\n- Görsel promptları belirli bir araca bağlı olmayan, Midjourney, DALL·E, Imagen veya Firefly'a uyarlanabilir sade İngilizce cümlelerle yaz.\n- Her görsel promptun sonuna şu komutları ve karşılıklarını ekle: \"/cinematic\" (cinematic color grading, filmic lighting) ve \"/depth\" (realistic shallow depth of field, natural background blur).\n- Negatifler: distorted hands, extra fingers, unrealistic anatomy, text artifacts, fake logos, plastic skin, oversaturated colors, cold clinical blue tones, sea view in Ankara scenes.`],\n[\"seo_geo\",\"SEO / GEO kuralları\",`Amaç: web sayfalarının hem klasik aramada hem yapay zekâ arama motorlarında doğrudan cevap ve kaynak olarak seçilmesi. Her dil için ayrı planla; çeviri değil, o dildeki gerçek arama niyetiyle yaz.\n- Anahtar kelime haritası: her dil için 1 ana anahtar kelime, 8–12 ikincil ve uzun kuyruklu sorgu (ör. EN \"cancer treatment in Ankara\", AR \"علاج السرطان في أنقرة\", RU \"лечение рака в Анкаре\", TR \"Ankara'da kanser tedavisi\"). Her sorgunun arama niyetini (bilgi / karşılaştırma / iletişim) ve hedef sayfasını belirt. Arama hacmi rakamı uydurma; hacim gerekiyorsa [ARAMA HACMİ – araçla doğrulanacak] yaz.\n- Sayfa yapısı: tek H1, mantıklı H2/H3 hiyerarşisi, her bölüm tek konu. Her H2 altında ilk cümle soruya doğrudan cevap versin (40–60 kelimelik özetlenebilir paragraf); paragraflar en fazla 2–3 cümle; süreçler numaralı liste, karşılaştırmalar tablo.\n- Önerilen sayfa iskeleti: Hizmet özeti → Süreç nasıl işler (adım adım: ilk başvuru, tıbbi dosya inceleme, hastane/hekim eşleştirme, karşılama ve transfer, konaklama, tedavi süreci, tedavi sonrası takip) → Ankara ve Balgat neden (ulaşım, konaklama, hastanelere yakınlık; yalnızca doğrulanabilir bilgiler) → Hasta yakınları için rehber → SSS → İletişim.\n- SSS: her dil için 8–10 soru-cevap; gerçek kullanıcı sorusu biçiminde (vize, tercüman, refakatçi konaklaması, tıbbi raporların gönderimi, randevu süresi, ödeme yöntemleri). Cevaplar 40–80 kelime, cevap ilk cümlede. Fiyat ve süre sorularında rakam verme; \"kişiye özel değerlendirme sonrası bildirilir\" de.\n- Meta: her dil ve sayfa için title (en fazla 60 karakter, marka adı sonda), meta description (140–155 karakter, CTA içeren), URL slug (Latin harfli, kısa; AR ve RU için de Latin transliterasyon), Open Graph başlık/açıklama.\n- Schema (JSON-LD): MedicalBusiness + LocalBusiness (Çankaya, Balgat, Ankara; adres, telefon, çalışma saati, geo koordinat yer tutucuyla), FAQPage (SSS'den birebir), BreadcrumbList, Organization (logo, sameAs sosyal hesaplar). Geçerli JSON-LD yaz; uydurma değer yerine yer tutucu kullan. Hasta yorumu ve puanı (Review/AggregateRating) yalnızca doğrulanmış veri varsa ekle.\n- Çok dilli yapı: 4 dil için hreflang etiketleri (en, ar, ru, tr ve x-default) örneği; Arapça sayfa için dir=\"rtl\" ve lang=\"ar\" notu.\n- Güvenilirlik (sağlık YMYL içeriği): her sayfada \"Tıbbi içerik [HEKİM ADI, UZMANLIĞI] tarafından incelendi · Son güncelleme: [TARİH]\" satırı; yazar/ekip kutusu; [SAĞLIK BAKANLIĞI ULUSLARARASI SAĞLIK TURİZMİ YETKİ BELGESİ NO] görünür alanda. Her istatistik ve mevzuat iddiasını kaynağıyla ver; kaynak yoksa yazma.\n- Güncellik: her sayfa için en geç 3 ayda bir güncelleme yapılacağını belirten bir kontrol listesi ekle (değişebilecek bilgiler: vize kuralları, hastane anlaşmaları, iletişim bilgileri).\n- Teknik notlar (geliştirici için kısa liste): içerik sunucu tarafı HTML'de olsun (JavaScript, sekme veya giriş arkasında değil); robots.txt ve CDN'de GPTBot, OAI-SearchBot, PerplexityBot, ClaudeBot, Google-Extended gibi tarayıcılar istemeden engellenmesin; sayfa hızı ve mobil uyum.\n- Yapay zekâ görünürlük kurulumu (adım adım, kullanıcının uygulayacağı liste): Google Search Console'a site ve sitemap ekleme; Bing Webmaster Tools'a site ekleme ve IndexNow'u açma (ChatGPT arama sonuçları büyük ölçüde Bing dizinine dayanır; bu ilişkiyi güncel kaynakla doğrula); her dil için ayrı URL yapısı (/en, /ar, /ru, /tr) ve dil başına sitemap.\n- robots.txt örneği: arama ve kullanıcı adına okuma yapan botlara izin veren örnek dosya (Googlebot, Bingbot, OAI-SearchBot, ChatGPT-User, PerplexityBot, Perplexity-User, ClaudeBot, Claude-SearchBot, Claude-User; Google-Extended ve GPTBot için eğitim amaçlı tarama kararını kullanıcıya bırakan açıklamalı satırlar) ve sitemap satırları. Bot adlarını resmi dokümanlardan doğrula. Cloudflare veya benzeri CDN'lerde yapay zekâ botlarını engelleyen ayarların kontrol edilmesi için uyarı ekle.\n- llms.txt: sitenin ne olduğunu, hizmetleri, dilleri, iletişim bilgisini ve en önemli sayfaların bağlantılarını özetleyen, Markdown biçiminde, İngilizce ana metinli ve 4 dildeki sayfalara bağlantı veren örnek dosya. Bunun henüz resmî bir standart olmadığını ve büyük platformlarca kullanıldığının doğrulanmadığını tek satırla belirt.\n- Varlık (entity) kaydı: Wikidata'da kurum kaydı için doldurulacak alanlar (ad, tür, kuruluş yeri Ankara/Çankaya, resmi web sitesi, sosyal medya hesapları) ve schema'daki sameAs ile eşleştirme. Kaydın bağımsız kaynaklarla desteklenmesi gerektiğini belirt; kurala aykırı tanıtım içeriği yazma.\n- Hakkımızda sayfası: yapay zekânın kurumu tanımlarken kullanacağı 2 cümlelik net tanım (her dilde), ekip ve inceleyen hekim, yetki belgesi no, anlaşmalı hastaneler, iletişim; hepsi <user_inputs> verilerinden.\n- Aylık yapay zekâ görünürlük testi: ChatGPT, Gemini, Perplexity, Claude ve Google AI Overviews'ta sorulacak, her dilde 5 soruluk test listesi (ör. \"Ankara'da yabancı kanser hastalarına tedavi koordinasyonu yapan kurumlar\", \"Balgat'ta sağlık turizmi ajansı\") ve sonuç tablosu şablonu (Tarih | Platform | Dil | Soru | Marka göründü mü | Gösterilen kaynaklar | Yanlış bilgi var mı | Aksiyon).\n- Görünürlük dışarıda da kurulur: Google Business Profile (Balgat), sağlık turizmi rehberleri ve yerel basında marka adının tutarlı (aynı ad, adres, telefon) geçmesi için 5 maddelik dış referans önerisi ver.`],\n[\"ai_ad_techniques\",\"Yapay zekâ uyumlu reklam teknikleri\",`Karakter sınırlarını ve platform kurallarını güncel resmi dokümanlardan doğrula; doğrulayamazsan aşağıdaki değerleri kullan ve \"doğrulanmalı\" diye işaretle.\n- Meta varlık seti (her dil): 5 ana metin (ilk 125 karakter tek başına anlamlı, toplam en fazla 300 karakter), 5 başlık (en fazla 40 karakter), 3 açıklama (en fazla 30 karakter). Her parça diğerleriyle hangi sırayla birleşirse birleşsin anlamlı ve uyumlu olmalı; marka adını ve yasal uyarıyı tek bir parçaya bağlama. Parçaları otorite, sosyal kanıt ve hikâye tetikleyicilerine dengeli dağıt ve her parçanın yanına tetikleyicisini yaz.\n- Google Responsive Search Ads (her dil): 15 başlık (en fazla 30 karakter; en az 3'ü ana anahtar kelimeyi, en az 2'si marka adını, en az 2'si CTA'yı içersin), 4 açıklama (en fazla 90 karakter). Hangi başlıkların 1. konuma sabitlenmesi gerektiğini öner. 10 negatif anahtar kelime öner (ör. ücretsiz, iş ilanı, devlet hastanesi).\n- Google Performance Max (her dil): 5 kısa başlık (30), 5 uzun başlık (90), 4 açıklama (90), işletme adı, 3 görsel ve 1 video için brif. Kitle sinyali önerisi (ilgi alanları, arama sorguları, web sitesi ziyaretçileri).\n- Sağlık reklamı uyumu: kişisel sağlık durumunu hedefleme veya ima etme yok; Meta'nın hassas ilgi alanı kısıtlamaları ve Google'ın sağlık hizmeti reklam politikası (ülkeye göre sertifika gerekebilir) için \"doğrulanmalı\" notu ekle.\n- WhatsApp'a tıkla reklamları: her dilde 3 reklam metni ve kullanıcının WhatsApp'ta göreceği hazır ilk mesaj (ör. \"Merhaba, Ankara'da tedavi süreci hakkında bilgi almak istiyorum.\") ile ilk otomatik karşılama yanıtı. Yanıtta tıbbi değerlendirme vaadi verme; \"koordinatörümüz en kısa sürede dönüş yapacak\" de. Numara: [TELEFON/WHATSAPP].\n- Sessiz izlenen dikey video (Reels, Shorts): ilk 3 saniyede metinle okunan kanca; tüm konuşmalar ekranda altyazılı; ekran yazıları en fazla 7 kelime; 9:16 güvenli alan dışına metin koyma. Her video için 4 dilde 20–30 saniyelik seslendirme metni (dakikada yaklaşık 130–150 kelime hızına göre).\n- Huni aşamaları: her içeriği Farkındalık / Değerlendirme / Karar aşamasına ata. Farkındalık: süreç ve şehir anlatımı. Değerlendirme: SSS, adım adım süreç, ekip tanıtımı. Karar: arama ve WhatsApp CTA'lı doğrudan teklifler.\n- Yeniden hedefleme: siteyi ziyaret eden, videoyu en az %50 izleyen veya formu yarıda bırakanlar için her dilde 3 kısa reklam metni. Ton ısrarcı değil, hatırlatıcı ve yardımsever.\n- Potansiyel müşteri formu: \"Ankara'da Tedavi Süreci Rehberi – Hasta ve Yakınları İçin\" başlıklı indirilebilir rehberin içerik başlıkları (8–10 madde), form reklam metni ve form alanları (ad, ülke, dil tercihi, telefon/WhatsApp, tedavi alanı seçimi, isteğe bağlı not). Sağlık verisi topladığın için KVKK/GDPR açık rıza onay metni yer tutucusu ekle: [AÇIK RIZA METNİ – hukukçu onayı gerekir].\n- Kampanya zamanlaması: Arapça kitle için Ramazan, Ramazan ve Kurban Bayramı ile Körfez yaz seyahat dönemi; Rusça kitle için Yeni Yıl ve Ocak tatilleri; Avrupa için okul tatilleri. 2026–2027 tarihlerini doğrula ve içerik takvimine nasıl yansıtılacağını belirt; dini dönemlerde saygılı, satış baskısı olmayan bir dil kullan.\n- Doktor yönlendirme (LinkedIn, B2B): İngilizce ve Türkçe 3 gönderi ve 1 doğrudan mesaj şablonu; konu: hasta yönlendirme süreci, tıbbi dosya aktarımı, hekimler arası iletişim ve tedavi sonrası takip. Komisyon veya yönlendirme ücreti iması yok (etik ve yasal risk).\n- Ölçüm: tüm bağlantılar için UTM şablonu (utm_source / utm_medium / utm_campaign / utm_content; dil ve tetikleyici utm_content'te), dönüşüm olarak tanımlanacak olaylar (arama tıklaması, WhatsApp tıklaması, form gönderimi, rehber indirme) ve her varlık seti için bir A/B test hipotezi (ör. \"Hikâye tetikleyicili başlıklar Arapça kitlede otorite başlıklarına göre daha yüksek WhatsApp tıklaması getirir\").`],\n[\"output_format\",\"Çıktı formatı\",`Çıktıyı Markdown olarak, aşağıdaki sırayla ve bu başlıklarla ver:\n\n## 1. Strateji Özeti\nEn fazla 150 kelime, Türkçe.\n\n## 2. İçerik Takvimi\nTablo sütunları: Hafta | Gün | Kanal | Huni aşaması | Format (Reels / Karusel / Tek görsel / YouTube video / Story) | İçerik sütunu | Tetikleyici | Hedef segment | Konu başlığı.\nBaşlangıç tarihi: [BAŞLANGIÇ TARİHİ]; verilmezse 19.10.2026 Pazartesi'den başlat.\n\n## 3. Gönderi Metinleri\nHer gönderi için: \"Gönderi X – [konu]\" başlığı, ardından EN / AR / RU / TR alt başlıklarıyla:\n- Kanca: ilk 125 karakterde dikkat çeken açılış\n- Gövde: Instagram/Facebook için 80–180 kelime\n- CTA\n- Bilgilendirme notu\n- Hashtagler: platformun güncel sınırını doğrula; doğrulayamazsan en fazla 5\nReels/video gönderilerinde ek olarak: 15–45 sn sahne akışı (saniye bazlı) ve ekran yazıları.\nYouTube içeriklerinde ek olarak: başlık (en fazla 70 karakter), açıklama (150–250 kelime), 3 bölüm zaman damgası önerisi.\nArdından tek bir \"Görsel Prompt (EN)\" bloğu.\n\n## 4. Reklam Varlık Setleri\nHer dil (EN / AR / RU / TR) için ayrı tablolar: 4.1 Meta Advantage+ (Parça türü | Metin | Karakter sayısı | Tetikleyici) · 4.2 Google Responsive Search Ads (başlıklar, açıklamalar, sabitleme önerisi, negatif anahtar kelimeler) · 4.3 Google Performance Max (metinler, görsel/video brifi, kitle sinyalleri) · 4.4 WhatsApp'a tıkla reklamları (reklam metni, hazır ilk mesaj, otomatik karşılama) · 4.5 Yeniden hedefleme metinleri. CTA butonları: \"Hemen Ara\" / \"WhatsApp'tan Yaz\" / \"Bilgi Al\". Her set için 3 görsel prompt (EN). Karakter sayılarını gerçekten say ve sınırı aşanı yeniden yaz.\n\n## 5. Landing Page Hero Bloğu\nEN / AR / RU / TR: başlık (en fazla 10 kelime), alt başlık, 3 güven maddesi, birincil CTA (arama) ve ikincil CTA (WhatsApp), ilk ekranda görünen kısa form (ad, ülke, telefon/WhatsApp), \"[YANIT SÜRESİ] içinde dönüş\" taahhüdü, mobilde sabit arama ve WhatsApp butonları için buton metinleri, güven rozeti alanı ([AKREDİTASYON], yetki belgesi no).\n\n## 6. Hashtag Setleri\nDil başına 3 grup: marka (ör. #AnkaraSaglikTurizmi ve dil karşılıkları), sağlık turizmi nişi, yerel (Ankara/Çankaya). Her grupta 5–8 etiket.\n\n## 7. SEO / GEO Web Paketi\nSırasıyla: 7.1 Anahtar kelime haritası (tablo: Dil | Sorgu | Niyet | Hedef sayfa) · 7.2 Sayfa iskeleti ve H1/H2 başlıkları (EN / AR / RU / TR) · 7.3 Ana sayfa gövde metni, her dilde 600–900 kelime · 7.4 SSS (her dilde 8–10) · 7.5 Meta title, description, slug, OG (tablo) · 7.6 JSON-LD schema kod blokları · 7.7 hreflang örneği · 7.8 Güncelleme kontrol listesi ve teknik notlar · 7.9 Dış referans önerileri · 7.10 Yapay zekâ görünürlük paketi (Search Console ve Bing/IndexNow kurulum listesi, robots.txt ve llms.txt örnekleri kod bloğunda, Wikidata alanları, Hakkımızda tanımı, aylık test listesi ve sonuç tablosu).\n\n## 8. Kampanya Kurulumu ve Ölçüm\nSırasıyla: 8.1 Huni haritası (tablo: Aşama | Amaç | İçerik/Reklam | Kitle | KPI) · 8.2 Potansiyel müşteri formu ve rehber içeriği (4 dilde) · 8.3 Kampanya zamanlama takvimi (tarihler doğrulanmış veya \"doğrulanmalı\" işaretli) · 8.4 Doktor yönlendirme paketi (LinkedIn, EN / TR) · 8.5 UTM şablonu ve dönüşüm olayları · 8.6 A/B test hipotezleri · 8.7 Bütçe dağılımı önerisi ([AYLIK REKLAM BÜTÇESİ] üzerinden kanal ve dil bazında yüzde olarak; tutar uydurma) ve 4 haftalık KPI hedef tablosu (yalnızca ölçülecek metrikler, sektör ortalaması rakamı uydurma) · 8.8 Anında iletişim paketi: kanal haritası, cihaz kuralları ve bağlantı örnekleri, hazır ilk mesajlar, otomatik karşılama ve hızlı yanıt butonları (4 dilde), profil bağlantı metinleri, tek iletişim sayfası metni, tek gelen kutusu kurulum listesi ve nöbet tablosu, ölçüm olayları · 8.9 Hasta ön başvuru paketi: sayfa metinleri ve belge listesi (4 dilde), hazır başvuru mesajı şablonu (4 dilde), kanal bazlı ilk karşılama ve eksik belge mesajları (4 dilde), kanal kuralları, belge işleme ve erişim kuralları, personel kontrol listesi · 8.10 Anlaşmalı kurum ve hekim paketi: kurum profilleri ve hekim kartları (yalnızca izinliler, 4 dilde), \"Anlaşmalı Kurumlarımız\" sayfa metni ve schema, onay talep e-postası, yetki/akreditasyon takip tablosu, hasta yönlendirme süreci, veri paylaşım kuralları, kurumlara yönelik iletişim seti (TR / EN), iş birliği takip tabloları.\n\nBiçim kuralları: Arapça metinleri karışık dilli tablolara koyma; Arapça için ayrı başlık altında, ayrı tablo veya liste kullan ki sağdan sola yazım bozulmasın. JSON-LD ve UTM örneklerini kod bloğunda ver. Her dil bloğunu tek başına kopyalanabilir tut.\n\n## 9. Kalite Kontrol\nKısa madde listesi: ilk taslakta bulduğun eksiklik, belirsizlik, hata ve tutarsızlıklar ve son halde nasıl düzelttiğin. En fazla 8 madde.\n\n## 10. Varsayımlar ve Kullanıcıdan Alınacak Veriler\nYaptığın varsayımlar ve yer tutucuyla bıraktığın tüm bilgilerin listesi.`],\n[\"style_example\",\"Stil örneği\",`İstenmeyen: \"Ankara'nın en iyi hastanelerinde kanseri yenin! %95 başarı, uygun fiyat. Hemen arayın!\"\nİstenen: \"Tedavi yolculuğunda tek başınıza değilsiniz. Ankara'ya ilk adımınızdan hastane randevularınıza, konaklamanızdan tercümanınıza kadar her aşamayı sizin için koordine ediyoruz. Hemen arayın, bilgi alın.\"`],\n[\"working_method\",\"Çalışma yöntemi\",`Yanıt vermeden önce görevi adımlara ayır ve her adımı sırayla düşün; bu düşünceyi gösterme.\n1) İlk taslağı hazırla.\n2) Taslağı eksiklik, belirsizlik, hata, tutarsızlık, dil hatası, karakter sınırı ve mevzuat uyumu açısından eleştir.\n3) Eleştiriye göre düzeltilmiş son hali ver.\nKullanıcıya yalnızca son hali ve \"9. Kalite Kontrol\" bölümündeki kısa eleştiri listesini göster; ilk taslağı gösterme.\nÖncelik sırası: (1) mevzuat ve etik uygunluk, (2) doğruluk, (3) gerçekçilik, (4) ikna gücü ve marka dili.\nKapsam tek yanıta sığmayacak kadar büyüktür; kaliteyi korumak için işi aşağıdaki fazlarda teslim et. Her fazın sonunda dur, \"Sonraki faz için 'devam' yazın.\" notunu ekle ve kullanıcının onayını bekle. Bir fazın ortasında uzunluk sınırına gelirsen bir bölümü yarıda kesme; tamamlanan son bölümden sonra dur.\n- Faz 1: Eksik veri listesi, 1. Strateji Özeti, 2. İçerik Takvimi, 7.1 Anahtar kelime haritası, 8.1 Huni haritası, 8.3 Kampanya zamanlaması.\n- Faz 2: 3. Gönderi Metinleri (önce Gönderi 1–6, sonraki yanıtta 7–12).\n- Faz 3: 4. Reklam Varlık Setleri ve 6. Hashtag Setleri.\n- Faz 4: 5. Landing Page Hero Bloğu ve 7.2–7.10 SEO / GEO Web Paketi (gerekirse dil dil).\n- Faz 5: 8.2 ve 8.4–8.7 Kampanya Kurulumu ve Ölçüm, 8.10 Anlaşmalı kurum ve hekim paketi.\n- Faz 6: 8.8 Anında iletişim paketi ve 8.9 Hasta ön başvuru paketi.\n- Faz 7: 9. Kalite Kontrol, 10. Varsayımlar.\nKalite kontrolünü her fazın sonunda o fazın içeriği için de uygula; fazlar arasında terim, marka adı, ton ve yer tutucu tutarlılığını koru.`],\n[\"success_criteria\",\"Başarı kriterleri\",`- Uydurma hastane, hekim, istatistik, yorum, fiyat veya iddia yok; tüm belirsiz veriler yer tutucuyla işaretli.\n- Dört dil de doğal, dilbilgisi açısından kusursuz ve kültürel olarak yerelleştirilmiş.\n- Karakter sınırları ve format kuralları eksiksiz uygulanmış.\n- Her içerik, bir hasta yakınına \"Bu ekip süreci benim yerime güvenle yönetir\" hissini veriyor ve tek, net bir aramaya yönlendiriyor.\n- Görsel promptlar tutarlı bir premium marka dili oluşturuyor; Ankara sahnelerinde deniz yok, beyaz taş doku korunmuş.\n- Web metinleri cevap önce gelen yapıda; JSON-LD geçerli; hreflang 4 dili kapsıyor; her sayfada hekim incelemesi ve güncelleme tarihi satırı var.\n- Site Google ve Bing'de dizine eklenebilir, yapay zekâ arama botlarına açık; kurum her dilde iki cümleyle net tanımlanmış ve aylık görünürlük testi tanımlı.\n- Her sosyal medya hesabı, web sayfası ve reklamdan müşteri cep telefonunda tek dokunuşla, bilgisayarda en fazla iki adımda bize ulaşabiliyor; her kanalda 4 dilde anında ilk yanıt tanımlı.\n- Hasta, 4 dilde, cep telefonundan birkaç dakikada başvurusunu hazırlayıp belgelerini WhatsApp veya sosyal medyadan gönderebiliyor; site veri saklamıyor; belge işleme, erişim ve silme kuralları tanımlı.\n- Anlaşmalı kurum ve hekimler yalnızca izinli oldukları ölçüde ve yalnızca girilen bilgilerle tanıtılıyor; yönlendirme süreci ve yetki takibi tanımlı.\n- Reklam varlıkları her kombinasyonda anlamlı, karakter sınırları içinde ve tetikleyicilere dengeli dağıtılmış; her içerik bir huni aşamasına ve ölçülebilir bir dönüşüm olayına bağlı.`]\n];\nconst TAIL = `Varsayım: \"Ankara sağlık truzimi\" marka adındaki \"truzimi\" yazım hatası kabul edilip \"Ankara Sağlık Turizmi\" olarak düzeltildi.\nVarsayım: Ankara denize kıyısı olmadığından \"deniz manzarası\" şartı yalnızca kullanıcının doğrulayacağı ayrı bir lokasyona bağlandı; beyaz taş doku tüm görsellerde korunuyor.\nVarsayım: \"Arap web tanıtım\" proje adına rağmen hedef bölge, verildiği gibi Türkiye ve Avrupa (Arapça dahil 4 dil) olarak alındı.`;\n\nconst NOTES = {\n  claude:\"Bölümler XML etiketleriyle ayrılır (<role>, <context>, <task>…). Claude bu yapıyı en iyi şekilde izler.\",\n  chatgpt:\"Etiketler net Markdown başlıklarına çevrilir; çıktı formatı açık bölüm olarak kalır.\",\n  gemini:\"Görev, bağlam ve çıktı formatı ayrı başlıklı bölümlerde verilir.\",\n  perplexity:\"Başlıklı bölümler + her iddiayı güncel, atıflı kaynakla eşleştirme talimatı eklenir.\"\n};\nconst PPLX = `\\n\\n## Kaynak kuralı\\nGüncel ve atıflı kaynak kullan. Mevzuat, platform kuralı veya sayısal her iddiayı satır içi kaynak numarasıyla eşleştir; kaynak bulamadığın iddiayı yazma veya \"doğrulanmalı\" olarak işaretle.`;\n\nlet platform = \"claude\";\ntry{ const p = localStorage.getItem(\"eva-platform\"); if(p && NOTES[p]) platform = p; }catch(e){}\n\nconst FIELDS = [\n [\"[TELEFON/WHATSAPP]\",\"Telefon / WhatsApp (ülke koduyla, ör. 90532…)\"],[\"[TELEGRAM]\",\"Telegram kullanıcı adı\"],\n [\"[SOSYAL MEDYA HESAPLARI]\",\"Sosyal medya hesapları\"],[\"[ÇALIŞMA SAATLERİ]\",\"Çalışma saatleri\"],[\"[WEB ADRESİ]\",\"Web adresi\"],[\"[AÇIK ADRES]\",\"Ofis adresi (Balgat)\"],\n [\"[SAĞLIK BAKANLIĞI ULUSLARARASI SAĞLIK TURİZMİ YETKİ BELGESİ NO]\",\"Yetki belgesi no\"],\n [\"[ANLAŞMALI HASTANE ADI]\",\"Anlaşmalı hastaneler\"],[\"[AKREDİTASYON]\",\"Akreditasyonlar\"],\n [\"[HEKİM ADI VE UZMANLIĞI]\",\"İnceleyen hekim ve uzmanlığı\"],[\"[TEDAVİ ALANLARI]\",\"Tedavi alanları\"],\n [\"[EKİP DİLLERİ]\",\"Ekipte konuşulan diller\"],[\"[YANIT SÜRESİ]\",\"İlk yanıt süresi\"],\n [\"[EK HİZMETLER]\",\"Ek hizmetler\"],[\"[AYLIK REKLAM BÜTÇESİ]\",\"Aylık reklam bütçesi\"],[\"[BAŞLANGIÇ TARİHİ]\",\"Kampanya başlangıç tarihi\"]\n];\nlet vals = {};\ntry{ vals = JSON.parse(localStorage.getItem(\"eva-fields\")||\"{}\")||{}; }catch(e){ vals = {}; }\nconst LABELS = Object.fromEntries(S.map(s=>[s[0],s[1]]));\nlet partners = {h:[], d:[]};\ntry{ const p = JSON.parse(localStorage.getItem(\"eva-partners\")||\"null\"); if(p && Array.isArray(p.h) && Array.isArray(p.d)) partners = p; }catch(e){}\nfunction savePartners(){ try{ localStorage.setItem(\"eva-partners\", JSON.stringify(partners)); }catch(e){} }\nfunction partnerText(){\n  if(!partners.h.length && !partners.d.length) return null;\n  const L = [];\n  L.push('Bu liste kullanıcı tarafından girildi; yalnızca bu bilgileri kullan, ekleme veya tahmin yapma. \"Tanıtım izni: Hayır\" olan kurum ve hekimlerin adını hiçbir kamuya açık içerikte (gönderi, reklam, web sayfası, schema) kullanma; yalnızca iç süreç belgelerinde ve takip tablolarında kullan. Boş bırakılan bilgiler için \"bilgi yok\" de, uydurma.');\n  L.push(\"\", \"Hastaneler ve sağlık kurumları:\");\n  if(!partners.h.length) L.push(\"- Henüz girilmedi; [ANLAŞMALI HASTANE ADI] yer tutucusunu kullan.\");\n  partners.h.forEach((h,i)=>L.push(`${i+1}. ${h.name} | Tür: ${h.type||\"bilgi yok\"} | İlçe: ${h.district||\"bilgi yok\"} | Branşlar: ${h.branches||\"bilgi yok\"} | Akreditasyon: ${h.accr||\"bilgi yok\"} | Sağlık turizmi yetki belgesi: ${h.license} | Yabancı hasta birimi: ${h.intl} | Tanıtım izni: ${h.perm?\"Evet\":\"Hayır\"}`));\n  L.push(\"\", \"Hekimler:\");\n  if(!partners.d.length) L.push(\"- Henüz girilmedi; [HEKİM ADI VE UZMANLIĞI] yer tutucusunu kullan.\");\n  partners.d.forEach((d,i)=>L.push(`${i+1}. ${d.name} | Uzmanlık: ${d.spec} | Kurum: ${d.inst||\"bilgi yok\"} | Diller: ${d.langs||\"bilgi yok\"} | Rol: ${d.role} | Tanıtım izni: ${d.perm?\"Evet\":\"Hayır\"}`));\n  return L.join(\"\\n\");\n}\nfunction fill(t){\n  const v2 = Object.assign({}, vals);\n  const okH = partners.h.filter(h=>h.perm).map(h=>h.name);\n  if(!(v2[\"[ANLAŞMALI HASTANE ADI]\"]||\"\").trim() && okH.length) v2[\"[ANLAŞMALI HASTANE ADI]\"] = okH.join(\", \");\n  FIELDS.forEach(([ph])=>{ const v=(v2[ph]||\"\").trim(); if(v) t=t.split(ph).join(\"\\u0001\"+v+\"\\u0002\"); });\n  return t;\n}\nfunction refs(t){\n  if(platform===\"claude\") return t;\n  return t.replace(/<(\\w+)>/g,(m,id)=>LABELS[id]?`\"${LABELS[id]}\"`:m);\n}\nfunction raw(t){return t.replace(/[\\u0001\\u0002]/g,\"\");}\nfunction block(id,label,body){\n  if(id===\"partner_directory\"){ const p = partnerText(); if(p) return platform===\"claude\" ? `<${id}>\\n${p}\\n<\/${id}>` : `# ${label}\\n${p}`; }\n  const b = fill(refs(body));\n  return platform===\"claude\" ? `<${id}>\\n${b}\\n<\/${id}>` : `# ${label}\\n${b}`;\n}\nfunction fullPrompt(){\n  let t = S.map(s=>block(s[0],s[1],s[2])).join(\"\\n\\n\");\n  if(platform===\"perplexity\") t += PPLX;\n  return raw(t + \"\\n\\n\" + TAIL);\n}\nfunction esc(s){return s.replace(/[&<>]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\"}[c]));}\nfunction mark(s){return esc(s).replace(/\\[[A-ZÇĞİÖŞÜ][^\\]]*\\]/g,m=>`<span class=\"ph\">${m}<\/span>`).replace(/\\u0001([^\\u0002]*)\\u0002/g,'<span class=\"fill\">$1<\/span>');}\nconst form = document.getElementById(\"fields\");\nform.innerHTML = FIELDS.map(([ph,l],i)=>`<label for=\"f${i}\">${esc(l)}<input id=\"f${i}\" data-ph=\"${esc(ph)}\" placeholder=\"${esc(ph)}\"><\/label>`).join(\"\");\nform.querySelectorAll(\"input\").forEach(inp=>{\n  inp.value = vals[inp.dataset.ph]||\"\";\n  inp.addEventListener(\"change\",()=>{ vals[inp.dataset.ph]=inp.value; try{l

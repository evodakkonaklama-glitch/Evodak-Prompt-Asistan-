h\",arr_3m:\"In 1–3 months\",arr_unknown:\"Not decided yet\",\ndiagnosed:\"Is there an existing diagnosis?\",yes:\"Yes\",no:\"No\",evaluating:\"Still being evaluated\",diagnosis:\"Diagnosis (if known)\",\nprev:\"Previous treatments\",prev_ph:\"Surgery, chemotherapy, radiotherapy, etc., with dates\",\nrequest:\"How can we help?\",request_ph:\"E.g. a doctor's opinion on a treatment plan, a hospital appointment, accommodation and transfer\",companions:\"Number of companions\",\ndocs_title:\"Documents to prepare\",doc1:\"Discharge summary or latest doctor's report\",doc2:\"Pathology (biopsy) report\",doc3:\"Recent blood test results\",doc4:\"Imaging reports (MRI, CT, PET)\",doc5:\"List of current medications\",\ndocs_how:\"Don't upload documents to this page. In the last step, a chat with us opens in the app you choose (WhatsApp recommended); attach photos or PDFs of your documents in that chat.\",\ndocs_tip:\"When photographing, make sure the whole page is visible and the text is readable. If the scan images themselves (DICOM) are very large, our coordinator will tell you how to send them.\",\ndocs_ready:\"Are your documents ready?\",dr_yes:\"Ready\",dr_some:\"Some of them\",dr_no:\"Not yet\",\nsummary:\"Your details\",none:\"—\",\nprivacy:\"I have read the {link}.\",privacy_link:\"privacy notice\",\nconsent_health:\"I give my explicit consent for the information in this form and the medical documents I will send in the chat (or, if I'm applying as a family member, the patient's information with their permission) to be processed to plan the treatment and shared with partner hospitals and doctors.\",\nconsent_marketing:\"I'd like to receive information messages (optional).\",\nsend_title:\"Where would you like to send your application?\",send_hint:\"When you tap a button, the message below is prepared and the chat opens. Send the message, then attach your documents in the same chat.\",\nrec:\"Recommended for documents\",copy_note:\"Telegram, Instagram and Messenger can't prefill the message; it's copied to your clipboard, so paste it in the chat.\",\nmsg_preview:\"Message to be sent\",copied:\"Message copied. Paste it in the chat that opened.\",copy_fail:\"The message couldn't be copied automatically; select the text above and copy it.\",\nback:\"Back\",next:\"Continue\",edit:\"Edit my details\",\nrequired:\"This field is required.\",bad_phone:\"Enter the number with country code, e.g. +44 7xxx xxxxxx.\",bad_email:\"Enter a valid email address.\",bad_year:\"Enter a valid year.\",need_email:\"Enter your email address so we can contact you by email.\",\nok_title:\"Last step: send the message\",ok_body:\"Send the prepared message in the chat that opened and attach your documents in the same chat. A coordinator will get back to you {when}. Please note your reference number.\",\nok_demo:\"Preview: no chat opened because contact accounts haven't been added.\",ok_again:\"If the chat didn't open, try again:\",\nnext_title:\"What happens next?\",next1:\"A coordinator reviews your message and documents and contacts you.\",next2:\"With your permission, your documents are shared with a suitable hospital and doctor.\",next3:\"After the doctor's review, we plan the treatment, appointments, accommodation and transfer together.\",\nsafe_title:\"Your information\",safe:\"This page doesn't store your information; it only prepares your message. We recommend WhatsApp, which is end-to-end encrypted, for documents. Only a doctor makes medical assessments; this form does not give a diagnosis or treatment advice.\",\nquick_title:\"Prefer to talk now?\",quick_wa:\"Message us on WhatsApp\",quick_call:\"Call us now\",\nurgent_title:\"Emergencies\",urgent:\"Don't use this form for a medical emergency. Call the emergency number in your country.\",\nwa_msg:\"Hello, I'd like information about treatment in Ankara.\",\nmsg_head:\"Hello, I'd like to submit a treatment pre-application to Ankara Sağlık Turizmi.\",msg_ref:\"Reference\",\nmsg_docs_now:\"I'm sending my documents right after this message.\",msg_docs_later:\"I'll send my documents when they're ready.\",msg_consent:\"I have read the privacy notice and given explicit consent to the processing of my health data.\"},\n\nar:{title:\"طلب العلاج المسبق\",intro:\"أدخل بياناتك، ثم أرسل طلبك ومستنداتك الطبية إلينا عبر واتساب أو وسائل التواصل الاجتماعي، وسيتواصل معك منسق المرضى بلغتك {when}.\",\nrt_in:\"خلال {rt}\",rt_soon:\"في أقرب وقت ممكن\",\ndemo_b:\"وضع المعاينة:\",demo:\"لم تُضَف حسابات التواصل بعد، وأزرار الإرسال تعرض معاينة فقط.\",\ns1:\"البيانات الشخصية\",s2:\"المعلومات الطبية\",s3:\"المستندات\",s4:\"الموافقة والإرسال\",optional:\"(اختياري)\",\nwho:\"من يقدّم الطلب؟\",who_patient:\"أنا المريض\",who_relative:\"أحد أقارب المريض\",applicant_name:\"اسمك الكامل\",relation:\"صلة القرابة بالمريض\",\npatient_name:\"الاسم الكامل للمريض\",birth_year:\"سنة ميلاد المريض\",sex:\"الجنس\",sex_f:\"أنثى\",sex_m:\"ذكر\",sex_na:\"أفضّل عدم الذكر\",\nlanguage:\"لغة التواصل المفضلة\",country:\"بلد الإقامة\",city:\"المدينة\",phone:\"الهاتف / واتساب (مع رمز الدولة)\",email:\"البريد الإلكتروني\",\ncontact_pref:\"كيف تفضّل أن نتواصل معك؟\",c_phone:\"اتصال هاتفي\",c_email:\"البريد الإلكتروني\",contact_time:\"الوقت المناسب للتواصل\",\narea:\"مجال العلاج\",area_onc:\"الأورام (علاج السرطان)\",area_other:\"أخرى\",area_unsure:\"لست متأكدًا\",\narrival:\"متى تخطط للقدوم؟\",arr_asap:\"في أقرب وقت ممكن\",arr_1m:\"خلال شهر\",arr_3m:\"خلال 1–3 أشهر\",arr_unknown:\"لم يُحدَّد بعد\",\ndiagnosed:\"هل يوجد تشخيص حالي؟\",yes:\"نعم\",no:\"لا\",evaluating:\"قيد التقييم\",diagnosis:\"التشخيص (إن كان معروفًا)\",\nprev:\"العلاجات السابقة\",prev_ph:\"جراحة، علاج كيميائي، علاج إشعاعي وغيرها، مع التواريخ\",\nrequest:\"كيف يمكننا مساعدتك؟\",request_ph:\"مثلًا: رأي طبيب في خطة العلاج، موعد في المستشفى، الإقامة والنقل\",companions:\"عدد المرافقين\",\ndocs_title:\"المستندات التي يجب تجهيزها\",doc1:\"ملخص الخروج أو آخر تقرير طبي\",doc2:\"تقرير علم الأمراض (الخزعة)\",doc3:\"نتائج تحاليل الدم الأخيرة\",doc4:\"تقارير التصوير (الرنين المغناطيسي، الأشعة المقطعية، PET)\",doc5:\"قائمة الأدوية الحالية\",\ndocs_how:\"لا ترفع المستندات إلى هذه الصفحة. في الخطوة الأخيرة تُفتح محادثة معنا في التطبيق الذي تختاره (يُنصح بواتساب)، فأرفق صور المستندات أو ملفات PDF في تلك المحادثة.\",\ndocs_tip:\"عند التصوير تأكّد من ظهور الصفحة كاملة ووضوح النص. إذا كانت ملفات الصور نفسها (DICOM) كبيرة جدًا، فسيخبرك منسقنا بطريقة إرسالها.\",\ndocs_ready:\"هل مستنداتك جاهزة؟\",dr_yes:\"جاهزة\",dr_some:\"بعضها جاهز\",dr_no:\"ليست جاهزة بعد\",\nsummary:\"بياناتك\",none:\"—\",\nprivacy:\"لقد قرأت {link} المتعلق بمعالجة البيانات الشخصية.\",privacy_link:\"إشعار الخصوصية\",\nconsent_health:\"أوافق صراحةً على معالجة المعلومات الواردة في هذا النموذج والمستندات الطبية التي سأرسلها عبر المحادثة (أو معلومات المريض بإذنه إذا كنت أتقدّم بصفتي أحد أقاربه) لغرض تخطيط العلاج، وعلى مشاركتها مع المستشفيات والأطباء المتعاقدين.\",\nconsent_marketing:\"أرغب في تلقي رسائل إعلامية (اختياري).\",\nsend_title:\"عبر أي تطبيق تريد إرسال طلبك؟\",send_hint:\"عند الضغط على أحد الأزرار تُجهَّز الرسالة أدناه وتُفتح المحادثة. أرسل الرسالة ثم أرفق مستنداتك في المحادثة نفسها.\",\nrec:\"مُوصى به لإرسال المستندات\",copy_note:\"لا يمكن لتيليغرام وإنستغرام وماسنجر تعبئة الرسالة تلقائيًا؛ ستُنسخ الرسالة، فالصقها في المحادثة.\",\nmsg_preview:\"نص الرسالة\",copied:\"تم نسخ الرسالة، الصقها في المحادثة التي فُتحت.\",copy_fail:\"تعذّر نسخ الرسالة تلقائيًا؛ حدّد النص أعلاه وانسخه.\",\nback:\"رجوع\",next:\"متابعة\",edit:\"تعديل بياناتي\",\nrequired:\"هذا الحقل مطلوب.\",bad_phone:\"أدخل الرقم مع رمز الدولة، مثل ‎+966 5x xxx xxxx.\",bad_email:\"أدخل بريدًا إلكترونيًا صالحًا.\",bad_year:\"أدخل سنة صحيحة.\",need_email:\"أدخل بريدك الإلكتروني لنتمكّن من التواصل معك عبره.\",\nok_title:\"الخطوة الأخيرة: أرسل الرسالة\",ok_body:\"أرسل الرسالة الجاهزة في المحادثة التي فُتحت وأرفق مستنداتك في المحادثة نفسها. سيتواصل معك منسقنا {when}. يُرجى الاحتفاظ برقم طلبك.\",\nok_demo:\"معاينة: لم تُفتح أي محادثة لأن حسابات التواصل لم تُضَف بعد.\",ok_again:\"إذا لم تُفتح المحادثة، حاول مرة أخرى:\",\nnext_title:\"ماذا يحدث بعد ذلك؟\",next1:\"يراجع منسقنا رسالتك ومستنداتك ويتواصل معك.\",next2:\"تُشارَك مستنداتك، بإذنك، مع المستشفى والطبيب المناسبين.\",next3:\"بعد تقييم الطبيب، نخطط معًا للعلاج والمواعيد والإقامة والنقل.\",\nsafe_title:\"معلوماتك\",safe:\"لا تحفظ هذه الصفحة معلوماتك، بل تُجهّز رسالتك فقط. ننصح بإرسال المستندات عبر واتساب لأنه مشفّر بالكامل بين الطرفين. التقييم الطبي يقوم به الطبيب وحده، وهذا النموذج لا يقدّم تشخيصًا أو توصية علاجية.\",\nquick_title:\"تفضّل التحدث الآن؟\",quick_wa:\"راسلنا عبر واتساب\",quick_call:\"اتصل بنا الآن\",\nurgent_title:\"الحالات الطارئة\",urgent:\"لا تستخدم هذا النموذج في حالة طبية طارئة، واتصل برقم الطوارئ في بلدك.\",\nwa_msg:\"مرحبًا، أودّ الحصول على معلومات حول العلاج في أنقرة.\",\nmsg_head:\"مرحبًا، أودّ تقديم طلب علاج مسبق إلى Ankara Sağlık Turizmi.\",msg_ref:\"رقم الطلب\",\nmsg_docs_now:\"سأرسل مستنداتي بعد هذه الرسالة مباشرة.\",msg_docs_later:\"سأرسل مستنداتي عندما تصبح جاهزة.\",msg_consent:\"قرأت إشعار الخصوصية ووافقت صراحةً على معالجة بياناتي الصحية.\"},\n\nru:{title:\"Предварительная заявка на лечение\",intro:\"Заполните данные, затем отправьте заявку и медицинские документы через WhatsApp или социальные сети. Координатор свяжется с Вами на Вашем языке {when}.\",\nrt_in:\"в течение {rt}\",rt_soon:\"в ближайшее время\",\ndemo_b:\"Режим предпросмотра:\",demo:\"контакты ещё не добавлены, кнопки отправки показывают только предпросмотр.\",\ns1:\"Личные данные\",s2:\"Медицинская информация\",s3:\"Документы\",s4:\"Согласие и отправка\",optional:\"(необязательно)\",\nwho:\"Кто подаёт заявку?\",who_patient:\"Я пациент\",who_relative:\"Родственник пациента\",applicant_name:\"Ваши имя и фамилия\",relation:\"Кем Вы приходитесь пациенту\",\npatient_name:\"Имя и фамилия пациента\",birth_year:\"Год рождения пациента\",sex:\"Пол\",sex_f:\"Женский\",sex_m:\"Мужской\",sex_na:\"Предпочитаю не указывать\",\nlanguage:\"Язык общения\",country:\"Страна проживания\",city:\"Город\",phone:\"Телефон / WhatsApp (с кодом страны)\",email:\"Электронная почта\",\ncontact_pref:\"Как с Вами связаться?\",c_phone:\"Звонок\",c_email:\"Эл. почта\",contact_time:\"Удобное время для связи\",\narea:\"Направление лечения\",area_onc:\"Онкология (лечение рака)\",area_other:\"Другое\",area_unsure:\"Не уверен(а)\",\narrival:\"Когда Вы планируете приехать?\",arr_asap:\"Как можно скорее\",arr_1m:\"В течение месяца\",arr_3m:\"Через 1–3 месяца\",arr_unknown:\"Пока не определено\",\ndiagnosed:\"Есть ли установленный диагноз?\",yes:\"Да\",no:\"Нет\",evaluating:\"Обследование продолжается\",diagnosis:\"Диагноз (если известен)\",\nprev:\"Предыдущее лечение\",prev_ph:\"Операции, химиотерапия, лучевая терапия и т. д., с датами\",\nrequest:\"Чем мы можем помочь?\",request_ph:\"Например: мнение врача о плане лечения, запись в клинику, проживание и трансфер\",companions:\"Количество сопровождающих\",\ndocs_title:\"Какие документы подготовить\",doc1:\"Выписка или последнее заключение врача\",doc2:\"Гистологическое заключение (биопсия)\",doc3:\"Свежие анализы крови\",doc4:\"Заключения МРТ, КТ, ПЭТ\",doc5:\"Список принимаемых лекарств\",\ndocs_how:\"Не загружайте документы на эту страницу. На последнем шаге откроется чат с нами в выбранном приложении (рекомендуем WhatsApp): прикрепите фото или PDF документов в этом чате.\",\ndocs_tip:\"При фотографировании убедитесь, что страница видна целиком и текст читается. Если сами снимки (DICOM) очень большие, координатор подскажет, как их передать.\",\ndocs_ready:\"Документы готовы?\",dr_yes:\"Готовы\",dr_some:\"Частично\",dr_no:\"Пока нет\",\nsummary:\"Ваши данные\",none:\"—\",\nprivacy:\"Я ознакомился(-ась) с {link}.\",privacy_link:\"уведомлением об обработке персональных данных\",\nconsent_health:\"Я даю явное согласие на обработку сведений из этой формы и медицинских документов, которые я отправлю в чате (или, если я подаю заявку как родственник, сведений о пациенте с его разрешения), для планирования лечения и на их передачу партнёрским клиникам и врачам.\",\nconsent_marketing:\"Я хочу получать информационные сообщения (необязательно).\",\nsend_title:\"Куда отправить заявку?\",send_hint:\"При нажатии кнопки подготовится сообщение ниже и откроется чат. Отправьте сообщение, затем прикрепите документы в том же чате.\",\nrec:\"Рекомендуем для документов\",copy_note:\"Telegram, Instagram и Messenger не подставляют текст автоматически: сообщение копируется в буфер обмена, вставьте его в чат.\",\nmsg_preview:\"Текст сообщения\",copied:\"Сообщение скопировано. Вставьте его в открывшийся чат.\",copy_fail:\"Не удалось скопировать автоматически: выделите текст выше и скопируйте его.\",\nback:\"Назад\",next:\"Далее\",edit:\"Изменить данные\",\nrequired:\"Это поле обязательно.\",bad_phone:\"Укажите номер с кодом страны, например +7 9xx xxx-xx-xx.\",bad_email:\"Введите корректный адрес эл. почты.\",bad_year:\"Введите корректный год.\",need_email:\"Укажите адрес эл. почты, чтобы мы могли связаться с Вами по почте.\",\nok_title:\"Последний шаг: отправьте сообщение\",ok_body:\"Отправьте подготовленное сообщение в открывшемся чате и прикрепите документы в том же чате. Координатор ответит Вам {when}. Сохраните номер заявки.\",\nok_demo:\"Предпросмотр: чат не открылся, так как контакты ещё не добавлены.\",ok_again:\"Если чат не открылся, попробуйте ещё раз:\",\nnext_title:\"Что будет дальше?\",next1:\"Координатор изучит сообщение и документы и свяжется с Вами.\",next2:\"С Вашего разрешения документы передаются подходящей клинике и врачу.\",next3:\"После оценки врача мы вместе спланируем лечение, приёмы, проживание и трансфер.\",\nsafe_title:\"Ваши данные\",safe:\"Эта страница не сохраняет Ваши данные, она только готовит сообщение. Для документов рекомендуем WhatsApp со сквозным шифрованием. Медицинскую оценку даёт только врач; эта форма не ставит диагноз и не даёт рекомендаций по лечению.\",\nquick_title:\"Хотите поговорить сейчас?\",quick_wa:\"Написать в WhatsApp\",quick_call:\"Позвонить\",\nurgent_title:\"Экстренные случаи\",urgent:\"Не используйте эту форму при неотложном состоянии. Позвоните по номеру экстренной помощи в Вашей стране.\",\nwa_msg:\"Здравствуйте, я хотел(а) бы получить информацию о лечении в Анкаре.\",\nmsg_head:\"Здравствуйте, я хочу подать предварительную заявку на лечение в Ankara Sağlık Turizmi.\",msg_ref:\"Номер заявки\",\nmsg_docs_now:\"Документы отправлю сразу после этого сообщения.\",msg_docs_later:\"Документы отправлю, когда они будут готовы.\",msg_consent:\"Я ознакомился(-ась) с уведомлением и дал(а) явное согласие на обработку медицинских данных.\"}\n};\n\nconst LANGS = [\"en\",\"ar\",\"ru\",\"tr\"];\nlet lang = \"tr\";\n(function pick(){\n  if (LANGS.includes(window.__LANG)) { lang = window.__LANG; return; }\n  const q = (new URLSearchParams(location.search).get(\"lang\")||location.hash.slice(1)||\"\").toLowerCase();\n  if (LANGS.includes(q)) { lang = q; return; }\n  const n = (navigator.language||\"tr\").slice(0,2).toLowerCase();\n  if (LANGS.includes(n)) lang = n;\n})();\nconst SITE_BASE = \"https://evodakkonaklama-glitch.github.io/Evodak-Prompt-Asistan-/site/\";\nlet CH = {}, demo = true;\nfunction computeChannels(){\n  CH = { whatsapp: CONFIG.WHATSAPP, telegram: CONFIG.TELEGRAM, instagram: CONFIG.INSTAGRAM, messenger: CONFIG.MESSENGER };\n  demo = !Object.values(CH).some(Boolean);\n}\ncomputeChannels();\nfunction privacyUrl(){ return CONFIG.PRIVACY_URL || (SITE_BASE + (lang === \"tr\" ? \"kvkk/\" : lang + \"/privacy/\")); }\n/* Panelden (\"Web sitesi yönetimi\" → Ayarlar ve Sosyal medya) yapılan değişiklikleri al */\nfunction applyRemote(d){\n  const s = (d && d.settings) || {}, so = (d && d.social) || [];\n  const dig = x => String(x||\"\").replace(/\\D/g,\"\");\n  if (s.whatsapp || s.phone_display) CONFIG.WHATSAPP = dig(s.whatsapp) || dig(s.phone_display).replace(/^0+/,\"\");\n  if (s.phone_display) CONFIG.PHONE_DISPLAY = s.phone_display;\n  if (s.privacy_url) CONFIG.PRIVACY_URL = s.privacy_url;\n  if (s.response_time) CONFIG.RESPONSE_TIME = Object.assign({}, CONFIG.RESPONSE_TI ap:8px;align-items:center}\n@media (max-width:700px){.srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.srow .u{grid-column:1/-1}}\nfieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;display:grid;gap:10px;min-width:0}\nlegend{font-weight:800;font-size:14px;padding:0 6px}\n.tgroup{border:1px solid var(--line);border-radius:10px;background:var(--bg)}\n.tgroup>summary{cursor:pointer;padding:10px 12px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}\n.tgroup .rows{display:grid;gap:10px;padding:0 12px 12px}\n.trow{display:grid;gap:4px}\n.trow .lbl{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}\n.trow .chg{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}\n.trow .reset{font:700 11.5px var(--body);background:none;border:0;color:var(--accent);cursor:pointer;padding:0}\n.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.hist li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}\n.hist .m{flex:1 1 300px;min-width:0}\n.hist .m b{display:block;font-size:14px;overflow-wrap:anywhere}\n.hist .m span{font-size:12.5px;color:var(--muted)}\n.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 -6px 20px rgba(0,0,0,.06);margin:0 16px 16px;max-width:968px}\n@media (min-width:1032px){.savebar{margin-inline:auto}}\n.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1 1 160px}\n.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}\nol.help{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:14px}\ncode{font-size:13px;background:var(--bg);border:1px solid ab\" data-tab=\"social\" aria-selected=\"false\">Sosyal medya<\/button>\n    <button type=\"button\" role=\"tab\" data-tab=\"history\" aria-selected=\"false\">Geçmiş<\/button>\n    <button type=\"button\" role=\"tab\" data-tab=\"connect\" aria-selected=\"false\">GitHub bağlantısı<\/button>\n  <\/div>\n\n  <!-- KURULUM REHBERİ -->\n  <section data-pane=\"setup\" class=\"card\" hidden>\n    <h2>Siteyi tam olarak yayına almak için yapmanız gerekenler<\/h2>\n    <p class=\"muted\">Teknik altyapı hazır. Aşağıdaki adımlar sizin hesaplarınızla yapılması gereken işler. Sırayla ilerleyin; her adımın yanına ne zaman yaptığınızı not edebilirsiniz.<\/p>\n    <ol class=\"help\" style=\"gap:14px\">\n      <li><b>KVKK ve hukuki onay (en önce).<\/b> Hukukçunuza şunları inceletin: \"Metinler\" sekmesindeki \"KVKK / gizlilik metni\" grubu, hasta başvuru formundaki açık rıza cümlesi, yorum ve ekip izin süreçleri. VERBİS kaydı yükümlülüğünüzü de sorun. Onaydan sonra \"Ayarlar → Yasal bilgiler\" alanlarını doldurun ve \"hukukçu tarafından onaylandı\" kutusunu işaretleyin.<\/li>\n      <li><b>Yasal bilgiler.<\/b> Şirket unvanı, yetki belgesi no, MERSİS, KEP, açık adres ve e-postayı \"Ayarlar\"a girin. Bunlar sitenin altında ve KVKK sayfasında otomatik görünür.<\/li>\n      <li><b>Alan adı.<\/b> Bir alan adı alın (ör. ankarasaglikturizmi.com). Siteyi bu adrese taşımak için iki yol var: (a) GitHub'da boş bir depo oluşturup bana adını verin, siteyi oraya taşıyıp alan adını bağlarım; (b) mevcut bir hosting'iniz varsa <code>site<\/code> klasörünün içeriğini oraya yükleyin. GitHub Pages ile yayınlarsanız alan adı firmanızın DNS ayarlarına dört A kaydı (185.199.108.153, 185.199.109.153, 185.199.110.153, 185.199.111.153) ve <code>www<\/code> için CNAME kaydı girilir. Taşıdıktan sonra \"Ayarlar → Alan adı\"na yeni adresi yazın, yayınlayın ve siteyi yeniden derlememi isteyin.<\/li>\n      <li><b>Google Search Console.<\/b> search.google.com/search-console → alan adınızı ekleyin, DNS doğrulamasını yapın, \"Site haritaları\" bölümüne <code>sitemap.xml<\/code> gönderin.<\/li>\n      <li><b>Bing Webmaster Tools.<\/b> bing.com/webmasters → Search Console'dan içe aktarın. ChatGPT'nin arama özelliği büyük ölçüde Bing dizinini kullanır; bu adımı atlamayın.<\/li>\n      <li><b>Google İşletme Profili.<\/b> business.google.com → Balgat ofisinizi ekleyin; ad, adres ve telefon sitedekiyle birebir aynı olsun. Çalışma saatlerini, web sitesini ve fotoğrafları ekleyin.<\/li>\n      <li><b>Ziyaretçi ölçümü.<\/b> goatcounter.com'da ücretsiz hesap açın (çerezsizdir, onay penceresi gerekmez). Seçtiğiniz kodu \"Ayarlar → Ziyaretçi ölçümü\"ne yazın. Arama, WhatsApp ve başvuru tıklamaları otomatik sayılır.<\/li>\n      <li><b>İletişim kanalları.<\/b> WhatsApp Business'ı şirket hattına kurun; karşılama ve mesai dışı mesajlarını prompt panelindeki Faz 6 çıktısıyla doldurun. Instagram, Facebook ve Telegram hesaplarınızı \"Sosyal medya\" sekmesine ekleyin.<\/li>\n      <li><b>İçerik.<\/b> \"Kayan resimler\"e kendi fotoğraflarınızı, \"Ekip\"e koordinatörlerinizi, \"Kurumlar\"a tanıtım izni olan hastaneleri ekleyin. Yorumları yalnızca yazılı rızayla ve hukuki onaydan sonra ekleyin.<\/li>\n      <li><b>Aylık bakım.<\/b> Search Console'daki hataları kontrol edin, ChatGPT, Gemini, Perplexity ve Claude'a 4 dilde \"Ankara'da yabancı hastalara tedavi koordinasyonu\" gibi sorular sorup sitenizin görünüp görünmediğini not edin, değişen bilgileri (saatler, kurumlar, duyurular) güncelleyin.<\/li>\n    <\/ol>\n  <\/section>\n\n  <!-- AYARLAR -->\n  <section data-pane=\"settings\" class=\"card\">\n    <h2>Site ayarları<\/h2>\n    <p class=\"muted\">Burada yaptığınız değişiklikler, yayınladıktan 1–2 dakika sonra sitenin 4 dilinde ve hasta başvuru formunda görünür.<\/p>\n    <fieldset><legend>İletişim<\/legend>\n      <div class=\"g2\">\n        <label class=\"f\">Telefon (görünen)<input type=\"tel\" data-s=\"phone_display\" placeholder=\"+90 549 285 60 05\"><\/label>\n        <label class=\"f\">WhatsApp numarası (boşsa telefon kullanılır)<input type=\"tel\" data-s=\"whatsapp\" placeholder=\"905492856005\"><\/label>\n        <label class=\"f\">E-posta<input type=\"email\" data-s=\"email\" placeholder=\"info@…\"><\/label>\n        <label class=\"f\">Açık adres<input type=\"text\" data-s=\"address_line\" placeholder=\"Mahalle, cadde, no, Balgat, Çankaya/Ankara\"><\/label>\n      <\/div>\n      <p class=\"muted\" style=\"font-size:13px\">Adres girildiğinde sitedeki harita ve yol tarifi bağlantıları bu adresi gösterir.<\/p>\n      <div class=\"g4\">\n        <label class=\"f\">Çalışma saatleri (TR)<input type=\"text\" data-s=\"hours.tr\" placeholder=\"Pzt–Cmt 09.00–19.00\"><\/label>\n        <label class=\"f\">Opening hours (EN)<input type=\"text\" data-s=\"hours.en\"><\/label>\n        <label class=\"f\">ساعات العمل (AR)<input type=\"text\" data-s=\"hours.ar\" dir=\"rtl\"><\/label>\n        <label class=\"f\">Часы работы (RU)<input type=\"text\" data-s=\"hours.ru\"><\/label>\n      <\/div>\n      <div class=\"g4\">\n        <label class=\"f\">Yanıt süresi (TR)<input type=\"text\" data-s=\"response_time.tr\" placeholder=\"24 saat\"><\/label>\n        <label class=\"f\">Response time (EN)<input type=\"text\" data-s=\"response_time.en\" placeholder=\"24 hours\"><\/label>\n        <label class=\"f\">مدة الرد (AR)<input type=\"text\" data-s=\"response_time.ar\" dir=\"rtl\" placeholder=\"24 ساعة\"><\/label>\n        <label class=\"f\">Срок ответа (RU)<input type=\"text\" data-s=\"response_time.ru\" placeholder=\"24 часов\"><\/label>\n      <\/div>\n      <p class=\"muted\" style=\"font-size:13px\">Yanıt süresi hasta başvuru formunda \"… içinde size dönüyoruz\" cümlesinde kullanılır. Gerçekten uyabileceğiniz bir süre yazın.<\/p>\n    <\/fieldset>\n    <fieldset><legend>Yasal bilgiler<\/legend>\n      <div class=\"g2\">\n        <label class=\"f\">Şirket unvanı<input type=\"text\" data-s=\"legal_name\" placeholder=\"… Sağlık Turizmi Ltd. Şti.\"><\/label>\n        <label class=\"f\">Sağlık turizmi yetki belgesi no<input type=\"text\" data-s=\"license_no\"><\/label>\n        <label class=\"f\">MERSİS no<input type=\"text\" data-s=\"mersis\"><\/label>\n        <label class=\"f\">KEP adresi<input type=\"text\" data-s=\"kep\"><\/label>\n      <\/div>\n      <label class=\"chk\"><input type=\"checkbox\" data-s=\"privacy_approved\"> KVKK aydınlatma metni hukukçu tarafından onaylandı (taslak uyarısı kalkar, sayfa arama motorlarına açılır)<\/label>\n      <div class=\"g2\">\n        <label class=\"f\">Metnin son güncelleme tarihi<input type=\"date\" data-s=\"privacy_updated\"><\/label>\n        <label class=\"f\">Harici aydınlatma metni linki (isteğe bağlı)<input type=\"url\" data-s=\"privacy_url\" placeholder=\"Boşsa sitedeki KVKK sayfası kullanılır\"><\/label>\n      <\/div>\n      <p class=\"muted\" style=\"font-size:13px\">KVKK metninin içeriğini \"Metinler\" sekmesinde \"KVKK / gizlilik metni\" grubundan düzenleyebilirsiniz.<\/p>\n    <\/fieldset>\n    <fieldset><legend>Ziyaretçi ölçümü<\/legend>\n      <div class=\"g2\">\n        <label class=\"f\">Araç<select data-s=\"analytics.provider\">\n          <option value=\"none\">Kapalı<\/option>\n          <option value=\"goatcounter\">GoatCounter (çerezsiz, ücretsiz, önerilen)<\/option>\n          <option value=\"cloudflare\">Cloudflare Web Analytics (çerezsiz)<\/option>\n          <option value=\"ga4\">Google Analytics 4 (çerezli, onay penceresi gösterilir)<\/option>\n        <\/select><\/label>\n        <label class=\"f\">Kimlik<input type=\"text\" data-s=\"analytics.id\" placeholder=\"GoatCounter kodu, Cloudflare token veya G-XXXX\"><\/label>\n      <\/div>\n      <p class=\"muted\" style=\"font-size:13px\">Sitede arama, WhatsApp, başvuru ve sosyal medya tıklamaları olay olarak ölçülür (GoatCounter ve GA4). Çerezsiz araçlarda onay penceresi gerekmez.<\/p>\n    <\/fieldset>\n    <fieldset><legend>Alan adı<\/legend>\n      <label class=\"f\">Sitenin adresi<input type=\"url\" data-s=\"base_url\" placeholder=\"https://www.ankarasaglikturizmi.com/\"><\/label>\n      <p class=\"muted\" style=\"font-size:13px\">Kendi alan adınıza taşıdığınızda buraya yazın. Arama motoru bağlantıları (sitemap, canonical, hreflang) site yeniden derlendiğinde bu adrese göre güncellenir.<\/p>\n    <\/fieldset>\n  <\/section>\n\n  <!-- METİNLER -->\n  <section data-pane=\"texts\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Site metinleri<\/h2><span class=\"count\" id=\"textCount\">0 değişiklik<\/span><\/div>\n    <p class=\"muted\">Sitedeki tüm başlık ve metinleri 4 dilde düzenleyin. Değiştirdiğiniz alan sarı işaretlenir; \"Varsayılana dön\" ile eski haline getirebilirsiniz. Tedavi sonucu, fiyat veya \"en iyi\" gibi iddialar eklemeyin.<\/p>\n    <div class=\"g2\">\n      <label class=\"f\">Dil<select id=\"tLang\"><option value=\"tr\">Türkçe<\/option><option value=\"en\">English<\/option><option value=\"ar\">العربية<\/option><option value=\"ru\">Русский<\/option><\/select><\/label>\n      <label class=\"f\">Ara<input type=\"search\" id=\"tSearch\" placeholder=\"ör. telefon, SSS, vize\"><\/label>\n    <\/div>\n    <div id=\"tList\" style=\"display:grid;gap:8px\"><p class=\"muted\">Metinler yükleniyor…<\/p><\/div>\n  <\/section>\n\n  <!-- DUYURU -->\n  <section data-pane=\"announce\" class=\"card\" hidden>\n    <h2>Duyuru bandı<\/h2>\n    <p class=\"muted\">Sitenin en üstünde ince bir şerit olarak görünür (ör. bayram çalışma saatleri). Ziyaretçi kapatabilir.<\/p>\n    <label class=\"chk\"><input type=\"checkbox\" data-a=\"active\"> Duyuru yayında<\/label>\n    <div class=\"g2\">\n      <label class=\"f\">Türkçe<input type=\"text\" data-a=\"text.tr\"><\/label>\n      <label class=\"f\">English<input type=\"text\" data-a=\"text.en\"><\/label>\n      <label class=\"f\">العربية<input type=\"text\" data-a=\"text.ar\" dir=\"rtl\"><\/label>\n      <label class=\"f\">Русский<input type=\"text\" data-a=\"text.ru\"><\/label>\n      <label class=\"f\">Bağlantı (isteğe bağlı)<input type=\"url\" data-a=\"link\" placeholder=\"https://…\"><\/label>\n      <label class=\"f\">Bu tarihten sonra gizle (isteğe bağlı)<input type=\"date\" data-a=\"until\"><\/label>\n    <\/div>\n  <\/section>\n\n  <!-- KAYAN RESİMLER -->\n  <section data-pane=\"slider\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Açılıştaki kayan resimler<\/h2><span class=\"count\" id=\"sliderCount\">0<\/span><\/div>\n    <p class=\"muted\">Sitenin üst bölümünde 5,5 saniyede bir değişen geniş resimler. Yatay, en az 1600 piksel genişliğinde fotoğraflar seçin; yüklemeden önce otomatik küçültülür.<\/p>\n    <div class=\"adders\"><label class=\"btn\" for=\"sliderFile\">+ Resim ekle<\/label><input id=\"sliderFile\" type=\"file\" accept=\"image/*\" multiple hidden><\/div>\n    <ul class=\"items\" id=\"sliderList\"><\/ul>\n  <\/section>\n\n  <!-- BÖLÜM MEDYASI -->\n  <section data-pane=\"sections\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Bölüm resim ve videoları<\/h2>\n      <label style=\"display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px\">Bölüm <select id=\"secSel\" style=\"width:auto\"><\/select><\/label><\/div>\n    <p class=\"muted\" id=\"secHint\"><\/p>\n    <div class=\"adders\">\n      <label class=\"btn\" for=\"secImg\">+ Resim ekle<\/label><input id=\"secImg\" type=\"file\" accept=\"image/*\" multiple hidden>\n      <label class=\"btn sec\" for=\"secVid\">+ Video yükle (MP4, en fazla 25 MB)<\/label><input id=\"secVid\" type=\"file\" accept=\"video/mp4,video/webm\" hidden>\n      <div class=\"yt-add\"><input type=\"url\" id=\"ytUrl\" placeholder=\"YouTube linki (ör. https://youtu.be/…)\"><button type=\"button\" class=\"btn sec\" id=\"ytAdd\">Ekle<\/button><\/div>\n    <\/div>\n    <ul class=\"items\" id=\"secList\"><\/ul>\n  <\/section>\n\n  <!-- EKİP -->\n  <section data-pane=\"team\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Ekibimiz<\/h2><span class=\"count\" id=\"teamCount\">0<\/span><\/div>\n    <p class=\"muted\">Sitede \"Ekibimiz\" bölümünde fotoğraflı kartlar olarak görünür. Ad ve fotoğrafının yayımlanması için her çalışandan yazılı izin alın; izin kutusu işaretlenmeyen kişi yayınlanmaz.<\/p>\n    <div class=\"adders\"><button type=\"button\" class=\"btn\" id=\"teamAdd\">+ Kişi ekle<\/button><\/div>\n    <ul class=\"items\" id=\"teamList\"><\/ul>\n  <\/section>\n\n  <!-- KURUMLAR -->\n  <section data-pane=\"partners\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Anlaşmalı kurumlar<\/h2><span class=\"count\" id=\"partnerCount\">0<\/span><\/div>\n    <div class=\"banner warn\">Kurumun adını, logosunu ve bilgilerini yalnızca kurumun <b>yazılı tanıtım izni<\/b> varsa yayınlayın. Sadece kurumun onayladığı bilgileri girin; başarı oranı, sıralama veya \"en iyi\" gibi ifadeler kullanmayın.<\/div>\n    <div class=\"adders\"><button type=\"button\" class=\"btn\" id=\"partnerAdd\">+ Kurum ekle<\/button><\/div>\n    <ul class=\"items\" id=\"partnerList\"><\/ul>\n  <\/section>\n\n  <!-- YORUMLAR -->\n  <section data-pane=\"reviews\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Hasta ve yakınlarının yorumları<\/h2><span class=\"count\" id=\"reviewCount\">0<\/span><\/div>\n    <div class=\"banner warn\"><b>Yayınlamadan önce:<\/b> Her yorum için kişiden <b>yazılı açık rıza<\/b> alın; rıza kutusu işaretlenmeyen yorum yayınlanmaz. Tedavi sonucu, iyileşme, başarı oranı, ilaç adı veya \"en iyi\" gibi ifadeler içeren yorumları eklemeyin; Türkiye'de sağlık tanıtım kuralları bunları sınırlar. Ad yerine baş harfleri kullanın. Hukukçunuzun onayını alın.<\/div>\n    <div class=\"adders\"><button type=\"button\" class=\"btn\" id=\"reviewAdd\">+ Yorum ekle<\/button><\/div>\n    <ul class=\"items\" id=\"reviewList\"><\/ul>\n  <\/section>\n\n  <!-- SOSYAL MEDYA -->\n  <!-- OFİSLER / ŞUBELER -->\n  <section data-pane=\"branches\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Ülke ofisleri ve şubeler<\/h2><span class=\"count\" id=\"branchCount\">0<\/span><\/div>\n    <p class=\"muted\">Ankara merkez ofisiniz, <b>Ayarlar<\/b> sekmesindeki adres, telefon ve saatlerle otomatik gösterilir. Buraya başka ülke veya şehirlerdeki şube, temsilcilik ve irtibat noktalarınızı ekleyin. En az bir ofis eklediğinizde sitede <b>İletişim → Ülkelerdeki ofislerimiz<\/b> bölümü açılır; her ofis WhatsApp ve harita düğmeli bir kart olarak görünür. Ülke seçince ülke adı dört dile otomatik çevrilir.<\/p>\n    <div class=\"banner warn\">Yalnızca gerçekten çalışan ve adresi doğrulanmış ofisleri ekleyin. Yurt dışındaki ofis veya temsilcilik o ülkenin mevzuatına (şirket kaydı, sağlık tanıtımı kuralları) tabidir; temsilcinin sizin adınıza hasta kabul etme yetkisini sözleşmeyle netleştirin. Telefonları ülke koduyla yazın (ör. +964 …). Bir ofisi geçici olarak gizlemek için \"Sitede göster\" işaretini kaldırın.<\/div>\n    <div class=\"adders\"><button type=\"button\" class=\"btn\" id=\"branchAdd\">+ Ofis ekle<\/button><\/div>\n    <ul class=\"items\" id=\"branchList\"><\/ul>\n  <\/section>\n\n  <section data-pane=\"social\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Sosyal medya hesapları<\/h2><span class=\"count\" id=\"socialCount\">0<\/span><\/div>\n    <p class=\"muted\">Sitede \"İletişim\" bölümünde ve sayfanın en altında simgeli düğmeler olarak görünür. Tam linki yapıştırın; WhatsApp için numara, Telegram ve Instagram için @kullanıcıadı da yazabilirsiniz. Telegram, Instagram ve Facebook hesapları hasta başvuru formunda da gönderim seçeneği olarak çıkar.<\/p>\n    <div class=\"items\" id=\"socialList\"><\/div>\n    <div class=\"adders\"><button type=\"button\" class=\"btn sec\" id=\"socialAdd\">+ Hesap ekle<\/button><\/div>\n  <\/section>\n\n  <!-- GEÇMİŞ -->\n  <section data-pane=\"history\" class=\"card\" hidden>\n    <div class=\"sec-head\"><h2>Değişiklik geçmişi<\/h2><button type=\"button\" class=\"btn sec sm\" id=\"histReload\">Yenile<\/button><\/div>\n    <p class=\"muted\">Sitede yapılan son yayınlar. Bir sürüme döndüğünüzde ayarlar, metinler, görseller ve listeler o andaki haline getirilir ve yeni bir yayın olarak kaydedilir.<\/p>\n    <ul class=\"hist\" id=\"histList\"><li class=\"empty\">Geçmişi görmek için GitHub bağlantısı gerekir.<\/li><\/ul>\n  <\/section>\n\n  <!-- BAĞLANTI -->\n  <section data-pane=\"connect\" class=\"card\" hidden>\n    <h2>GitHub bağlantısı<\/h2>\n    <p class=\"muted\">Değişiklikleri yayınlamak için GitHub erişim anahtarı gerekir. Evodak Prompt Asistanı ana panelinde Ayarlar'dan bağlandıysanız aynı anahtar burada otomatik kullanılır.<\/p>\n    <label class=\"f\" for=\"tok\">Erişim anahtarı (token)<input type=\"password\" id=\"tok\" autocomplete=\"off\" placeholder=\"github_pat_…\"><\/label>\n    <div class=\"adders\"><button type=\"button\" class=\"btn\" id=\"tokSave\">Bağlan<\/button><button type=\"button\" class=\"btn danger\" id=\"tokClear\">Bu cihazdan sil<\/button><\/div>\n    <ol class=\"help\">\n      <li>github.com → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens<\/b> → Generate new token.<\/li>\n      <li>Repository access: yalnızca <code>Evodak-Prompt-Asistan-<\/code>. Permissions → Contents: <b>Read and write<\/b>.<\/li>\n      <li>Oluşan anahtarı buraya yapıştırıp Bağlan'a basın. Anahtar yalnızca bu tarayıcıda saklanır ve yalnızca GitHub'a gönderilir.<\/li>\n    <\/ol>\n  <\/section>\n<\/main>\n\n<div class=\"savebar\" role=\"region\" aria-label=\"Kaydet ve yayınla\">\n  <span class=\"muted\" id=\"dirtyText\" aria-live=\"polite\">Değişiklik yok<\/span>\n  <div class=\"prog\" id=\"prog\" hidden><i id=\"progFill\"><\/i><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    <button type=\"button\" class=\"btn sec\" id=\"undo\" disabled>Değişiklikleri geri al<\/button>\n    <button type=\"button\" class=\"btn\" id=\"save\" disabled>Kaydet ve yayınla<\/button>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n\n<script>\nconst REPO = {owner:\"evodakkonaklama-glitch\", repo:\"Evodak-Prompt-Asistan-\", b  const g = GROUPS[p.split(\".\")[0]] || \"Diğer\";\n    (groups[g] = groups[g] || []).push([p,def,cur]);\n  });\n  const names = Object.keys(groups);\n  if (!names.length){ box.innerHTML = '<p class=\"empty\">Aramayla eşleşen metin yok.<\/p>'; return; }\n  box.innerHTML = names.map(g=>`<details class=\"tgroup\" data-g=\"${esc(g)}\"${q||open.has(g)?\" open\":\"\"}><summary>${esc(g)} <span class=\"count\">${groups[g].length}<\/span><\/summary><div class=\"rows\">${\n    groups[g].map(([p,def,cur])=>{ const ch = over[p]!=null && over[p].trim() && over[p]!==def; const long = def.length>90;\n      return `<div class=\"trow\" data-p=\"${esc(p)}\"><div class=\"lbl\">${esc(prettyLabel(p))}${ch?'<span class=\"chg\">değiştirildi<\/span><button type=\"button\" class=\"reset\">Varsayılana dön<\/button>':''}<\/div>\n        ${long?`<textarea${L===\"ar\"?' dir=\"rtl\"':''} rows=\"3\">${esc(cur)}<\/textarea>`:`<input type=\"text\" value=\"${esc(cur)}\"${L===\"ar\"?' dir=\"rtl\"':''}>`}<\/div>`; }).join(\"\")\n  }<\/div><\/details>`).join(\"\");\n  box.querySelectorAll(\".trow\").forEach(row=>{\n    const p=row.dataset.p, def=getP(DEF[L], p), inp=row.querySelector(\"input,textarea\");\n    const badge=()=>{ const lbl=row.querySelector(\".lbl\"); const ch=over[p]!=null&&over[p]!==def;\n      lbl.querySelectorAll(\".chg,.reset\").forEach(x=>x.remove());\n      if(ch){ lbl.insertAdjacentHTML(\"beforeend\",'<span class=\"chg\">değiştirildi<\/span><button type=\"button\" class=\"reset\">Varsayılana dön<\/button>');\n        lbl.querySelector(\".reset\").onclick=()=>{ delete over[p]; inp.value=def; badge(); refreshBar(); }; } };\n    inp.addEventListener(\"input\",()=>{ const v=inp.value; if(!v.trim()||v===def) delete over[p]; else over[p]=v; badge(); refreshBar(); });\n    badge();\n  });\n}\n$(\"#tLang\").addEventListener(\"change\", renderTexts);\n$(\"#tSearch\").addEventListener(\"input\", ()=>{ clearTimeout(renderTexts.t); renderTexts.t=setTimeout(renderTexts,200); });\n\n/* ---- ek pe===\"checkbox\") renderTeam(); refreshBar(); }));\n    li.querySelectorAll(\"[data-role]\").forEach(inp=>inp.addEventListener(\"input\",()=>{ m.role[inp.dataset.role]=inp.value; refreshBar(); }));\n    li.querySelector(\"[data-photo]\").addEventListener(\"change\", async e=>{ const f=e.target.files[0]; if(!f) return; try{ dropPending(m.photo); m.photo=await upload(f,900); m.consent=false; renderTeam(); refreshBar(); toast(\"Fotoğraf eklendi. Fotoğraf için de izin alındığını işaretleyin.\",4000); }catch(err){ toast(err.message,4000); } });\n    const np=li.querySelector('[data-act=\"nophoto\"]'); if(np) np.onclick=()=>{ dropPending(m.photo); m.photo=\"\"; renderTeam(); refreshBar(); };\n    moveDel(li, state.team, m, ()=>dropPending(m.photo), ()=>renderTeam());\n  });\n}\n/* ---- kurumlar ---- */\nfunction renderPartners(mark){\n  const ul=$(\"#partnerList\");\n  ul.innerHTML = state.partners.length ? state.partners.map(p=>`<li class=\"item${mark&&p.name.trim()&&!p.consent?\" bad\":\"\"}\" data-id=\"${p.id}\">\n    <div class=\"thumb contain\">${p.logo?`<img src=\"${esc(preview(p.logo))}\" alt=\"\">`:'Logo yok'}${pending.has(p.logo)?'<span class=\"badge new\">Yeni<\/span>':''}<\/div>\n    <div class=\"fields\">\n      <div class=\"g3\"><label class=\"f\">Kurum adı<input type=\"text\" data-k=\"name\" value=\"${esc(p.name)}\"><\/label>\n        <label class=\"f\">Türü<input type=\"text\" data-k=\"type\" value=\"${esc(p.type)}\" placeholder=\"ör. Özel hastane\"><\/label>\n        <label class=\"f\">İlçe<input type=\"text\" data-k=\"district\" value=\"${esc(p.district)}\" placeholder=\"ör. Çankaya\"><\/label><\/div>\n      <div class=\"g2\"><label class=\"f\">Akreditasyonlar (virgülle)<input type=\"text\" data-k=\"accreditation\" value=\"${esc(p.accreditation)}\" placeholder=\"ör. JCI\"><\/label>\n        <label class=\"f\">Kurumun web sitesi<input type=\"url\" data-k=\"url\" value=\"${esc(p.url)}\" placeholder=\"https://…\"><\/label><\/div>\n      <details class=\"more\"${(p.branches.tr||\"\")?\"\":\" open\"}><summary>Bölümler / branşlar (4 dil)<\/summary><div class=\"grid\">${LANGS.map(([l,n])=>`<label class=\"f\">${n}<input type=\"text\" data-br=\"${l}\" value=\"${esc(p.branches[l]||\"\")}\"${l===\"ar\"?' dir=\"rtl\"':''}><\/label>`).join(\"\")}<\/div><\/details>\n      <label class=\"chk\"><input type=\"checkbox\" data-k=\"consent\"${p.consent?\" checked\":\"\"}> Kurumdan adının${p.logo?\", logosunun\":\"\"} ve bu bilgilerin sitede yayımlanması için yazılı izin alındı.<\/label>\n      <div class=\"acts\"><label class=\"btn sec sm\" for=\"pl-${p.id}\">${p.logo?\"Logoyu değiştir\":\"+ Logo ekle\"}<\/label><input id=\"pl-${p.id}\" type=\"file\" accept=\"image/*\" hidden data-photo>\n        ${p.logo?'<button type=\"button\" class=\"btn danger sm\" data-act=\"nophoto\">Logoyu kaldır<\/button>':''}${MV}<button type=\"button\" class=\"btn danger sm\" data-act=\"del\">Kurumu sil<\/button><\/div>\n    <\/div><\/li>`).join(\"\") : '<li class=\"empty\">Henüz kurum eklenmedi.<\/li>';\n  ul.querySelectorAll(\".item\").forEach(li=>{\n    const p=state.partners.find(x=>x.id===li.dataset.id);\n    li.querySelectorAll(\"[data-k]\").forEach(inp=>inp.addEventListener(inp.type===\"checkbox\"?\"change\":\"input\",()=>{ p[inp.dataset.k]=inp.type===\"checkbox\"?inp.checked:inp.value; if(inp.type===\"checkbox\") renderPartners(); refreshBar(); }));\n    li.querySelectorAll(\"[data-br]\").forEach(inp=>inp.addEventListener(\"input\",()=>{ p.branches[inp.dataset.br]=inp.value; refreshBar(); }));\n    li.querySelector(\"[data-photo]\").addEventListener(\"change\", async e=>{ const f=e.target.files[0]; if(!f) return; try{ dropPending(p.logo); p.logo=await upload(f,600); p.consent=false; renderPartners(); refreshBar(); toast(\"Logo eklendi. Logo için de izin alındığını işaretleyin.\",4000); }catch(err){ toast(err.message,4000); } });\n    const np=li.querySelector('[data-act=\"nophoto\"]'); if(np) np.onclick=()=>{ dropPending(p.logo); p.logo=\"\"; renderPartners(); refreshBar(); };\n    moveDel(li, state.partners, p, ()=>dropPending(p.logo), ()=>renderPartners());\n  });\n}\n/* ---- ofisler / şubeler ---- */\nconst COUNTRY_CODES = [\"IQ\",\"SA\",\"AE\",\"KW\",\"QA\",\"BH\",\"OM\",\"YE\",\"JO\",\"LB\",\"SY\",\"PS\",\"EG\",\"LY\",\"SD\",\"DZ\",\"TN\",\"MA\",\"IR\",\"AF\",\"PK\",\"AZ\",\"GE\",\"AM\",\"KZ\",\"UZ\",\"TM\",\"KG\",\"TJ\",\"RU\",\"UA\",\"BY\",\"MD\",\"DE\",\"NL\",\"BE\",\"FR\",\"AT\",\"CH\",\"GB\",\"SE\",\"DK\",\"NO\",\"IT\",\"ES\",\"BG\",\"RO\",\"GR\",\"CY\",\"US\",\"CA\",\"AU\",\"SO\",\"ET\",\"NG\",\"TR\"];\nconst BR_KINDS = [[\"branch\",\"Şube\"],[\"rep\",\"Temsilcilik\"],[\"liaison\",\"İrtibat noktası\"]];\nfunction regionName(code, l){ try{ return new Intl.DisplayNames([l],{type:\"region\"}).of(code)||\"\"; }catch(e){ return \"\"; } }\nconst COUNTRY_OPTS = COUNTRY_CODES.map(c=>[c, regionName(c,\"tr\")||c]).sort((a,b)=>a[1].localeCompare(b[1],\"tr\"));\nfunction newBranch(){ return {code:\"\", kind:\"branch\", country:{}, city:{}, address:\"\", phone:\"\", whatsapp:\"\", email:\"\", hours:\"\", languages:\"\", map:\"\", active:true}; }\nfunction renderBranches(){\n  const ul=$(\"#branchList\");\n  ul.innerHTML = state.branches.length ? state.branches.map(b=>`<li class=\"item solo${b.active?\"\":\" off\"}\" data-id=\"${b.id}\">\n    <div class=\"fields\">\n      <div class=\"g3\"><label class=\"f\">Ülke<select data-k=\"code\"><option value=\"\">Seçin…<\/option>${COUNTRY_OPTS.map(([c,n])=>`<option value=\"${c}\"${c===b.code?\" selected\":\"\"}>${esc(n)}<\/option>`).join(\"\")}<\/select><\/label>\n        <label class=\"f\">Ofis türü<select data-k=\"kind\">${BR_KINDS.map(([v,n])=>`<option value=\"${v}\"${v===b.kind?\" selected\":\"\"}>${n}<\/option>`).join(\"\")}<\/select><\/label>\n        <label class=\"f\">Şehir<input type=\"text\" data-city=\"tr\" value=\"${esc(b.city.tr||\"\")}\" placeholder=\"ör. Bağdat\"><\/label><\/div>\n      <label class=\"f\">Açık adres<input type=\"text\" data-k=\"address\" va lass=\"empty\">Henüz ofis eklenmedi. Sitede yalnızca Ankara merkez ofisiniz görünüyor.<\/li>';\n  ul.querySelectorAll(\".item\").forEach(li=>{\n    const b=state.branches.find(x=>x.id===li.dataset.id);\n    li.querySelectorAll(\"[data-k]\").forEach(inp=>inp.addEventListener(inp.type===\"checkbox\"||inp.tagName===\"SELECT\"?\"change\":\"input\",()=>{\n      b[inp.dataset.k]=inp.type===\"checkbox\"?inp.checked:inp.value;\n      if(inp.dataset.k===\"code\" && b.code){ LANGS.forEach(([l])=>{ const n=regionName(b.code,l); if(n) b.country[l]=n; }); renderBranches(); }\n      else if(inp.type===\"checkbox\") renderBranches();\n      refreshBar(); }));\n    li.querySelectorAll(\"[data-cn]\").forEach(inp=>inp.addEventListener(\"input\",()=>{ b.country[inp.dataset.cn]=inp.value; refreshBar(); }));\n    li.querySelectorAll(\"[data-city]\").forEach(inp=>inp.addEventListener(\"input\",()=>{ b.city[inp.dataset.city]=inp.value;\n      if(inp.dataset.city===\"tr\") li.querySelectorAll('[data-city=\"tr\"]').forEach(o=>{ if(o!==inp) o.value=inp.value; }); refreshBar(); }));\n    moveDel(li, state.branches, b, null, ()=>renderBranches());\n  });\n}\n/* ---- yorumlar ---- */\nfunction renderReviews(mark){\n  const ul=$(\"#reviewList\");\n  ul.innerHTML = state.reviews.length ? state.reviews.map(r=>`<li class=\"item${mark&&r.text.trim()&&!r.consent?\" bad\":\"\"}\" data-id=\"${r.id}\">\n    <div class=\"thumb\">${r.photo?`<img src=\"${esc(preview(r.photo))}\" alt=\"\">`:'Fotoğraf yok'}${pending.has(r.photo)?'<span class=\"badge new\">Yeni<\/span>':''}<\/div>\n    <div class=\"fields\">\n      <div class=\"g3\"><label class=\"f\">Ad (baş harfler önerilir)<input type=\"text\" data-k=\"name\" value=\"${esc(r.name)}\" placeholder=\"ör. A. K.\"><\/label>\n        <label class=\"f\">Ülke<input type=\"text\" data-k=\"country\" value=\"${esc(r.country)}\" placeholder=\"ör. Irak\"><\/label>\n        <label class=\"f\">Tarih<input type=\"text\" data-k=\"date\" value=\"${esc(r.date)}\" placeholder=\"ör. Eylül 2026\"><\/label><\/div>\n      <label class=\"f\">Yorumun yazıldığı dil<select data-k=\"lang\">${LANGS.map(([v,l])=>`<option value=\"${v}\"${v===r.lang?\" selected\":\"\"}>${l}<\/option>`).join(\"\")}<\/select><\/label>\n      <label class=\"f\">Yorum (kişinin kendi ifadesiyle)<textarea data-k=\"text\"${r.lang===\"ar\"?' dir=\"rtl\"':''}>${esc(r.text)}<\/textarea><\/label>\n      <details class=\"more\"><summary>Çeviriler (isteğe bağlı)<\/summary><div class=\"grid\">${LANGS.filter(([v])=>v!==r.lang).map(([v,l])=>`<label class=\"f\">${l}<textarea data-tr=\"${v}\"${v===\"ar\"?' dir=\"rtl\"':''}>${esc(r.tr[v]||\"\")}<\/textarea><\/label>`).join(\"\")}<\/div><\/details>\n      <label class=\"chk\"><input type=\"checkbox\" data-k=\"consent\"${r.consent?\" checked\":\"\"}> Bu kişiden yorumunun${r.photo?\" ve fotoğrafının\":\"\"} sitede yayımlanması için yazılı açık rıza alındı.<\/label>\n      <div class=\"acts\"><label class=\"btn sec sm\" for=\"rp-${r.id}\">${r.photo?\"Fotoğrafı değiştir\":\"+ Fotoğraf ekle\"}<\/label><input id=\"rp-${r.id}\" type=\"file\" accept=\"image/*\" hidden data-photo>\n        ${r.photo?'<button type=\"button\" class=\"btn danger sm\" data-act=\"nophoto\">Fotoğrafı kaldır<\/button>':''}${MV}<button type=\"button\" class=\"btn danger sm\" data-act=\"del\">Yorumu sil<\/button><\/div>\n    <\/div><\/li>`).join(\"\") : '<li class=\"empty\">Henüz yorum eklenmedi.<\/li>';\n  ul.querySelectorAll(\".item\").forEach(li=>{\n    const r=state.reviews.find(x=>x.id===li.dataset.id);\n    li.querySelectorAll(\"[data-k]\").forEach(inp=>inp.addEventListener(inp.type===\"checkbox\"||inp.tagName===\"SELECT\"?\"change\":\"input\",()=>{ r[inp.dataset.k]=inp.type===\"checkbox\"?inp.checked:inp.value; if(inp.type===\"checkbox\"||inp.tagName===\"SELECT\") renderReviews(); refreshBar(); }));\n    li.querySelectorAll(\"[data-tr]\").forEach(inp=>inp.addEventListener(\"input\",()=>{ r.tr[inp.dataset.tr]=inp.value; refreshBar(); }));\n    li.querySelector(\"[data-photo]\").addEventListener(\"change\", async e=>{ const f=e.target.files[0]; if(!f) return; try{ dropPending(r.photo); r.photo=await upload(f,1200); r.consent=false; renderReviews(); refreshBar(); toast(\"Fotoğraf eklendi. Fotoğraf için de rıza alındığını işaretleyin.\",4000); }catch(err){ toast(err.message,4000); } });\n    const np=li.querySelector('[data-act=\"nophoto\"]'); if(np) np.onclick=()=>{ dropPending(r.photo); r.photo=\"\"; renderReviews(); refreshBar(); };\n    moveDel(li, state.reviews, r, ()=>dropPending(r.photo), ()=>renderReviews());\n  });\n}\n/* ---- sosyal ---- */\nfunction renderSocial(){\n  const box=$(\"#socialList\");\n  box.innerHTML = state.social.length ? state.social.map(s=>`<div class=\"srow\" data-id=\"${s.id}\">\n      <select data-k=\"platform\" aria-label=\"Platform\">${PLATFORMS.map(([v,l])=>`<option value=\"${v}\"${v===s.platform?\" selected\":\"\"}>${l}<\/option>`).join(\"\")}<\/select>\n      <input class=\"u\" type=\"text\" data-k=\"url\" value=\"${esc(s.url)}\" placeholder=\"https://… veya @kullanıcıadı\" aria-label=\"Link\">\n      <input type=\"text\" data-k=\"label\" value=\"${esc(s.label)}\" placeholder=\"Görünen ad (isteğe bağlı)\" aria-label=\"Görünen ad\">\n      <div class=\"acts\">${MV}<button type=\"button\" class=\"btn danger sm\" data-act=\"del\">Sil<\/button><\/div><\/div>`).join(\"\") : '<div class=\"empty\">Henüz hesap eklenmedi.<\/div>';\n  box.querySelectorAll(\".srow\").forEach(row=>{\n    const s=state.social.find(x=>x.id===row.dataset.id);\n    row.querySelectorAll(\"[data-k]\").forEach(inp=>inp.addEventListener(inp.tagName===\"SELECT\"?\"change\":\"input\",()=>{ s[inp.dataset.k]=inp.value; refreshBar(); }));\n    moveDel(row, state.social, s, null, renderSocial);\n  });\n}\nfunction curSection(){ return $(\"#secSel\").value; }\nfunction renderAll(){\n  bindSettings();\n  bindMedia($(\"#sliderList\"), state.slider);\n  const k=curSection(); $(\"#secHint\").textContent=(SECTIONS.find(s=>s[0]===k)||[])[2]||\"\";\n  bindMedia($(\"#secList\"), state.sections[k]);\n  [...$(\"#secSel\").options].forEach(o=>{ const n=state.sections[o.value].length; o.textContent=SECTIONS.find(s=>s[0]===o.value)[1]+(n?` (${n})`:\"\"); });\n  renderTeam(); renderPartners(); renderBranches(); renderReviews(); renderSocial(); renderTexts(); refreshBar();\n}\n\n/* ---- yayınlama ---- */\nconst refsOf = o => [...o.slider, ...Object.values(o.sections).flat()].map(i=>i.src)\n  .concat(o.reviews.map(r=>r.photo), o.team.map(m=>m.photo), o.partners.map(p=>p.logo)).filter(Boolean);\nasync function commitTree(entries, message){\n  for (let attempt=0; attempt<3; attempt++){\n    const head = (await gh(base()+\"/git/ref/heads/\"+REPO.branch)).object.sha;\n    const commit = await gh(base()+\"/git/commits/\"+head);\n    const tree = await gh(base()+\"/git/trees\", {method:\"POST\", body:{base_tree:commit.tree.sha, tree:entries}});\n    const nc = await gh(base()+\"/git/commits\", {method:\"POST\", body:{message, tree:tree.sha, parents:[head]}});\n    try{ await gh(base()+\"/git/refs/heads/\"+REPO.branch, {method:\"PATCH\", body:{sha:nc.sha}}); return nc.sha; }\n    catch(e){ if(e.status!==422 || attempt===2) throw e; }\n  }\n}\nfunction consentCheck(){\n  const bad = [];\n  if (state.reviews.some(r=>r.text.trim()&&!r.consent)) bad.push([\"reviews\",\"yorum\",()=>renderReviews(true)]);\n  if (state.team.some(m=>m.name.trim()&&!m.consent)) bad.push([\"team\",\"ekip üyesi\",()=>renderTeam(true)]);\n  if (state.partners.some(p=>p.name.trim()&&!p.consent)) bad.push([\"partners\",\"kurum\",()=>renderPartners(true)]);\n  if (!bad.length) return null;\n  document.querySelector(`[data-tab=\"${bad[0][0]}\"]`).click(); bad.forEach(b=>b[2]());\n  return \"İzin kutusu işaretli olmayan \" + bad.map(b=>b[1]).join(\", \") + \" var. İzni alıp kutuyu işaretleyin ya da kaydı silin.\";\n}\nasync function publish(){\n  if (!canPush){ toast(\"Yayınlamak için GitHub bağlantısı gerekli\"); return; }\n  const c = consentCheck(); if (c){ toast(c, 6000); setStatus(\"err\",\"Yayınlanmadı\", c); return; }\n  const btn=$(\"#save\"), prog=$(\"#prog\"), fill=$(\"#progFill\");\n  btn.disabled=true; $(\"#undo\").disabled=true; prog.hidden=false; fill.style.width=\"5%\";\n  try{\n    const out = clean(state);\n    const used = new Set(refsOf(out));\n    const files = [...pending.entries()].filter(([p])=>used.has(p));\n    const blobs=[]; let done=0;\n    for (const [p,f] of files){\n      const b = await gh(base()+\"/git/blobs\", {method:\"POST\", body:{content:await blobToB64(f.blob), encoding:\"base64\"}});\n      blobs.push({path:\"site/\"+p, mode:\"100644\", type:\"blob\", sha:b.sha}); done++; fill.style.width=(5+75*done/Math.max(1,files.length))+\"%\";\n    }\n    const jb = await gh(base()+\"/git/blobs\", {method:\"POST\", body:{content:JSON.stringify(out,null,1)+\"\\n\", encoding:\"utf-8\"}});\n    const removed = [...new Set(refsOf(clean(saved)).filter(p=>UPLOAD_PREFIXES.some(x=>p.startsWith(x))))].filter(p=>!used.has(p)).map(p=>({path:\"site/\"+p, mode:\"100644\", type:\"blob\", sha:null}));\n    const msg = \"site: panelden güncellendi\" + (files.length?` · ${files.length} yeni dosya`:\"\") + (removed.length?` · ${removed.length} dosya kaldırıldı`:\"\");\n    await commitTree([...blobs, {path:JSON_PATH, mode:\"100644\", type:\"blob\", sha:jb.sha}, ...removed], msg);\n    fill.style.width=\"100%\";\n    pending.forEach(p=>URL.revokeObjectURL(p.url)); pending.clear();\n    saved = normalize(out); state = normalize(out); renderAll();\n    toast(\"Yayınlandı. Site 1–2 dakika içinde güncellenir.\", 5000);\n    setStatus(\"ok\", \"Yayınlandı · \" + new Date().toLocaleTimeString(\"tr-TR\",{hour:\"2-digit\",minute:\"2-digit\"}), \"\");\n    histLoaded = false;\n  }catch(e){\n    toast(\"Yayınlanamadı: \" + e.message, 6000);\n    setStatus(\"err\",\"Yayınlama hatası\",\"Yayınlanamadı: \" + e.message + \". Değişiklikleriniz bu sayfada duruyor; tekrar deneyebilirsiniz.\");\n    refreshBar();\n  }finally{ prog.hidden=true; fill.style.width=\"0\"; }\n}\n\n/* ---- geçmiş ---- */\nlet histLoaded=false;\nasync function loadHistory(){\n  const ul=$(\"#histList\");\n  if (!token()){ ul.innerHTML='<li class=\"empty\">Geçmişi görmek için GitHub bağlantısı gerekir.<\/li>'; return; }\n  ul.innerHTML='<li class=\"empty\">Yükleniyor…<\/li>';\n  try{\n    const list = await gh(base()+\"/commits?path=\"+encodeURIComponent(JSON_PATH)+\"&per_page=20&sha=\"+REPO.branch);\n    histLoaded = true;\n    if (!list.length){ ul.innerHTML='<li class=\"empty\">Henüz yayın yok.<\/li>'; return; }\n    ul.innerHTML = list.map((c,i)=>`<li data-sha=\"${c.sha}\"><div class=\"m\"><b>${esc(c.commit.message.split(\"\\n\")[0])}<\/b><span>${new Date(c.commit.author.date).toLocaleString(\"tr-TR\")} · ${esc((c.author&&c.author.login)||c.commit.author.name)}${i===0?\" · şu anki sürüm\":\"\"}<\/span><\/div>\n      ${i===0?\"\":'<div class=\"acts\"><button type=\"button\" class=\"btn sec sm\" data-restore>Bu sürüme dön<\/button><button type=\"button\" class=\"btn sm\" data-confirm hidden>Evet, bu sürüme dön<\/button><\/div>'}<\/li>`).join(\"\");\n    ul.querySelectorAll(\"[data-restore]\").forEach(b=>b.onclick=()=>{ b.hidden=true; const y=b.nextElementSibling; y.hidden=false; setTimeout(()=>{ y.hidden=true; b.hidden=false; },6000); });\n    ul.querySelectorAll(\"[data-confirm]\").forEach(b=>b.onclick=()=>restore(b.closest(\"li\").dataset.sha));\n  }catch(e){ ul.innerHTML='<li class=\"empty\">Geçmiş yüklenemedi: '+esc(e.message)+'<\/li>'; }\n}\nasync function restore(sha){\n  if (dirty()){ toast(\"Önce kaydedilmemiş değişiklikleri yayınlayın veya geri alın.\", 4500); return; }\n  if (!canPush){ toast(\"Geri dönmek için GitHub bağlantısı gerekli\"); return; }\n  try{\n    setStatus(\"\", \"Geri alınıyor…\");\n    const f = await gh(base()+\"/contents/\"+JSON_PATH+\"?ref=\"+sha);\n    const old = JSON.parse(b64ToUtf8(f.content));\n    const commit = await gh(base()+\"/git/commits/\"+sha);\n    const tree = await gh(base()+\"/git/trees/\"+commit.tree.sha+\"?recursive=1\");\n    const shaOf = {}; tree.tree.forEach(t=>{ shaOf[t.path]=t.sha; });\n    const refs = refsOf(normalize(old)).filter(p=>!/^https?:/.test(p));\n    const restoreFiles = refs.filter(p=>shaOf[\"site/\"+p]).map(p=>({path:\"site/\"+p, mode:\"100644\", type:\"blob\", sha:shaOf[\"site/\"+p]}));\n    const jb = await gh(base()+\"/git/blobs\", {method:\"POST\", body:{content:JSON.stringify(Object.assign(old,{updated:new Date().toISOString()}),null,1)+\"\\n\", encoding:\"utf-8\"}});\n    await commitTree([...restoreFiles, {path:JSON_PATH, mode:\"100644\", type:\"blob\", sha:jb.sha}], \"site: \" + sha.slice(0,7) + \" sürümüne geri dönüldü (panel)\");\n    toast(\"Eski sürüme dönüldü. Site 1–2 dakika içinde güncellenir.\", 5000);\n    await load(); loadHistory();\n  }catch(e){ toast(\"Geri dönülemedi: \" + e.message, 6000); setStatus(\"err\",\"Geri alma hatası\",\"Geri dönülemedi: \" + e.message); }\n}\n\n/* ---- olaylar ---- */\ndocument.querySelectorAll(\".tabs button\").forEach(b=>b.addEventListener(\"click\",()=>{\n  document.querySelectorAll(\".tabs button\").forEach(x=>x.setAttribute(\"aria-selected\", x===b));\n  document.querySelectorAll(\"[data-pane]\").forEach(p=>p.hidden = p.dataset.pane!==b.dataset.tab);\n  if (b.dataset.tab===\"history\" && !histLoaded) loadHistory();\n}));\n$(\"#secSel\").innerHTML = SECTIONS.map(([k,l])=>`<option value=\"${k}\">${esc(l)}<\/option>`).join(\"\");\n$(\"#secSel\").addEventListener(\"change\", renderAll);\n$(\"#sliderFile\").addEventListener(\"change\", e=>{ addImages([...e.target.files], state.slider, 2000); e.target.value=\"\"; });\n$(\"#secImg\").addEventListener(\"change\", e=>{ addImages([...e.target.files], state.sections[curSection()], 1600); e.target.value=\"\"; });\n$(\"#secVid\").addEventListener(\"change\", e=>{ addVideo(e.target.files[0], state.sections[curSection()]); e.target.value=\"\"; });\n$(\"#ytAdd\").addEventListener(\"click\", ()=>{ const id=ytId($(\"#ytUrl\").value.trim()); if(!id){ toast(\"Geçerli bir YouTube linki girin\"); return; }\n  state.sections[curSection()].push({id:uid(), type:\"youtube\", src:\"https://youtu.be/\"+id, caption:{}}); $(\"#ytUrl\").value=\"\"; renderAll(); });\n$(\"#teamAdd\").addEventListener(\"click\", ()=>{ state.team.push({id:uid(), name:\"\", role:{}, languages:\"\", photo:\"\", consent:false}); renderTeam(); refreshBar(); $(\"#teamList .item:last-child [data-k=name]\").focus(); });\n$(\"#partnerAdd\").addEventListener(\"click\", ()=>{ state.partners.push({id:uid(), name:\"\", type:\"\", district:\"\", branches:{}, accreditation:\"\", url:\"\", logo:\"\", consent:false}); renderPartners(); refreshBar(); $(\"#partnerList .item:last-child [data-k=name]\").focus(); });\n$(\"#reviewAdd\").addEventListener(\"click\", ()=>{ state.reviews.push({id:uid(), name:\"\", country:\"\", date:\"\", lang:\"tr\", text:\"\", tr:{}, photo:\"\", consent:false}); renderReviews(); refreshBar(); $(\"#reviewList .item:last-child [data-k=name]\").focus(); });\n$(\"#branchAdd\").addEventListener(\"click\", ()=>{ state.branches.push(Object.assign(newBranch(),{id:uid()})); renderBranches(); refreshBar(); $(\"#branchList .item:last-child [data-k=code]\").focus(); });\n$(\"#socialAdd\").addEventListener(\"click\", ()=>{ state.social.push({id:uid(), platform:\"instagram\", url:\"\", label:\"\"}); renderSocial(); refreshBar(); const r=$(\"#socialList .srow:last-child .u\"); if(r) r.focus(); });\n$(\"#save\").addEventListener(\"click\", publish);\n$(\"#undo\").addEventListener(\"click\", ()=>{ pending.forEach(p=>URL.revokeObjectURL(p.url)); pending.clear(); state = normalize(clean(saved)); renderAll(); toast(\"Değişiklikler geri alındı\"); });\n$(\"#histReload\").addEventListener(\"click\", loadHistory);\n$(\"#tokSave\").addEventListener(\"click\", async ()=>{ const v=$(\"#tok\").value.trim(); if(!v){ toast(\"Anahtarı yapıştırın\"); return; } setToken(v); $(\"#tok\").value=\"\";\n  if (dirty()){ const keep=state, keepP=new Map(pending); await load(); state=keep; keepP.forEach((x,k)=>pending.set(k,x)); renderAll(); toast(\"Bağlanıldı; düzenlemeleriniz korunuyor\"); } else load(); });\n$(\"#tokClear\").addEventListener(\"click\", ()=>{ setToken(\"\"); canPush=false; setStatus(\"ro\",\"Salt okunur\",\"Anahtar bu cihazdan silindi.\"); refreshBar(); });\n$(\"#siteLink\").href = SITE;\nload();\n<\/script>\n<\/body>\n<\/html>\n";
const LANGS = ["tr","en","ar","ru"];

/* Bağlantı biçimleri:
   #basvuru, #basvuru-ar, #basvuru-ru, #basvuru-en  -> yalnızca hasta formu (iç panel gizli)
   #ar, #ru, #en, #tr (eski linkler)                 -> aynısı
   #panel veya boş                                   -> tam panel, sekmeli                     */
function route(){
  const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  let m = h.match(/^basvuru(?:-(tr|en|ar|ru))?$/);
  if (!m && LANGS.includes(h)) m = [h, h];
  if (m) return { patient:true, lang: m[1] || "" };
  return { patient:false, view: h === "basvuru-tab" ? "basvuru" : (h === "site-yonetimi" ? "site" : "panel") };
}
let loadedLang = null;
function load(id){
  const f = document.getElementById("v-" + id);
  if (id === "panel" && !f.dataset.ok){ f.srcdoc = SRC_PANEL; f.dataset.ok = "1"; }
  if (id === "site" && !f.dataset.ok){ f.srcdoc = SRC_SITE; f.dataset.ok = "1"; }
  if (id === "basvuru"){
    const r = route(), lang = r.lang || "";
    if (!f.dataset.ok || (r.patient && lang && lang !== loadedLang)){
      f.srcdoc = (lang ? "<script>window.__LANG=" + JSON.stringify(lang) + "<\/script>" : "") + SRC_HASTA;
      f.dataset.ok = "1"; loadedLang = lang;
    }
  }
}
function show(id){
  load(id);
  ["panel","basvuru","site"].forEach(v => {
    document.getElementById("w-" + v).hidden = v !== id;
    document.getElementById("tab-" + v).setAttribute("aria-selected", v === id);
  });
  document.title = {panel:"Ankara Sağlık Turizmi Paneli", basvuru:"Tedavi Ön Başvurusu · Ankara Sağlık Turizmi", site:"Web Sitesi Yönetimi · Ankara Sağlık Turizmi"}[id];
}
function apply(){
  const r = route();
  document.getElementById("bar").hidden = r.patient;
  show(r.patient ? "basvuru" : r.view);
}
document.getElementById("tab-panel").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); show("panel"); });
document.getElementById("tab-basvuru").addEventListener("click", () => { history.replaceState(null, "", "#basvuru-tab"); show("basvuru"); });
document.getElementById("tab-site").addEventListener("click", () => { history.replaceState(null, "", "#site-yonetimi"); show("site"); });
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const order = ["panel","basvuru","site"], cur = order.findIndex(v => document.getElementById("tab-" + v).getAttribute("aria-selected") === "true");
  const next = order[(cur + (e.key === "ArrowRight" ? 1 : order.length - 1)) % order.length];
  document.getElementById("tab-" + next).click(); document.getElementById("tab-" + next).focus();
});
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
document.getElementById("share").addEventListener("click", () => {
  const url = location.origin + location.pathname + "#basvuru";
  const ok = () => toast("Hasta linki kopyalandı");
  try { navigator.clipboard.writeText(url).then(ok, () => toast(url)); } catch(e){ toast(url); }
});
window.addEventListener("hashchange", apply);
apply();
</script>

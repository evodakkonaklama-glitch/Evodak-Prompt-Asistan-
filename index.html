<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evodak Prompt Asistanı</title>
<meta name="description" content="Evodak ekibinin prompt, komut ve AI platform kütüphanesi">
<meta name="theme-color" content="#14304A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Evodak Prompt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="evodak-build" content="202610121704">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: kurumsal üst bant + yatay bölüm menüsü; her bölüm liste + sağdan açılan kayıt paneli; telefonda tek sütun ve tam ekran panel */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --ink:#141D2B; --muted:#5A6577; --rule:#D8DEE6; --soft:#EAF1F5;
  --accent:#0C6A87; --accent-ink:#FFFFFF; --accent-soft:#E1EFF4; --navy:#14304A; --navy-ink:#E9F1F6;
  --ai:#9A6212; --ai-soft:#FBF1E1; --ok:#2E7D4F; --ok-soft:#E3F2E8; --bad:#B23A35; --bad-soft:#F8E4E2;
  --b-green:#2E7D4F; --b-blue:#2B5DB8; --b-yellow:#8A6A00; --b-orange:#B4561A; --b-grey:#6B7380;
  --code-bg:#0F1A24; --code-fg:#D9E6EE; --code-dim:#7F93A3; --code-key:#7FD0E8; --add-bg:#1D3B2A; --del-bg:#45201E;
  --shadow:0 10px 30px rgba(20,29,43,.18);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131A; --sheet:#151C26; --ink:#E5EAF0; --muted:#97A3B4; --rule:#2A3443; --soft:#1A2531;
  --accent:#4DB5D3; --accent-ink:#06202A; --accent-soft:#16303B; --navy:#0B1B2A; --navy-ink:#D8E6EF;
  --ai:#E3AC55; --ai-soft:#2E2414; --ok:#6CC08F; --ok-soft:#173023; --bad:#E57D76; --bad-soft:#3A1C1A;
  --b-green:#6CC08F; --b-blue:#86A8F0; --b-yellow:#E0C35A; --b-orange:#EE9A62; --b-grey:#9AA3B0;
  --code-bg:#0A1016; --code-fg:#D9E6EE; --code-dim:#6E8191; --code-key:#7FD0E8; --add-bg:#1D3B2A; --del-bg:#45201E;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131A; --sheet:#151C26; --ink:#E5EAF0; --muted:#97A3B4; --rule:#2A3443; --soft:#1A2531;
  --accent:#4DB5D3; --accent-ink:#06202A; --accent-soft:#16303B; --navy:#0B1B2A; --navy-ink:#D8E6EF;
  --ai:#E3AC55; --ai-soft:#2E2414; --ok:#6CC08F; --ok-soft:#173023; --bad:#E57D76; --bad-soft:#3A1C1A;
  --b-green:#6CC08F; --b-blue:#86A8F0; --b-yellow:#E0C35A; --b-orange:#EE9A62; --b-grey:#9AA3B0;
  --code-bg:#0A1016; --code-fg:#D9E6EE; --code-dim:#6E8191; --code-key:#7FD0E8; --add-bg:#1D3B2A; --del-bg:#45201E;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;padding-inline:16px;padding-block:0 90px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
select{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
code,.mono{font-family:var(--f-mono)}
a{color:var(--accent)}

/* Üst bant */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);margin-inline:-16px;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.top .row1{max-width:1360px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--f-display);font-weight:700;letter-spacing:.18em;font-size:15px;border:1.5px solid currentColor;padding:1px 7px}
.brand h1{font-size:19px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand .rev{font-family:var(--f-mono);font-size:11.5px;opacity:.75}
.gsearch{flex:1;min-width:200px;display:flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.gsearch input{flex:1;min-width:0;background:transparent;border:0;padding:7px 10px;color:var(--navy-ink)}
.gsearch input::placeholder{color:var(--navy-ink);opacity:.6}
.gsearch input:focus{outline:none}
.gsearch kbd{font-family:var(--f-mono);font-size:11px;opacity:.6;padding:0 8px}
.conn{font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;opacity:.9}
.conn i{width:8px;height:8px;border-radius:50%;background:#C9A227;display:inline-block}
.conn.ok i{background:#5FCB8C}.conn.off i{background:#E57D76}
.qadd{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--navy-ink);padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.qadd:hover{background:rgba(255,255,255,.12)}
.tbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg.lang{background:transparent;border-color:rgba(255,255,255,.35)}
.seg.lang button{color:var(--navy-ink);opacity:.75;padding:5px 10px}
.seg.lang button[aria-pressed="true"]{background:var(--navy-ink);color:var(--navy);opacity:1}
.conn.ro i{background:#7FB3D5}
/* Veri tablosu */
.dtw{overflow:auto;border:1px solid var(--rule);background:var(--sheet);max-height:70vh}
table.dt{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
table.dt th,table.dt td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top;max-width:340px}
table.dt th{position:sticky;top:0;z-index:2;background:var(--soft);font-size:11px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
table.dt th.req{color:var(--bad)}
table.dt th.calc{color:var(--ok)}
table.dt th .ar{opacity:.6;margin-left:3px}
table.dt td .cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
table.dt tr{cursor:pointer}
table.dt tbody tr:hover td{background:var(--soft)}
table.dt td.id{font-family:var(--f-mono);white-space:nowrap;position:sticky;left:0;background:var(--sheet);z-index:1}
table.dt th.id{left:0;z-index:3}
table.dt td code{color:var(--accent)}
.only-desk{display:block}.only-mob{display:none}
@media (max-width:760px){.only-desk{display:none}.only-mob{display:block}}
.kpi{display:inline-flex;gap:4px;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tagwarn{color:var(--bad);font-weight:600}
.lnk{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.tabs{max-width:1360px;width:100%;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--navy-ink);opacity:.72;padding:8px 12px 9px;cursor:pointer;white-space:nowrap;font-size:13.5px;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:baseline}
.tabs button small{font-family:var(--f-mono);font-size:11px;opacity:.8}
.tabs button:hover{opacity:1}
.tabs button[aria-current="page"]{opacity:1;border-bottom-color:#7FD0E8;font-weight:600}

/* Genel bileşenler */
.vhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;padding-top:6px}
.vhead h2{font-size:clamp(21px,2.6vw,27px);font-weight:700}
.vhead p{margin:2px 0 0;color:var(--muted);max-width:76ch;font-size:13.5px}
.vhead .acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:6px 12px;cursor:pointer;font-size:13px;line-height:1.35;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ai{border-color:var(--ai);color:var(--ai);border-style:dashed}
.btn.ai.solid{background:var(--ai);color:var(--sheet);border-style:solid;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:2px 6px;color:var(--muted);font-size:16px;line-height:1}
.iconbtn:hover{color:var(--accent)}
.star{color:var(--rule)}.star.on{color:#D49A1C}
.seg{display:inline-flex;border:1px solid var(--rule);background:var(--sheet);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card{background:var(--sheet);border:1px solid var(--rule);min-width:0}
.card>header{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card>header h3{font-size:15.5px;font-weight:600}
.card>.cbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--rule);background:var(--sheet)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.note{background:var(--ai-soft);border:1px dashed var(--ai);padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.note.err{background:var(--bad-soft);border-color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.03em;padding:1px 7px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;line-height:1.6}
.badge.g{color:var(--b-green);border-color:var(--b-green)}
.badge.b{color:var(--b-blue);border-color:var(--b-blue)}
.badge.y{color:var(--b-yellow);border-color:var(--b-yellow)}
.badge.o{color:var(--b-orange);border-color:var(--b-orange)}
.badge.x{color:var(--b-grey);border-color:var(--b-grey);border-style:dashed}
.badge.solid{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.badge.ai{color:var(--ai);border-color:var(--ai);border-style:dashed}
.badge.okb{color:var(--ok);border-color:var(--ok)}
.badge.badb{color:var(--bad);border-color:var(--bad)}
.pchips{display:flex;flex-wrap:wrap;gap:4px}
.pchip{font-size:11.5px;background:var(--soft);padding:1px 7px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;z-index:80;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Filtre çubuğu ve listeler */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sheet);border:1px solid var(--rule);padding:8px 10px}
.fbar input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--paper);padding:6px 9px}
.fbar select{border:1px solid var(--rule);background:var(--paper);padding:6px 8px;max-width:100%;min-width:0;flex:0 1 auto}
.fbar .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.fbar label.tg{display:flex;gap:5px;align-items:center;font-size:13px;cursor:pointer;white-space:nowrap}
.list{display:flex;flex-direction:column;border:1px solid var(--rule);background:var(--sheet)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:10px 14px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:start}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft)}
.item .main{display:flex;flex-direction:column;gap:3px;min-width:0}
.item .t1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.item .t1 code{font-size:14px;font-weight:500;color:var(--accent)}
.item .t1 b{font-weight:600}
.item .desc{color:var(--muted);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .side{display:flex;gap:4px;align-items:center}
.item.sel{box-shadow:inset 3px 0 0 var(--accent)}
.more{display:flex;justify-content:center;padding:10px}
.gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcardx{background:var(--sheet);border:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.pcardx:hover{border-color:var(--accent)}
.pcardx h4{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.pcardx p{margin:0;font-size:13px;color:var(--muted)}
.pcardx .foot{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:thin;max-width:100%}
.subtabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:0 0 auto}
.subtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tablew{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);position:sticky;top:0}
table.t td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.pre{margin:0;padding:12px 14px;background:var(--code-bg);color:var(--code-fg);font-family:var(--f-mono);font-size:12.3px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:60vh}
.pre .k{color:var(--code-key)}
.pre .d{color:var(--code-dim)}

/* Ana panel */
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .n{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-weight:600}
.tile .s{font-size:12px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{display:flex;flex-direction:column}
.mini .r{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;min-width:0}
.mini .r:last-child{border-bottom:0}
.mini .r .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r small{color:var(--muted);font-size:11.5px;white-space:nowrap}

/* Kayıt paneli (drawer) */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--sheet);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer>header{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.drawer>header h3{font-size:18px;font-weight:600;word-break:break-word}
.drawer>header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.drawer .dbody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.drawer>footer{padding:10px 16px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.drawer>footer .l,.drawer>footer .r{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word;min-width:0}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld textarea,.fld select{border:1px solid var(--rule);background:var(--paper);padding:7px 9px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld textarea.long{min-height:240px;font-family:var(--f-mono);font-size:12.5px}
.fld .req{color:var(--bad)}
.fld .err{color:var(--bad);font-size:12px}
.optchips{display:flex;flex-wrap:wrap;gap:5px}
.optchips button{border:1px solid var(--rule);background:var(--sheet);padding:3px 9px;cursor:pointer;font-size:12.5px}
.optchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist .h{border-left:3px solid var(--rule);padding:4px 10px}
.hist .h.add{border-left-color:var(--ok)}.hist .h.del{border-left-color:var(--bad)}.hist .h.upd{border-left-color:var(--accent)}
.hist .h .meta{color:var(--muted)}
.chg{font-family:var(--f-mono);font-size:11.5px;margin-top:3px;display:flex;flex-direction:column;gap:2px}
.chg .o{color:var(--bad);text-decoration:line-through;word-break:break-word}
.chg .n{color:var(--ok);word-break:break-word}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,24,.45)}
.modal .box{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column}
.modal .box header{padding:12px 16px;border-bottom:1px solid var(--rule)}
.modal .box header h3{font-size:17px}
.modal .box .mb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.modal .box footer{padding:10px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Form (Rev.04 çekirdeği) */
.docHead{background:var(--sheet);border:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:0}
.docHead .t{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.docHead h2{font-size:clamp(21px,2.8vw,28px);font-weight:700;letter-spacing:.2px}
.docHead p{margin:0;color:var(--muted);max-width:74ch}
.docCode{border-left:1px solid var(--rule);display:grid;grid-template-columns:auto auto;font-size:12px;min-width:220px;align-content:start}
.docCode div{padding:8px 14px;border-bottom:1px solid var(--rule)}
.docCode div:nth-child(odd){color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;border-right:1px solid var(--rule)}
.docCode div:nth-last-child(-n+2){border-bottom:0}
.docCode b{font-family:var(--f-mono);font-weight:500}
.metaRow{display:grid;grid-template-columns:2fr 1fr 1fr;border-top:1px solid var(--rule);grid-column:1/-1}

<script>

function kindOf(file){const ty=file.type||'',e=extOf(file.name);
  if(ty.startsWith('image/')||['png','jpg','jpeg','webp','gif','heic','bmp'].includes(e))return 'image';

const KIND_LABEL=()=>({image:t('Görsel','Image'),video:'Video',pdf:'PDF',docx:'Word',sheet:t('Excel / tablo','Excel / sheet'),text:t('Metin','Text'),audio:t('Ses','Audio'),other:t('Dosya','File')});
async function readWorkbook(file){await loadScript(LIB_XLSX);return window.XLSX.read(await file.arrayBuffer(),{type:'array'})}

  if(k==='text'){let s=await file.text();if(['html','htm'].includes(extOf(file.name))){s=new DOMParser().parseFromString(s,'text/html').body.innerText}return s}

  if(k==='pdf'){await loadScript(LIB_PDF);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIB_PDFW;const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];for(let i=1;i<=Math.min(pdf.numPages,80);i++){const p=await pdf.getPage(i);out.push((await p.getTextContent()).items.map(x=>x.str).join(' '))}return out.join('\n\n')}
  if(k==='sheet'){const wb=await readWorkbook(file);return wb.SheetNames.map(n=>'### '+n+'\n'+window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n\n')}
  return ''}
async function shrinkImage(blob,max=1568){try{const bmp=await createImageBitmap(blob);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));if(sc===1&&blob.size<3.5e6&&/image\/(png|jpeg|webp|gif)/.test(blob.type))return blob;const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.86))}catch(e){return blob}}

const COLS=['kod','kodref','kodmeta','uzun','rehber','uzunmeta','plat','model','gecmis','log'];

const META={kodmeta:{kilavuz:[],kategoriler:[],baslikEsleme:[],eskiKategori:[],listeler:{},aktarimRaporu:[]},uzunmeta:{gunluk:[]}};

function notify(col){pending.add(col);clearTimeout(notifyT);notifyT=setTimeout(()=>{const cs=[...pending];pending.clear();listeners.forEach(f=>{try{f(cs)}catch(e){console.error(e)}})},40)}
function setCol(col,v){
  if(col==='log'){LOGARR=Array.isArray(v)?v:[];LOG=LOGARR.slice().reverse();LOADED.log=true;return}
  if(col in META){META[col]=Object.assign(META[col],v||{});LOADED[col]=true;return}
  DATA[col]=new Map(arr(v).map(r=>[r.id,r]));LOADED[col]=true;
}
const colArray=col=>col==='log'?LOGARR:(col in META)?META[col]:[...DATA[col].values()];
const serialize=v=>Array.isArray(v)?'[\n'+v.map(x=>JSON.stringify(x)).join(',\n')+'\n]\n':JSON.stringify(v,null,1)+'\n';

const GH={owner:'evodakkonaklama-glitch',repo:'Evodak-Prompt-Asistan-',branch:'main',head:null,shas:{},user:'',canPush:false,priv:false,
  base(){return `/repos/${this.owner}/${this.repo}`},
  web(){return `https://github.com/${this.owner}/${this.repo}`},
  async req(path,opt={}){
    const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    if(CFG.token)h.Authorization='Bearer '+CFG.token;Object.assign(h,opt.headers||{});
    const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
    if(!r.ok){let m='';try{m=(await r.json()).message}catch(_){}const e=new Error('GitHub '+r.status+(m?': '+m:''));e.status=r.status;throw e}
    return opt.raw?r.text():r.json();
  },
  async headSha(){return (await this.req(this.base()+'/git/ref/heads/'+this.branch)).object.sha},
  async treeOf(commitSha){const c=await this.req(this.base()+'/git/commits/'+commitSha);const tr=await this.req(this.base()+'/git/trees/'+c.tree.sha+'?recursive=1');const m={};tr.tree.forEach(e=>{const mm=e.path.match(/^data\/(\w+)\.json$/);if(mm)m[mm[1]]=e.sha});return {tree:c.tree.sha,shas:m}},
  async blob(sha){return JSON.parse(await this.req(this.base()+'/git/blobs/'+sha,{headers:{Accept:'application/vnd.github.raw'},raw:true}))},
  async raw(col){const r=await fetch(`https://raw.githubusercontent.com/${this.owner}/${this.repo}/${this.branch}/data/${col}.json?v=${now()}`,{cache:'no-store'});if(!r.ok){const e=new Error('raw '+r.status);e.status=r.status;throw e}return r.json()},
  async whoami(){
    if(!CFG.token){this.user='';this.canPush=false;return}
    const u=await this.req('/user');this.user=u.login;
    const rp=await this.req(this.base());this.canPush=!!(rp.permissions&&rp.permissions.push);this.priv=!!rp.private;
  }
};
async function cacheSave(){const o={at:now(),head:GH.head,shas:GH.shas};COLS.forEach(c=>o[c]=colArray(c));await IDB.set('cache',o)}
async function cacheLoad(){const o=await IDB.get('cache');if(!o)return false;COLS.forEach(c=>{if(o[c]!==undefined)setCol(c,o[c])});STATE.cachedAt=o.at;GH.shas=o.shas||{};return true}
const canWrite=()=>!!(CFG.token&&GH.canPush&&STATE.online);

function setConn(cls,txt){const c=$('#conn');c.className='conn '+cls;c.querySelector('span').textContent=txt}
function connState(){
  if(STATE.syncing)return setConn('',t('Kaydediliyor…','Saving…'));
  if(!STATE.online)return setConn('off',STATE.cachedAt?t('Çevrimdışı · önbellek','Offline · cached'):t('Çevrimdışı','Offline'));
  if(canWrite())return setConn('ok',(GH.user?GH.user+' · ':'')+t('GitHub · güncel','GitHub · up to date'));
  if(CFG.token&&!GH.canPush)return setConn('ro',t('Salt okunur (yazma izni yok)','Read-only (no write access)'));
  setConn('ro',t('Salt okunur · kaydetmek için bağlanın','Read-only · connect to save'));
}
async function loadAll(force){
  STATE.syncing=false;setConn('',t('Yükleniyor…','Loading…'));
  try{
    if(CFG.token){
      if(!GH.user)await GH.whoami();
      const head=await GH.headSha();
      if(!force&&head===GH.head&&COLS.every(c=>LOADED[c])){STATE.online=true;connState();return false}
      const {shas}=await GH.treeOf(head);
      await Promise.all(COLS.map(async col=>{
        if(!force&&shas[col]&&shas[col]===GH.shas[col]&&LOADED[col])return;
        if(!shas[col]){setCol(col,col in META?{}:[]);return}
        setCol(col,await GH.blob(shas[col]));
      }));
      GH.head=head;GH.shas=shas;STATE.source='api';
    }else{
      await Promise.all(COLS.map(async col=>{try{setCol(col,await GH.raw(col))}catch(e){if(e.status===404&&col!=='log')throw e;setCol(col,col in META?{}:[])}}));
      STATE.source='raw';
    }
    STATE.online=true;STATE.cachedAt=now();cacheSave();connState();notify('*');return true;
  }catch(e){
    console.warn(e);STATE.online=false;
    if(e.status===401){banner(t('GitHub anahtarı geçersiz veya süresi dolmuş. Ayarlar’dan yeni anahtar girin.','The GitHub token is invalid or expired. Enter a new one in Settings.'),'err',true)}
    else if(e.status===404&&!CFG.token){banner(t('Veri deposu gizli (private) görünüyor. Görmek için Ayarlar’dan GitHub anahtarınızı girin.','The data repository looks private. Enter your GitHub token in Settings to view it.'),'err',true)}
    else banner(t('Veriler GitHub’dan alınamadı','Could not load data from GitHub')+(STATE.cachedAt?t('; cihazdaki son kopya gösteriliyor ('+fmtDate(STATE.cachedAt)+').','; showing the last copy on this device ('+fmtDate(STATE.cachedAt)+').'):'.')+' '+esc(e.message),'err');
    connState();notify('*');return false;
  }
}
async function poll(){if(document.hidden||STATE.syncing||!CFG.token)return;try{const h=await GH.headSha();if(h!==GH.head){await loadAll(false)}else if(!STATE.online){STATE.online=true;connState()}}catch(e){}}
setInterval(poll,45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* Tek commit: koleksiyon + log */
async function commitChange(col,mutate,logEntries,message){
  if(!CFG.token)throw new Error(t('Kaydetmek için Ayarlar’dan GitHub bağlantısı kurun.','Connect GitHub in Settings to save.'));
  if(!GH.canPush)throw new Error(t('Bu GitHub hesabının depoya yazma izni yok.','This GitHub account cannot write to the repository.'));
  STATE.syncing=true;connState();
  try{
    for(let attempt=0;attempt<4;attempt++){
      const head=await GH.headSha();
      if(head!==GH.head){
        const {shas}=await GH.treeOf(head);
        for(const c of [col,'log']){if(shas[c]&&shas[c]!==GH.shas[c])setCol(c,await GH.blob(shas[c]))}
        GH.head=head;GH.shas=shas;notify(col);
      }
      const cm=await GH.req(GH.base()+'/git/commits/'+head);
      const next=mutate(clone(colArray(col)));
      const nextLog=[...LOGARR,...logEntries].slice(-3000);
      const tree=await GH.req(GH.base()+'/git/trees',{method:'POST',body:{base_tree:cm.tree.sha,tree:[
        {path:`data/${col}.json`,mode:'100644',type:'blob',content:serialize(next)},
        {path:'data/log.json',mode:'100644',type:'blob',content:serialize(nextLog)}]}});
      const nc=await GH.req(GH.base()+'/git/commits',{method:'POST',body:{message,tree:tree.sha,parents:[head]}});
      try{await GH.req(GH.base()+'/git/refs/heads/'+GH.branch,{method:'PATCH',body:{sha:nc.sha,force:false}})}
      catch(e){if(e.status===422||e.status===409)continue;throw e}
      setCol(col,next);setCol('log',nextLog);GH.head=nc.sha;
      GH.treeOf(nc.sha).then(r=>{if(GH.head===nc.sha){GH.shas=r.shas;cacheSave()}}).catch(()=>{});
      notify(col);notify('log');return next;
    }
    throw new Error(t('Aynı anda başka bir kayıt yapıldı; lütfen tekrar deneyin.','Someone else saved at the same time; please try again.'));
  }finally{STATE.syncing=false;connState()}
}
const SKIP=new Set(['guncelleme','guncelleyen']);
function clip(v){if(typeof v==='string'&&v.length>20000)return v.slice(0,20000)+' …';return v}
function diffFields(a,b){const ch={};new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{if(SKIP.has(k))return;const x=a?a[k]:undefined,y=b?b[k]:undefined;if(JSON.stringify(x??'')!==JSON.stringify(y??''))ch[k]=k==='formState'?['…',t('(form güncellendi)','(form updated)')]:[clip(x??''),clip(y??'')]});return ch}
const logId=()=>'L'+now().toString(36)+Math.random().toString(36).slice(2,5);
function guard(){if(!canWrite()){toast(CFG.token?t('Yazma izni yok veya çevrimdışısınız.','No write access or offline.'):t('Kaydetmek için Ayarlar’dan GitHub ile bağlanın.','Connect GitHub in Settings to save.'),4000);if(!CFG.token)go('ayar');return false}return true}
function colLabel(col){return (COLDEF[col]&&COLDEF[col].name())||col}
async function saveRecord(col,id,data,opt={}){
  if(!guard())throw new Error('no-write');
  const old=DATA[col].get(id);const isNew=!old;
  const stamp={guncelleme:iso(),guncelleyen:GH.user};if(isNew){stamp.eklenme=iso();stamp.ekleyen=GH.user}
  const body=Object.assign({},old||{},data,stamp,{id});
  const ch=diffFields(old,body);
  if(!isNew&&!Object.keys(ch).length&&!opt.force)return id;
  const title=COLDEF[col].title(body);
  const entry={id:logId(),at:iso(),by:GH.user,col,docId:id,action:opt.action||(isNew?'ekle':'düzenle'),title,changes:isNew?{}:ch,note:opt.note||''};
  await commitChange(col,a=>{const i=a.findIndex(r=>r.id===id);if(i>=0)a[i]=Object.assign({},a[i],data,stamp,{id});else a.push(body);if(COLDEF[col].calc)COLDEF[col].calc(i>=0?a[i]:body);return a},[entry],`${entry.action}: ${colLabel(col)} · ${title} (${GH.user})`);
  return id;
}
async function saveMany(col,items,opt={}){
  if(!guard())throw new Error('no-write');
  const entries=[];const stampBase={guncelleme:iso(),guncelleyen:GH.user};
  items.forEach(({id,data})=>{const old=DATA[col].get(id);entries.push({id:logId(),at:iso(),by:GH.user,col,docId:id,action:old?'düzenle':'ekle',title:COLDEF[col].title(Object.assign({},old||{},data)),changes:old?diffFields(old,Object.assign({},old,data)):{},note:opt.note||''})});
  await commitChange(col,a=>{items.forEach(({id,data})=>{const i=a.findIndex(r=>r.id===id);const st=Object.assign({},stampBase,i<0?{eklenme:iso(),ekleyen:GH.user}:{});if(i>=0)a[i]=Object.assign({},a[i],data,st,{id});else a.push(Object.assign({},data,st,{id}));if(COLDEF[col].calc)COLDEF[col].calc(a[i>=0?i:a.length-1])});return a},entries,`${opt.note||t('toplu kayıt','bulk save')}: ${colLabel(col)} · ${items.length} (${GH.user})`);
}
async function deleteRecord(col,id,opt={}){
  if(!guard())return;const old=DATA[col].get(id);if(!old)return;
  const entry={id:logId(),at:iso(),by:GH.user,col,docId:id,action:'sil',title:COLDEF[col].title(old),snapshot:old,changes:{},note:opt.note||''};
  await commitChange(col,a=>a.filter(r=>r.id!==id),[entry],`sil: ${colLabel(col)} · ${entry.title} (${GH.user})`);
}
async function saveMeta(col,mutate,note){
  if(!guard())throw new Error('no-write');
  const entry={id:logId(),at:iso(),by:GH.user,col,docId:col,action:'düzenle',title:note,changes:{},note:''};
  await commitChange(col,o=>{mutate(o);return o},[entry],`düzenle: ${col} · ${note} (${GH.user})`);
}
async function restoreLog(l){
  if(!guard())return;
  if(l.action==='sil'&&l.snapshot){await saveRecord(l.col,l.docId,l.snapshot,{action:'geri al',note:t('Silinen kayıt geri getirildi','Deleted record restored'),force:true});toast(t('Kayıt geri getirildi','Record restored'));return}
  if(l.action==='ekle'){await deleteRecord(l.col,l.docId,{note:t('Ekleme geri alındı','Addition undone')});toast(t('Ekleme geri alındı','Addition undone'));return}
  if(!DATA[l.col]||!DATA[l.col].get(l.docId)){toast(t('Kayıt artık yok; geri alınamadı','The record no longer exists'));return}
  const patch={};Object.entries(l.changes||{}).forEach(([k,[o]])=>{if(k!=='formState')patch[k]=o});
  await saveRecord(l.col,l.docId,patch,{action:'geri al',note:t('Değişiklik geri alındı ','Change undone ')+'('+fmtDate(l.at)+')'});toast(t('Değişiklik geri alındı','Change undone'));
}

  for(const [id,d] of DATA.kod)if(d.kod&&trLower(d.kod).trim()===c)return [id,d];

function modal({title,body,ok,cancel,danger,onOk,wide}){
  ok=ok||t('Tamam','OK');if(cancel===undefined)cancel=t('Vazgeç','Cancel');
  const host=$('#modalHost');
  host.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box" ${wide?'style="width:min(860px,100%)"':''}><header><h3>${esc(title)}</h3></header><div class="mb">${body}</div><footer>${cancel?`<button class="btn" type="button" data-m="x">${esc(cancel)}</button>`:''}<button class="btn ${danger?'danger':'primary'}" type="button" data-m="ok">${esc(ok)}</button></footer></div></div>`;
  const close=()=>host.innerHTML='';
  host.querySelector('[data-m="ok"]').onclick=async()=>{const b=host.querySelector('[data-m="ok"]');b.disabled=true;let r;try{r=onOk?await onOk(host):true}catch(e){toast(e.message,4500);r=false}b.disabled=false;if(r!==false)close()};
  const x=host.querySelector('[data-m="x"]');if(x)x.onclick=close;
  host.querySelector('.modal').addEventListener('click',e=>{if(e.target.classList.contains('modal'))close()});
  const f=host.querySelector('input,textarea,select');if(f)f.focus();return host;
}

const persistVS=k=>{const s=VS[k];LS.set('evd-vs-'+k,{f:s.f,tab:s.tab,view:s.view,sort:s.sort,cols:s.cols})};

function matches(d,q,keys){if(!q)return true;const n=norm(q);return keys.some(k=>norm(Array.isArray(d[k])?d[k].join(' '):d[k]).includes(n))}

function bindList(root,key,rerender){

function dataTable(key,col,rows,cols,opts={}){
  const s=vstate(key);const sorted=rows.slice();
  if(s.sort){const f=cols.find(c=>c.k===s.sort.k);if(f){const val=d=>f.virt?f.virt(d):d[f.k];sorted.sort((a,b)=>{const x=val(a[1]),y=val(b[1]);const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),'tr',{numeric:true});return s.sort.d==='desc'?-r:r})}}
  const shown=sorted.slice(0,s.limit);
  const cell=(f,d)=>{let v=f.virt?f.virt(d):d[f.k];if(Array.isArray(v))v=v.join(', ');if(v===undefined||v===null)v='';const sv=String(v);
    if(f.k==='id')return `<td class="id">${esc(sv)}</td>`;if(f.k==='anaKat'&&isEN()&&d.anaKatEn)return `<td><div class="cl">${esc(d.anaKatEn)}</div></td>`;if(f.k==='kod')return `<td>${sv?`<code>${esc(sv)}</code>`:''}</td>`;
    if(f.k==='tur')return `<td>${turBadge(sv)}</td>`;if(f.k==='durum'&&col!=='plat')return `<td>${durumBadge(sv)}</td>`;if(f.k==='_kontrol')return `<td class="${/⚠/.test(sv)?'tagwarn':''}">${esc(sv)}</td>`;
    if(f.k==='puan')return `<td class="num">${sv?'★'.repeat(Number(sv)||0):''}</td>`;
    return `<td><div class="cl">${esc(sv)}</div></td>`};
  return `<div class="dtw"><table class="dt"><thead><tr>${cols.map(f=>`<th class="${f.k==='id'?'id':''} ${f.req?'req':''} ${f.calc?'calc':''}" data-sort="${key}|${f.k}" title="${esc(FL(f))}">${esc(FL(f))}${s.sort&&s.sort.k===f.k?`<span class="ar">${s.sort.d==='desc'?'▼':'▲'}</span>`:''}</th>`).join('')}</tr></thead><tbody>${shown.map(([id,d])=>`<tr data-open="${col}|${esc(id)}">${cols.map(f=>cell(f,d)).join('')}</tr>`).join('')}</tbody></table></div>${sorted.length>shown.length?`<div class="more"><button class="btn" type="button" data-more="${key}">${esc(t('Daha fazla göster','Show more'))} (${num(sorted.length-shown.length)})</button></div>`:''}`;
}

const B_TR=`Sen kıdemli bir Prompt Mühendisi, AI iş akışı mimarı, alan uzmanı ve çıktı kalite denetçisisin. Yukarıdaki Meta Bilgileri kullanarak, kullanıcının hedef yapay zekâya doğrudan kopyalayıp gönderebileceği tek bir nihai prompt üret.

1) ANALİZ: Amacı, konuyu, hedef kitleyi, dili, platformu, çıktı türünü ve kullanıcının verdiği gerçek bilgileri çözümle. Kullanıcının verdiği bilgi ile senin varsayımını ayır. Çelişki varsa sırasıyla en son verilen, en açık ve açıkça belirtilmiş talimatı esas al; çelişkileri sessizce birleştirme. Kullanıcının söylediği ile gerçekte istediği farklıysa gerçek hedefe hizmet et.

2) İNŞA: Yalnızca gerekenleri dahil et: göreve uygun uzmanlık rolü, ölçülebilir amaç, uygulanabilir görev tanımı, bağlam, girdiler ve nasıl kullanılacakları, net çıktı (adet, uzunluk, format, oran), stil ve ton, sınırlar (negatif talimatlar) ve iç kontrol adımları. "Profesyonel olsun" gibi belirsiz ifadeler yerine neyin profesyonel sayılacağını tanımla.

3) GÖREVE ÖZEL MOTOR:
- Görsel: özne, ortam, kompozisyon, kamera ve lens, ışık, malzeme ve doku, renk, ölçek, gerçeklik, oran, negatif prompt.
- Video: açılış karesi, sahne akışı, süre, kamera ve özne hareketi, geçişler, süreklilik, bitiş karesi, istenmeyen hareketler.
- Reklam / sosyal medya: hook, acı noktası, değer önerisi, duygusal tetik, mesaj hiyerarşisi, CTA, platform formatı.
- Araştırma / finans: kaynak güvenilirliği, güncellik, metodoloji, varsayımlar, senaryolar, riskler, hassasiyet.
- Kod / teknik: teknoloji, girdi-çıktı, mimari, güvenlik, hata yönetimi, test, kabul kriterleri.
- Metin / senaryo: kitle, anlatıcı, yapı, ritim, duygu, mesaj, CTA.

4) PLATFORM: Hedef platform belirtilmişse promptu o platformun yapısına ve parametrelerine göre optimize et; desteklenmeyen parametre ekleme. Belirtilmemişse platform bağımsız yaz.

5) KOMUTLAR: "Uygulanacak komutlar" satırındaki her komutu, yanındaki anlamıyla birlikte hedef AI'ın anlayacağı açık talimata dönüştür; komut kodunu açıklamasız bırakma.

6) KALİTE KONTROL (kullanıcıya gösterme): amaç, görev, rol, bağlam, girdi, çıktı, format, dil, kitle ve platform uyumu; gereksiz, eksik veya çelişkili talimat; uydurma bilgi riski; değiştirilmemesi gereken bilgilerin korunması; ölçülebilirlik; uzunluk ile eksiksizlik dengesi. Sorun bulursan teslimden önce düzelt.

GERÇEKLİK: Fiyat, tarih, istatistik, mevzuat, teknik özellik, kişi veya şirket bilgisi gibi verilmemiş verileri kesin bilgi gibi yazma. Gerekirse prompta "veri yoksa açıkça belirt ve doğrulanabilir kaynak kullan" talimatını ekle.

ÇIKTI KURALI: Ara analiz veya taslak gösterme. Nihai, kullanıma hazır promptu ver; "Teslim biçimi" alanında ek bir şey (negatif prompt, alternatif, açıklama, teknik ayar) istendiyse yalnızca onu ekle. Gereksiz "Rol: / Görev:" başlıkları kullanma; platform için daha etkiliyse yapılandırılmış başlık kullanabilirsin. Kritik bir varsayım yaptıysan promptun sonuna tek satır ekle: "Varsayım: [...]".`;
const B_EN=`You are a senior prompt engineer, AI workflow architect, domain expert and output quality reviewer. Using the meta information above, produce one final prompt the user can paste directly into the target AI.

1) ANALYSE: Work out the purpose, topic, audience, language, platform, output type and the facts the user supplied. Keep the user's facts separate from your assumptions. If information conflicts, prefer the most recent, then the most explicit, then the expressly stated instruction; never silently merge conflicts. If what the user says differs from what they actually need, serve the real goal.

2) BUILD: Include only what is needed: an expert role that fits the task, a measurable goal, an actionable task, context, inputs and how to use them, a precise output (count, length, format, ratio), style and tone, limits (negative instructions) and internal checks. Replace vague words like "professional" with a definition of what counts as professional.

3) TASK-SPECIFIC ENGINE:
- Image: subject, setting, composition, camera and lens, light, materials and texture, colour, scale, realism, aspect ratio, negative prompt.
- Video: opening frame, scene progression, duration, camera and subject motion, transitions, continuity, end frame, unwanted motion.
- Ads / social: hook, pain point, value proposition, emotional trigger, message hierarchy, CTA, platform format.
- Research / finance: source reliability, recency, methodology, assumptions, scenarios, risks, sensitivity.
- Code / technical: stack, inputs and outputs, architecture, security, error handling, tests, acceptance criteria.
- Writing / script: audience, narrator, structure, rhythm, emotion, message, CTA.

4) PLATFORM: If a target platform is named, optimise for its structure and parameters and add no unsupported parameters. Otherwise write a platform-agnostic prompt.

5) COMMANDS: Turn every command listed under "Apply these commands" into a plain instruction the target AI will understand, using the meaning given next to it; never leave a bare command code.

6) QUALITY CHECK (do not show it): purpose, task, role, context, inputs, output, format, language, audience and platform fit; redundant, missing or conflicting instructions; risk of invented facts; preservation of facts that must not change; measurability; balance of length and completeness. Fix any issue before delivering.

FACTS: Never state unsupplied prices, dates, statistics, regulations, specs, or people or company details as fact. Where needed, instruct: "If data is unavailable, say so and use verifiable sources."

OUTPUT RULE: Show no analysis or drafts. Deliver the final, ready-to-use prompt; if the "Delivery format" field asks for extras (negative prompt, alternatives, rationale, settings), add only those. Avoid needless "Role: / Task:" labels, but use structured headings when they work better for the platform. If you made a critical assumption, end with one line: "Assumption: [...]".`;

    for(const b of (opt.images||[]).slice(0,this.maxImages)){const bl=await shrinkImage(b);const mt=/image\/(png|jpeg|webp|gif)/.test(bl.type)?bl.type:'image/jpeg';content.push({type:'image',source:{type:'base64',media_type:mt,data:await blobB64(bl)}})}
    content.push({type:'text',text:prompt+'\n\n'+t('Yanıtı YALNIZCA geçerli bir JSON nesnesi olarak ver; açıklama veya kod bloğu ekleme.','Reply ONLY with a valid JSON object; no explanation or code fence.')});
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':CFG.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:opt.big?(CFG.aiModelBig||CFG.aiModel):CFG.aiModel,max_tokens:opt.maxTokens||8000,messages:[{role:'user',content}]})});
    if(!r.ok){let m='';try{const j=await r.json();m=j.error&&j.error.message||''}catch(_){}throw new Error('Anthropic '+r.status+(m?': '+m:''))}
    const j=await r.json();const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error(t('AI yanıtı JSON değil.','AI reply was not JSON.'));
    try{return JSON.parse(txt.slice(a,b+1))}catch(e){throw new Error(t('AI yanıtı okunamadı.','Could not parse the AI reply.'))}
  }
};

function groupLines(mod){
  const m=M[mod],out=[];
  m.groups.forEach(g=>{
    const k=mod+'.'+g.id,lab=(g.l||m.t)[L()];
    if(g.type==='cmdx'){(S.sel[k]||[]).forEach(v=>{const ds=cmdDesc(v);out.push('  '+v+(ds?' → '+String(ds).replace(/\s+/g,' ').replace(/\.$/,''):''))});return}

    if(g.type==='multi'||g.type==='single'){
      const vs=S.sel[k]||[];if(!vs.length)return;
      if(g.sentence){out.push(vs.map(v=>valText(g,v,mod)).join(' '));return}
      out.push(`${lab}: ${vs.map(v=>valText(g,v,mod)).join(', ')}`);
    }else if(g.type==='text'||g.type==='area'){
      const x=(S.txt[k]||'').trim();if(!x)return;

  });

  sec('ctx','Bağlam','Context');sec('req','Gereksinimler','Requirements');sec('style','Stil ve ton','Style and tone');sec('fmt','Çıktı ve format','Output and format');
  sec('must','Mutlaka olsun','Must include');sec('not','Kesinlikle olmasın','Must avoid');sec('prio','Öncelik sırası','Priority order');sec('cmd','Uygulanacak komutlar','Commands to apply');

/* ----- AI üretimi: adım adım düşün → taslak → öz-eleştiri → düzeltilmiş son hal ----- */
async function generateAI(){
  if(!LLM.need())return;
  const b=$('#genBtn');b.disabled=true;b.innerHTML='<span class="spin"></span> '+esc(t('AI çalışıyor…','AI is working…'));
  const keepMode=S.mode;S.mode='meta';const meta=metaText();S.mode=keepMode;
  const crit=!!S.chk['calisma.elestir'],think=!!S.chk['calisma.dusun'];
  const en=L();
  const instr=`${meta}\n\n=== ${en?'PANEL OUTPUT RULE':'PANEL ÇIKTI KURALI'} ===\n${en?'Produce the final prompt following the generation instruction above.':'Yukarıdaki üretim talimatına göre nihai promptu hazırla.'} ${think?(en?'Think step by step first and summarise your reasoning steps briefly.':'Önce adım adım düşün ve düşünme adımlarını kısaca özetle.'):''} ${aiFill()?(en?'Fill every field left empty with the most suitable choice and list these as assumptions.':'Boş bırakılan alanları en uygun seçimle doldur ve bunları varsayım olarak listele.'):''} ${crit?(en?'Then write a draft, critique it for gaps, ambiguity, errors and inconsistencies, and write the corrected final version.':'Sonra bir taslak yaz; taslağı eksiklik, belirsizlik, hata ve tutarsızlık açısından eleştir; eleştiriye göre düzeltilmiş son hali yaz.'):''}\n${en?'Reply ONLY with this JSON object':'Yanıtı YALNIZCA şu JSON nesnesi olarak ver'}: {"adimlar":["${en?'short reasoning steps':'kısa düşünme adımları'}"],"elestiri":["${en?'issues you found in the draft and fixed':'taslakta bulup düzelttiğin sorunlar'}"],"nihai_prompt":"${en?'the corrected final prompt text':'düzeltilmiş nihai prompt metni'}","varsayimlar":["${en?'assumptions you made':'yaptığın varsayımlar'}"]}`;
  try{
    const imgs=[];for(const f of (S.files||[]).filter(f=>f.kind==='image')){if(imgs.length>=LLM.maxImages)break;const bl=await imageBlobOf(f);if(bl)imgs.push(bl)}
    const r=await LLM.json(imgs.length?instr+`\n\n${en?'The attached images are the user\'s example files listed in the meta information.':'Ekteki görseller meta bilgilerde listelenen örnek dosyalardır.'}`:instr,{images:imgs,big:true,maxTokens:12000});
    const p=String(r.nihai_prompt||r.prompt||'').trim();if(!p)throw new Error(t('Boş yanıt geldi','Empty reply'));
    S.ai={prompt:p,steps:arr(r.adimlar).map(String),critique:arr(r.elestiri).map(String),assumptions:arr(r.varsayimlar).map(String),at:now(),lang:S.lang};S.out='ai';
    updateOut();toast(t('Nihai prompt hazır','Final prompt ready'));
    if(window.innerWidth<1000)$('#output').scrollIntoView({behavior:'smooth'});
  }catch(e){toast(t('Üretilemedi: ','Generation failed: ')+(e.message||e),5000)}
  finally{b.disabled=false;b.textContent=t('AI ile nihai promptu üret','Generate final prompt with AI')}
}

function tokenize(s){return String(s).match(/\s+|[^\s]+/g)||[]}
function lcsDiff(a,b){const n=a.length,m=b.length;if(n*m>4e6)return null;
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push(['=',a[i]]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['-',a[i++]])}else out.push(['+',b[j++]])}
  while(i<n)out.push(['-',a[i++]]);while(j<m)out.push(['+',b[j++]]);return out}
function diffHtml(a,b){const la=String(a).split('\n'),lb=String(b).split('\n');const d=lcsDiff(la,lb);if(!d)return esc(b);let html='';let k=0;
  while(k<d.length){if(d[k][0]==='='){html+=esc(d[k][1])+'\n';k++;continue}
    const rem=[],add=[];while(k<d.length&&d[k][0]!=='='){(d[k][0]==='-'?rem:add).push(d[k][1]);k++}
    const wd=lcsDiff(tokenize(rem.join('\n')),tokenize(add.join('\n')));
    if(wd)html+=wd.map(([ty,x])=>ty==='='?esc(x):ty==='+'?`<span class="a">${esc(x)}</span>`:`<span class="r">${esc(x)}</span>`).join('')+'\n';
    else html+=(rem.length?`<span class="r">${esc(rem.join('\n'))}</span>\n`:'')+(add.length?`<span class="a">${esc(add.join('\n'))}</span>\n`:'')}
  return html}

function mapStructured(col,hs,rows,src){

  if(col==='uzun'){fmap[HKEY('Aİ Platform')]=fmap[HKEY('AI Platform')]}

  rows.forEach(r=>{if(!r||!r.some(c=>String(c??'').trim()))return;const data={};
    hs.forEach((h,i)=>{const f=fmap[h];if(!f)return;let v=r[i];if(v===undefined||v===null)return;v=typeof v==='string'?v.trim():v;if(v==='')return;
      if(f.type==='num'||f.k==='puan'){const n=Number(v);v=isNaN(n)?v:n}else if(f.type==='plat'||f.type==='multi'){v=String(v).split(/\s*[,;]\s*/).filter(Boolean)}else v=String(v);data[f.k]=v});
    if(!Object.keys(data).length)return;

    else if(col==='uzun'){const ex=[...DATA.uzun.entries()].find(([,d])=>d.no===data.no);if(ex)id=ex[0]}
    else if(col==='plat'){const p=platList().find(p=>trLower(p.ad)===trLower(data.ad||''));if(p)id=p.id}
    else if(col==='gecmis'){const ex=[...DATA.gecmis.entries()].find(([,d])=>trLower(d.baslik)===trLower(data.baslik||''));if(ex)id=ex[0]}
    if(col!=='kod'&&col!=='kodref')delete data.id;
    const old=id?DATA[col].get(id):null;
    const ch=old?Object.keys(data).filter(k=>k!=='id'&&JSON.stringify(old[k]??'')!==JSON.stringify(data[k])):Object.keys(data);
    out.push({kind:'s',col,id,data,title:COLDEF[col].title(Object.assign({},old||{},data))||'—',state:old?(ch.length?'upd':'same'):'new',ch,sec:!old||ch.length>0,src})});

function dupOfAi(it){const x=it.raw;

        if(!LLM.ready()){items=[{kind:'ai',col:YK.target==='auto'?'gecmis':YK.target,raw:{kod:'',baslik:f.name.replace(/\.[^.]+$/,''),baslikEn:'',metin:x,metinEn:'',aciklama:'',aciklamaEn:'',altKat:'',tur:'Nihai prompt',kategori:'',platform:''},state:'new',sec:true,src:f.name}]}
        else{entry.state=t('AI çıkarıyor','AI extracting');RENDER.yukle();for(let i=0;i<x.length&&i<240000;i+=45000)items.push(...(await aiExtract(x.slice(i,i+45000),f.name)).map(m=>Object.assign(m,{src:f.name})))}
      }else throw new Error(t('Bu dosya türü okunamıyor','This file type cannot be read')+' ('+(f.type||extOf(f.name))+')');

}

async function ykCommit(){
  if(!guard())return;const items=YK.items.filter(x=>x.sec);if(!items.length)return;YK.busy=true;RENDER.yukle();
  const by={};const next={};
  const newId=col=>{const p=COLDEF[col].prefix;if(!(col in next)){const nums=[...DATA[col].keys()].map(k=>k.startsWith(p)?parseInt(k.slice(p.length).replace(/\D/g,''),10):NaN).filter(n=>!isNaN(n));next[col]=nums.length?Math.max(...nums):0}next[col]++;
    if(p==='PR-'||p==='RF-')return p+String(next[col]).padStart(4,'0');if(p==='u')return 'u'+String(next[col]).padStart(4,'0');if(p==='p')return 'p'+String(next[col]).padStart(3,'0');return uid(p)};
  const maxNo=col=>Math.max(0,...[...DATA[col].values()].map(d=>Number(d.no)||0));const noNext={uzun:maxNo('uzun'),plat:maxNo('plat')};
  const today_=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
  for(const it of items){const col=it.col;let id=it.id,data=it.kind==='ai'?aiToData(it):Object.assign({},it.data);
    if(!id){if((col==='kod'||col==='kodref')&&data.id&&!DATA[col].has(data.id))id=data.id;else id=newId(col)}
    delete data.id;
    if(!DATA[col].has(id)){if(col==='uzun'&&!data.no)data.no=++noNext.uzun;if(col==='plat'&&!data.no)data.no=++noNext.plat;if(col==='kod'){if(!data.tarih)data.tarih=today_();if(!data.durum)data.durum='Yeni / İşlenmedi'}}
    (by[col]=by[col]||[]).push({id,data,it})}
  let ok=0,fail=0;
  for(const [col,list] of Object.entries(by)){
    try{for(let i=0;i<list.length;i+=400){const part=list.slice(i,i+400);await saveMany(col,part.map(({id,data})=>({id,data})),{note:t('Yükle & Aktar','Upload & Import')});part.forEach(x=>x.it.done=true);ok+=part.length}}
    catch(e){fail+=list.filter(x=>!x.it.done).length;if(e.message!=='no-write')toast(TNAME(col)+': '+e.message,5000)}}
  YK.items=YK.items.filter(x=>!x.done);YK.busy=false;RENDER.yukle();
  toast(t(`${ok} kayıt kaydedildi${fail?`, ${fail} kaydedilemedi`:''}`,`${ok} records saved${fail?`, ${fail} failed`:''}`),4500);
}

/* ===== Ayarlar ===== */
const PANEL_WEB=`https://${GH.owner}.github.io/${GH.repo}/`;
RENDER.ayar=()=>{
  const v=$('#v-ayar');const mask=s=>s?s.slice(0,7)+'…'+s.slice(-4):'';
  v.innerHTML=`<div class="vhead"><div><h2>${esc(t('Ayarlar','Settings'))}</h2><p>${esc(t('Bu ayarlar yalnızca bu cihazda (bu tarayıcıda) saklanır. Anahtarlar hiçbir zaman veri deposuna yazılmaz.','These settings are stored only on this device (this browser). Keys are never written to the data repository.'))}</p></div></div>
  <div class="cols2">
  <div class="card"><header><h3>1 · ${esc(t('GitHub bağlantısı (kaydetmek için)','GitHub connection (to save)'))}</h3><span class="conn ${canWrite()?'ok':CFG.token?'ro':'off'}" style="position:static"><i></i><span>${esc(canWrite()?GH.user+' · '+t('yazabilir','can write'):CFG.token?(GH.user?GH.user+' · ':'')+t('yazma izni yok','no write access'):t('bağlı değil','not connected'))}</span></span></header><div class="cbody">
    <p class="hint" style="margin:0">${esc(t('Veri deposu','Data repository'))}: <a href="${GH.web()}" target="_blank" rel="noopener">${esc(GH.owner+'/'+GH.repo)}</a>${GH.priv?' · '+esc(t('gizli','private')):STATE.online?' · <b style="color:var(--bad)">'+esc(t('herkese açık','public'))+'</b>':''}</p>
    <div class="fld"><label for="cfgTok">${esc(t('GitHub erişim anahtarı (fine-grained token)','GitHub access token (fine-grained)'))}</label><input id="cfgTok" type="password" autocomplete="off" placeholder="${esc(CFG.token?mask(CFG.token):'github_pat_…')}"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-cfg="tok">${esc(t('Kaydet ve bağlan','Save and connect'))}</button>${CFG.token?`<button class="btn danger" type="button" data-cfg="untok">${esc(t('Bağlantıyı kes','Disconnect'))}</button>`:''}</div>
    <details><summary><b>${esc(t('Anahtar nasıl alınır? (ekipteki her kişi bir kez)','How to get a token (once per team member)'))}</b></summary><ol style="margin:8px 0;padding-left:20px;font-size:13.5px;line-height:1.55">
      <li>${t('Depo sahibi, ekip arkadaşını GitHub’da <b>Settings → Collaborators → Add people</b> ile depoya ekler.','The repository owner adds the teammate under <b>Settings → Collaborators → Add people</b>.')}</li>
      <li>${t('Kişi kendi hesabıyla <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> sayfasını açar.','The person opens <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> with their own account.')}</li>
      <li>${t(`<b>Resource owner</b>: ${esc(GH.owner)} · <b>Repository access</b>: Only select repositories → <b>${esc(GH.repo)}</b>`,`<b>Resource owner</b>: ${esc(GH.owner)} · <b>Repository access</b>: Only select repositories → <b>${esc(GH.repo)}</b>`)}</li>
      <li>${t('<b>Permissions → Repository permissions → Contents: Read and write</b>. Süre: 1 yıl önerilir.','<b>Permissions → Repository permissions → Contents: Read and write</b>. Expiry: 1 year recommended.')}</li>
      <li>${t('“Generate token” → çıkan <code>github_pat_…</code> metnini kopyalayıp yukarıya yapıştırın. Telefonda ve bilgisayarda ayrı ayrı bir kez girilir.','“Generate token” → copy the <code>github_pat_…</code> text and paste it above. Enter it once on each device.')}</li></ol></details>
  </div></div>
  <div class="card"><header><h3>2 · ${esc(t('Yapay zeka (AI özellikleri için)','AI (for AI features)'))}</h3><span class="conn ${LLM.ready()?'ok':'off'}" style="position:static"><i></i><span>${esc(LLM.ready()?t('hazır','ready'):t('anahtar yok','no key'))}</span></span></header><div class="cbody">
    <p class="hint" style="margin:0">${esc(t('Formda “AI ile nihai promptu üret”, dosya analizi, boş alanları AI ile doldurma, Prompt İyileştirme ve dosyadan AI ile ayıklama bu anahtarla çalışır. Anthropic API ücretli bir hizmettir; kullanım kadar ödenir.','“Generate final prompt with AI”, file analysis, AI auto-fill, Prompt Improvement and AI extraction use this key. The Anthropic API is a paid, pay-as-you-go service.'))}</p>
    <div class="fld"><label for="cfgAi">${esc(t('Anthropic API anahtarı','Anthropic API key'))}</label><input id="cfgAi" type="password" autocomplete="off" placeholder="${esc(CFG.aiKey?mask(CFG.aiKey):'sk-ant-…')}"><span class="hint"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API Keys</a></span></div>
    <div class="fld"><label for="cfgM1">${esc(t('Model (günlük işler)','Model (everyday tasks)'))}</label><input id="cfgM1" value="${esc(CFG.aiModel)}" class="mono"></div>
    <div class="fld"><label for="cfgM2">${esc(t('Model (nihai prompt ve iyileştirme)','Model (final prompt and improvement)'))}</label><input id="cfgM2" value="${esc(CFG.aiModelBig)}" class="mono"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-cfg="ai">${esc(t('Kaydet','Save'))}</button>${CFG.aiKey?`<button class="btn" type="button" data-cfg="aitest">${esc(t('Dene','Test'))}</button><button class="btn danger" type="button" data-cfg="unai">${esc(t('Anahtarı sil','Remove key'))}</button>`:''}</div>
    <p class="hint" style="margin:0">${esc(t('Anahtar olmadan da panel tam çalışır: form ön promptu üretir, siz Claude sohbetine yapıştırırsınız.','The panel works without a key too: the form builds the pre-prompt and you paste it into a Claude chat.'))}</p>
  </div></div>
  <div class="card"><header><h3>3 · ${esc(t('Dil ve veriler','Language and data'))}</h3></header><div class="cbody">
    <div class="fld"><label>${esc(t('Panel dili','Panel language'))}</label><div class="seg"><button type="button" data-lang="tr" aria-pressed="${!isEN()}">Türkçe</button><button type="button" data-lang="en" aria-pressed="${isEN()}">English</button></div></div>
    <p class="hint" style="margin:0">${esc(t('Son eşitleme','Last sync'))}: ${STATE.cachedAt?fmtDate(STATE.cachedAt):'—'} · ${esc(STATE.source==='api'?'GitHub API':STATE.source==='raw'?t('GitHub (salt okunur)','GitHub (read-only)'):t('cihaz önbelleği','device cache'))}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-cfg="reload">${esc(t('Verileri yeniden yükle','Reload data'))}</button><button class="btn" type="button" data-cfg="backup">${esc(t('Tüm verileri Excel’e yedekle','Back up all data to Excel'))}</button></div>
  </div></div>
  <div class="card"><header><h3>4 · ${esc(t('Uygulama olarak kur','Install as an app'))}</h3></header><div class="cbody" style="font-size:13.5px;line-height:1.55">
    <p style="margin:0">${esc(t('Panel adresi','Panel address'))}: <a href="${PANEL_WEB}" target="_blank" rel="noopener">${esc(PANEL_WEB)}</a></p>
    <p style="margin:0"><b>iPhone / iPad:</b> ${esc(t('Safari’de adresi açın → Paylaş (kare ve ok) → “Ana Ekrana Ekle” → Ekle. Panel ana ekranda uygulama gibi açılır.','Open the address in Safari → Share (square with arrow) → “Add to Home Screen” → Add. It opens like an app.'))}</p>
    <p style="margin:0"><b>${esc(t('Bilgisayar','Desktop'))}:</b> ${esc(t('Chrome veya Edge’de adres çubuğundaki “Yükle” simgesine basın (veya menü → “Uygulamayı yükle”). Mac Safari: Dosya → “Dock’a Ekle”.','In Chrome or Edge press the “Install” icon in the address bar (or menu → “Install app”). Mac Safari: File → “Add to Dock”.'))}</p>
    <p style="margin:0"><b>Claude:</b> ${esc(t('Claude’daki “Evodak Prompt Asistanı” projesinde Claude bu depoyu doğrudan okuyup yazabilir: “Kod & Command’a şu komutu ekle” gibi isteklerde değişiklik aynı veriye işlenir ve panelde görünür.','In the “Evodak Prompt Asistanı” Claude project, Claude can read and write this repository directly: requests like “add this command to Code & Command” go into the same data and show up in the panel.'))}</p>
  </div></div>
  </div>`;
};
$('#v-ayar').addEventListener('click',async e=>{
  const b=e.target.closest('[data-cfg]');if(!b)return;const a=b.dataset.cfg;
  if(a==='tok'){const v=$('#cfgTok').value.trim();if(!v){toast(t('Anahtarı yapıştırın','Paste the token'));return}CFG.token=v;saveCfg();GH.user='';GH.canPush=false;b.disabled=true;
    try{await GH.whoami();toast(GH.canPush?t(`Bağlandı: ${GH.user} (yazabilir)`,`Connected: ${GH.user} (can write)`):t(`Bağlandı: ${GH.user} — ama bu depoya yazma izni yok`,`Connected: ${GH.user} — but no write access to this repository`),5000);banner('');await loadAll(true)}
    catch(err){toast(t('Anahtar çalışmadı: ','Token did not work: ')+err.message,6000);CFG.token='';saveCfg()}
    RENDER.ayar();connState();return}
  if(a==='untok'){CFG.token='';saveCfg();GH.user='';GH.canPush=false;connState();RENDER.ayar();toast(t('Bağlantı kesildi','Disconnected'));return}
  if(a==='ai'){const k=$('#cfgAi').value.trim();if(k)CFG.aiKey=k;CFG.aiModel=$('#cfgM1').value.trim()||'claude-sonnet-5-5';CFG.aiModelBig=$('#cfgM2').value.trim()||'claude-opus-5-5';saveCfg();toast(t('Kaydedildi','Saved'));RENDER.ayar();return}
  if(a==='unai'){CFG.aiKey='';saveCfg();RENDER.ayar();return}
  if(a==='aitest'){b.disabled=true;try{const r=await LLM.json('Bağlantı testi. {"ok":true} döndür.',{maxTokens:50});toast(r&&r.ok?t('AI bağlantısı çalışıyor','AI connection works'):t('Yanıt alındı','Got a reply'))}catch(err){toast(err.message,6000)}b.disabled=false;return}
  if(a==='reload'){await loadAll(true);RENDER.ayar();toast(t('Veriler yenilendi','Data reloaded'));return}
  if(a==='backup'){exportSheets('Evodak Prompt Asistanı - Yedek',[['kod','Kod & Command'],['kodref','Referans Bilgi'],['uzun','Uzun Prompt'],['rehber','Uygulama Rehberi'],['gecmis','Kayıtlı Promptlar'],['plat','AI Platform'],['model','Modeller']].map(([c,n])=>({name:n,rows:toRows(c,[...DATA[c].values()])})).concat([{name:'Değişiklik Günlüğü',rows:LOGARR.map(l=>({Tarih:l.at,Kişi:l.by,Bölüm:l.col,Kayıt:l.docId,İşlem:l.action,Başlık:l.title,Not:l.note||''}))}]));return}
});

/* ===== Hızlı ekle ===== */
$('#qadd').addEventListener('click',()=>{
  if(!guard())return;
  const opts=[['kod',t('Komut / prompt (Kod & Command)','Command / prompt (Code & Command)')],['kodref',t('Referans bilgi','Reference info')],['uzun',t('Uzun hazır prompt','Long ready-made prompt')],['gecmis',t('Kendi promptum','My own prompt')],['plat','AI platform']];
  modal({title:t('Hızlı ekle','Quick add'),ok:t('Devam','Continue'),body:`<div class="optchips" id="qaT">${opts.map(([k,l],i)=>`<button type="button" data-o="${k}" aria-pressed="${i===0}">${esc(l)}</button>`).join('')}</div><p class="hint" style="margin:0">${esc(t('Dosyadan toplu eklemek için Yükle & Aktar bölümünü kullanın.','Use Upload & Import to add many at once.'))}</p>`,
    onOk:h=>{const k=($('#qaT [aria-pressed="true"]',h)||{}).dataset.o||'kod';setTimeout(()=>{
      if(k==='kod')newRecord('kod',{tur:'Slash Komut',platform:'Claude',sektor:'Genel',dil:'TR',seviye:'Başlangıç'});else if(k==='kodref')newRecord('kodref',{refTur:'Rehber / Bilgi Notu',durum:'Yeni / İşlenmedi'});else if(k==='uzun')newRecord('uzun',{platform:ALL,sektor:'Genel'});else if(k==='gecmis')newRecord('gecmis',{tur:'Nihai prompt',durum:'Tamam',revNo:1,platform:[],dil:['Türkçe'],bagli:[]});else newRecord('plat',{durum:'AI-yerel',formGrup:[]})},0)}});
  $('#qaT').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#qaT button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
});
$('#qset').addEventListener('click',()=>go('ayar'));

/* ===== Dil ve başlatma ===== */
function applyLang(){
  document.documentElement.lang=UI.lang;
  $$('.top [data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===UI.lang));
  $('#gq').placeholder=t('Tüm panelde ara (komut, prompt, platform)','Search everything (commands, prompts, platforms)');
  $('#qset').textContent='⚙ '+t('Ayarlar','Settings');$('#qadd').textContent='+ '+t('Hızlı ekle','Quick add');
  connState();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(!b)return;const l=b.dataset.lang;if(l===UI.lang)return;UI.lang=l;LS.set('evd-lang',l);applyLang();formBuilt=false;if(DRAWER.open)renderDrawer();go(CUR,{relang:true})});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==CUR)go(h)});
async function boot(){
  applyLang();
  await cacheLoad();
  go(location.hash.slice(1)||'ana');
  await loadAll(false);
  if(CUR==='ayar')RENDER.ayar();
}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
boot();

})();
</script>
</body>
</html>
